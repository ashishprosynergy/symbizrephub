<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rep Hub — Symbiz Network</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2F5EC; --surface:#FFFFFF; --surface-2:#FAFBF6;
    --ink:#1E2A20; --ink-muted:#5A6455; --ink-faint:#8A9284;
    --line:#DCE0CE; --line-soft:#E9ECDF;
    --primary:#2E5132; --primary-ink:#FFFFFF; --primary-soft:#DDEADC;
    --accent:#AD7E21; --accent-soft:#F4E7C9;
    --rust:#A2452C; --rust-soft:#F5DCD3;
    --info:#2C5A6E; --info-soft:#D8E8EF;
    --radius:10px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141810; --surface:#1D2317; --surface-2:#232A1C;
      --ink:#EDEFE4; --ink-muted:#A4AC97; --ink-faint:#7C8472;
      --line:#323A2A; --line-soft:#2A3122;
      --primary:#7FB184; --primary-ink:#11170E; --primary-soft:#243120;
      --accent:#D9B160; --accent-soft:#3A3021;
      --rust:#E28C6B; --rust-soft:#3C241B;
      --info:#7FB4CB; --info-soft:#1E2E36;
    }
  }
  :root[data-theme="dark"]{
    --bg:#141810; --surface:#1D2317; --surface-2:#232A1C;
    --ink:#EDEFE4; --ink-muted:#A4AC97; --ink-faint:#7C8472;
    --line:#323A2A; --line-soft:#2A3122;
    --primary:#7FB184; --primary-ink:#11170E; --primary-soft:#243120;
    --accent:#D9B160; --accent-soft:#3A3021;
    --rust:#E28C6B; --rust-soft:#3C241B;
    --info:#7FB4CB; --info-soft:#1E2E36;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  :root{--serif:'Fraunces',Georgia,serif;--sans:'Work Sans',system-ui,sans-serif}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;font-size:15px;}
  h1,h2,h3,.wordmark{font-family:var(--serif);font-weight:500;letter-spacing:-.012em;margin:0;}
  button{font-family:inherit;} a{color:inherit;}
  :focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important;}}
  .ring-mark circle{fill:none;stroke:currentColor;}

  /* Netlify's badge sits bottom-right and covers the mobile tab bar. Lift the
     bar above it, and keep the badge clear of the tabs. */
  @media (max-width:900px){
    .tabbar{ padding-bottom: calc(6px + env(safe-area-inset-bottom)); }
    [class*="netlify-badge"], #netlify-badge, a[href*="netlify.com"][target="_blank"]{
      bottom: 68px !important; opacity:.5; transform:scale(.85); transform-origin:bottom right;
    }
  }


  /* Local mode: switch between people, since there's no sign-in */
  .viewas{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-muted);}
  .viewas span{white-space:nowrap;font-weight:600;letter-spacing:.02em;}
  .viewas .sel{max-width:230px;}
  @media (max-width:760px){ .viewas span{display:none;} .viewas .sel{max-width:150px;font-size:12.5px;} }
  /* ── month calendar ── */
.cal-head{display:flex;align-items:center;gap:9px;margin:14px 0 10px;flex-wrap:wrap}
.cal-head strong{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:-.01em;min-width:140px}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.cal-dow div{font-family:var(--serif);font-size:12px;font-weight:600;color:var(--ink-muted);
  text-align:center;letter-spacing:.07em;padding:5px 0;text-transform:uppercase}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-cell{background:var(--card);border:1px solid var(--line);border-radius:8px;
  min-height:104px;padding:6px 6px 5px;overflow:hidden;transition:box-shadow .12s,border-color .12s;
  display:flex;flex-direction:column;gap:2px}
.cal-out{background:transparent;border-color:transparent;box-shadow:none}
.cal-has{cursor:pointer}
.cal-has:hover{border-color:var(--primary);box-shadow:0 2px 10px rgba(46,81,50,.10)}
.cal-today{border-color:var(--primary);border-width:2px;padding:5px;background:var(--primary-soft)}
.cal-today .cal-num{background:var(--primary);color:#fff;border-radius:50%;
  width:21px;height:21px;line-height:21px;text-align:center;font-weight:700;margin-left:auto}
.cal-top{display:flex;align-items:center;justify-content:space-between;flex-shrink:0;min-height:18px}
.cal-num{font-family:var(--serif);font-size:14px;font-weight:600;color:var(--ink-muted);
  margin-left:auto;letter-spacing:-.01em;line-height:1.1}
.cal-add{opacity:0;background:var(--primary-soft);color:var(--primary);border:0;border-radius:5px;
  width:19px;height:19px;line-height:1;font-size:14px;cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center;transition:opacity .12s,background .12s}
.cal-cell:hover .cal-add{opacity:1}
.cal-add:hover{background:var(--primary);color:#fff}
.cal-open{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
.cal-cell{cursor:pointer}
.cal-chip{font-size:11px;line-height:1.35;border-radius:5px;padding:3px 6px;
  display:flex;align-items:baseline;gap:5px;overflow:hidden;font-weight:500;
  letter-spacing:-.005em}
.cal-chip .cal-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-time{font-weight:700;font-size:10px;opacity:.8;flex-shrink:0;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cal-chip.k-event{background:var(--rust-soft);color:var(--rust)}
.cal-chip.k-visit{background:var(--info-soft);color:var(--info)}
.cal-chip.k-meeting{background:var(--primary-soft);color:var(--primary)}
.cal-chip.k-meeting.held{background:var(--primary);color:#fff}
.cal-dot{width:7px;height:7px;border-radius:2px;flex-shrink:0;display:inline-block}
.cal-more{font-size:9.5px;color:var(--ink-muted);padding-left:5px}
.cal-key{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--ink-muted)}
.cal-key span{display:flex;align-items:center;gap:5px}
@media (max-width:760px){
  .cal-grid,.cal-dow{gap:3px}
  .cal-cell{min-height:62px;padding:4px}
  .cal-chip{padding:2px 3px;font-size:0;min-height:5px}
  .cal-chip .cal-time,.cal-chip .cal-txt{display:none}
  .cal-more{font-size:9px}
}
.pw-wrap{position:relative;display:flex;align-items:center}
.pw-wrap input{width:100%;padding-right:42px}
.pw-eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);
  background:transparent;border:0;cursor:pointer;color:var(--ink-muted);
  padding:7px 8px;border-radius:6px;display:flex;align-items:center;
  transition:color .12s,background .12s}
.pw-eye:hover{color:var(--primary);background:var(--bg)}
.pw-eye:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
/* ── rep manager ── */
.mgr-top{display:flex;gap:0;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:4px;margin-bottom:14px}
.mgr-fig{flex:1;min-width:92px;padding:11px 12px;text-align:center;position:relative}
.mgr-fig+.mgr-fig::before{content:'';position:absolute;left:0;top:22%;height:56%;width:1px;background:var(--line)}
.mgr-n{font-family:var(--serif);font-size:25px;font-weight:600;line-height:1.05;letter-spacing:-.02em}
.mgr-l{font-size:11px;color:var(--ink-muted);margin-top:3px;letter-spacing:.01em}

.segs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.otp{font-family:ui-monospace,Menlo,monospace;font-size:26px;letter-spacing:.3em;
  text-align:center;font-weight:700}
.seg{display:flex;align-items:baseline;gap:6px;border:1px solid var(--line);background:var(--card);
  border-radius:999px;padding:7px 14px;cursor:pointer;font:inherit;transition:all .12s}
.seg:hover{border-color:var(--ink-muted)}
.seg.on{border-color:var(--primary);background:var(--primary)}
.seg.on .seg-n,.seg.on .seg-l{color:#fff}
.seg-n{font-weight:700;font-size:14px;color:var(--ink)}
.seg-l{font-size:12.5px;color:var(--ink)}
.seg-rust:not(.on) .seg-n{color:var(--rust)}
.seg-amber:not(.on) .seg-n{color:#A07A28}
.seg-green:not(.on) .seg-n{color:var(--primary)}

.mgr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.mgr-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 16px;
  transition:box-shadow .14s,border-color .14s}
.mgr-card:hover{box-shadow:0 3px 14px rgba(30,42,32,.07)}
.mgr-card.open{border-color:var(--primary);box-shadow:0 3px 18px rgba(46,81,50,.10)}
.mgr-head{display:flex;gap:11px;align-items:center;margin-bottom:11px}
.pill{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:999px;letter-spacing:.01em;white-space:nowrap}
.pill-rust{background:var(--rust-soft);color:var(--rust)}
.pill-amber{background:#F6EEDC;color:#8A6618}
.pill-green{background:var(--primary-soft);color:var(--primary)}
.pill-neutral{background:var(--bg);color:var(--ink-muted)}
.load{height:5px;background:var(--bg);border-radius:999px;overflow:hidden}
.load span{display:block;height:100%;border-radius:999px;transition:width .3s}

.mgr-nums{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.num{background:var(--bg);border:1px solid transparent;border-radius:9px;padding:8px 4px;cursor:pointer;
  font:inherit;display:flex;flex-direction:column;align-items:center;gap:1px;transition:all .12s}
.num:hover{border-color:var(--line);background:var(--card)}
.num.on{border-color:var(--primary);background:var(--primary-soft)}
.num-n{font-size:18px;font-weight:700;line-height:1.1}
.num-l{font-size:10px;color:var(--ink-muted);text-align:center;line-height:1.2}
.num-rust .num-n{color:var(--rust)}
.num-green .num-n{color:var(--primary)}
.num-mute .num-n{color:var(--ink-muted)}
.mgr-detail{margin-top:11px;padding-top:11px;border-top:1px solid var(--line);max-height:260px;overflow:auto}
@media (max-width:640px){ .mgr-grid{grid-template-columns:1fr} .mgr-fig{min-width:33%} }

/* ── event attendees ── */
.att-top{display:flex;gap:0;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:4px;margin-top:12px}
.att-fig{flex:1;min-width:84px;padding:10px;text-align:center;position:relative}
.att-fig+.att-fig::before{content:'';position:absolute;left:0;top:22%;height:56%;width:1px;background:var(--line)}
.att{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.att:last-child{border-bottom:0}
.att-av{width:32px;height:32px;border-radius:50%;background:var(--primary-soft);color:var(--primary);
  display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex-shrink:0}
.att-name{font-weight:600;font-size:14px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.att-sub{font-size:12px;color:var(--ink-muted);margin-top:2px}
.att-actions{display:flex;gap:5px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){ .att{flex-wrap:wrap} .att-actions{width:100%;justify-content:flex-start;padding-left:43px} }

.mgr-stat{background:transparent;border:1px solid transparent;border-radius:8px;
  padding:6px 10px;min-width:72px;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:1px;font:inherit;transition:background .12s,border-color .12s}
.mgr-stat:hover{background:var(--bg);border-color:var(--line)}
.mgr-stat.on{background:var(--primary-soft);border-color:var(--primary)}
@media print{.viewas{display:none;}}


  /* Guided walkthrough bar */
  .tourbar{position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--ink);color:var(--bg);
    padding:13px 18px calc(13px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,.2);}
  .tour-inner{max-width:1000px;margin:0 auto;display:flex;gap:16px;align-items:center;}
  .tour-step{font-size:11.5px;font-weight:700;letter-spacing:.04em;opacity:.65;white-space:nowrap;}
  .tour-text{flex:1;min-width:0;font-size:13.5px;line-height:1.45;}
  .tour-text strong{display:block;font-family:'Fraunces',serif;font-size:15px;font-weight:500;margin-bottom:2px;}
  .tour-text span{opacity:.82;}
  .tour-btns{display:flex;gap:7px;flex-shrink:0;}
  .tourbar .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.22);color:var(--bg);}
  .tourbar .btn.primary{background:var(--bg);border-color:var(--bg);color:var(--ink);}
  .tourbar .btn.ghost{background:none;border-color:transparent;color:var(--bg);opacity:.7;}
  body:has(.tourbar) .tabbar{bottom:96px;}
  @media (max-width:760px){
    .tour-inner{flex-wrap:wrap;gap:9px;}
    .tour-text{order:3;width:100%;font-size:13px;}
    .tour-btns{margin-left:auto;}
  }

.att-fig{flex:1;min-width:84px;padding:10px;text-align:center;position:relative}
.att-fig+.att-fig::before{content:'';position:absolute;left:0;top:22%;height:56%;width:1px;background:var(--line)}
.att{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.att:last-child{border-bottom:0}
.att-av{width:32px;height:32px;border-radius:50%;background:var(--primary-soft);color:var(--primary);
  display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex-shrink:0}
.att-name{font-weight:600;font-size:14px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.att-sub{font-size:12px;color:var(--ink-muted);margin-top:2px}
.att-actions{display:flex;gap:5px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){ .att{flex-wrap:wrap} .att-actions{width:100%;justify-content:flex-start;padding-left:43px} }

.mgr-stat{background:transparent;border:1px solid transparent;border-radius:8px;
  padding:6px 10px;min-width:72px;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:1px;font:inherit;transition:background .12s,border-color .12s}
.mgr-stat:hover{background:var(--bg);border-color:var(--line)}
.mgr-stat.on{background:var(--primary-soft);border-color:var(--primary)}
@media print{.tourbar{display:none;}}


  /* ── Tablet (Mel's question): keep the sidebar, widen touch targets ── */
  @media (min-width:901px) and (max-width:1180px){
    .rail{width:200px;padding:20px 11px;}
    .content{padding:20px 20px 90px;max-width:none;}
    .stats{grid-template-columns:repeat(auto-fit,minmax(130px,1fr));}
  }
  /* Touch devices: nothing smaller than ~44px to tap, per Apple/Android guidance */
  @media (pointer:coarse){
    .btn{padding:11px 16px;font-size:14.5px;}
    .btn.sm{padding:9px 13px;font-size:13.5px;}
    .rail-link{padding:11px 11px;}
    .row{padding:15px 0;}
    .chip{padding:8px 15px;}
    .field input,.field select,.field textarea{padding:12px 12px;font-size:16px;}
    .choice{padding:10px 14px;}
    .tabbar button{padding:9px 4px;}
    .check input{width:20px;height:20px;}
  }
  /* Landscape tablet with the on-screen keyboard up */
  @media (max-height:520px) and (pointer:coarse){
    .modal{max-height:95vh;}
  }


  /* login */
  .login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-box{width:100%;max-width:370px;}
  .login-brand{display:flex;align-items:center;gap:11px;color:var(--primary);margin-bottom:8px;}
  .login-brand .wordmark{font-size:23px;color:var(--ink);}
  .login p.tag{color:var(--ink-muted);font-size:14px;margin:0 0 26px;line-height:1.55;}
  .login .card{padding:20px;}
  .who-pick{display:flex;flex-direction:column;gap:7px;margin-bottom:6px;}
  .who-btn{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--line);border-radius:9px;background:var(--surface);cursor:pointer;text-align:left;width:100%;}
  .who-btn:hover{border-color:var(--primary);}
  .who-av{width:34px;height:34px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
  .who-btn .nm{font-weight:600;font-size:14.5px;} .who-btn .rl{font-size:12.5px;color:var(--ink-muted);}

  .shell{display:flex;min-height:100vh;max-width:1280px;margin:0 auto;}
  .rail{width:232px;flex-shrink:0;padding:22px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;}
  .rail-brand{display:flex;align-items:center;gap:10px;color:var(--primary);margin-bottom:8px;padding-left:6px;}
  .rail-brand .wordmark{font-size:18px;color:var(--ink);}
  .rail-me{display:flex;align-items:center;gap:9px;padding:8px 6px 14px;margin-bottom:8px;border-bottom:1px solid var(--line);}
  .rail-me .nm{font-size:13.5px;font-weight:600;} .rail-me .rl{font-size:12px;color:var(--ink-muted);}
  .rail-nav{display:flex;flex-direction:column;gap:1px;overflow-y:auto;}
  .nav-grp{font-size:11px;font-weight:700;color:var(--ink-faint);letter-spacing:.04em;padding:12px 11px 5px;}
  .rail-link{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 11px;border-radius:8px;color:var(--ink-muted);font-size:14px;font-weight:500;cursor:pointer;border:none;background:none;text-align:left;width:100%;}
  .rail-link.active{background:var(--primary-soft);color:var(--primary);font-weight:600;}
  .rail-link:hover:not(.active){background:var(--line-soft);color:var(--ink);}
  .rail-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);}
  .pill{background:var(--rust);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px;min-width:19px;text-align:center;}
  .pill.muted{background:var(--line);color:var(--ink-muted);}
  .rail-link.active .pill.muted{background:var(--primary);color:var(--primary-ink);}

  .main{flex:1;min-width:0;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:13px 24px;border-bottom:1px solid var(--line);gap:12px;}
  .gsearch{flex:1;max-width:330px;position:relative;}
  .gsearch input{width:100%;font-family:inherit;font-size:13.5px;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);}
  .gres{position:absolute;top:calc(100% + 5px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 26px rgba(0,0,0,.12);max-height:330px;overflow-y:auto;z-index:35;display:none;}
  .gres.open{display:block;}
  .gres-item{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line-soft);}
  .gres-item:last-child{border-bottom:none;}
  .gres-item:hover{background:var(--surface-2);}
  .gres-item .t{font-size:13.5px;font-weight:600;} .gres-item .s{font-size:12px;color:var(--ink-muted);}
  .top-right{display:flex;align-items:center;gap:8px;}
  .bell{position:relative;background:none;border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;color:var(--ink);font-size:14px;}
  .bell .pill{position:absolute;top:-6px;right:-6px;}
  .banner{font-size:13px;padding:9px 24px;border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:center;}
  .banner.sync{background:var(--info-soft);color:var(--info);}
  .banner.note{background:var(--accent-soft);color:var(--accent);}
  .content{padding:22px 24px 100px;max-width:790px;}

  .tabbar{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);padding:4px 2px calc(4px + env(safe-area-inset-bottom));justify-content:space-around;z-index:20;}
  .tabbar button{background:none;border:none;color:var(--ink-muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;padding:6px 4px;border-radius:8px;cursor:pointer;position:relative;flex:1;}
  .tabbar button.active{color:var(--primary);font-weight:600;}
  .tabbar .pill{position:absolute;top:0;right:20%;font-size:9.5px;padding:0 5px;}
  @media (max-width:900px){
    .rail{display:none;} .tabbar{display:flex;}
    .content{padding:16px 15px 96px;} .topbar{padding:11px 15px;} .banner{padding:9px 15px;}
  }

  .section-head{margin-bottom:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  .section-head h2{font-size:21px;}
  .section-head .sub{margin-top:3px;color:var(--ink-muted);font-size:13.5px;line-height:1.5;}
  h3.sub-h{font-size:15px;margin:24px 0 8px;}
  h3.sub-h:first-child{margin-top:0;}

  .row{padding:12px 0;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .row:last-child{border-bottom:none;}
  .row-main{min-width:0;flex:1;}
  .row-title{font-weight:600;font-size:14.5px;}
  .row-sub{color:var(--ink-muted);font-size:12.8px;margin-top:2px;line-height:1.5;}
  .row-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}

  .tag{font-size:11.5px;font-weight:600;white-space:nowrap;padding:2px 8px;border-radius:5px;display:inline-block;}
  .tag.overdue{background:var(--rust-soft);color:var(--rust);}
  .tag.soon{background:var(--accent-soft);color:var(--accent);}
  .tag.later{background:var(--line-soft);color:var(--ink-muted);}
  .tag.ok{background:var(--primary-soft);color:var(--primary);}
  .tag.info{background:var(--info-soft);color:var(--info);}

  .status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;white-space:nowrap;}
  .status .dot{width:7px;height:7px;border-radius:50%;}
  .status.active{color:var(--primary);} .status.active .dot{background:var(--primary);}
  .status.pending{color:var(--accent);} .status.pending .dot{background:var(--accent);}
  .status.rejected{color:var(--rust);} .status.rejected .dot{background:var(--rust);}
  .status.discontinued,.status.paused{color:var(--ink-faint);} .status.discontinued .dot,.status.paused .dot{background:var(--ink-faint);}

  .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;font-size:13.5px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;}
  .btn:hover{border-color:var(--ink-faint);}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink);}
  .btn.primary:hover{opacity:.92;}
  .btn.danger{color:var(--rust);border-color:var(--rust-soft);background:var(--rust-soft);}
  .btn.sm{padding:5px 10px;font-size:12.5px;}
  .btn.ghost{border-color:transparent;background:none;}
  .btn[disabled]{opacity:.45;cursor:not-allowed;}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;}

  .card{border:1px solid var(--line);border-radius:var(--radius);padding:15px;background:var(--surface);margin-bottom:11px;}
  .card.flat{background:var(--surface-2);}
  .callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:11px 13px;border-radius:0 8px 8px 0;font-size:13.5px;margin:10px 0 14px;line-height:1.55;}
  .callout.rust{border-left-color:var(--rust);background:var(--rust-soft);}
  .callout.info{border-left-color:var(--info);background:var(--info-soft);}
  .callout.ok{border-left-color:var(--primary);background:var(--primary-soft);}
  .callout strong{display:block;margin-bottom:2px;}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:10px;margin-bottom:22px;}
  .stat{border:1px solid var(--line);border-radius:var(--radius);padding:11px 12px;background:var(--surface);}
  .stat .n{font-family:'Fraunces',serif;font-size:26px;font-weight:500;line-height:1.05;}
  .stat .l{font-size:11.8px;color:var(--ink-muted);margin-top:3px;line-height:1.35;}
  .stat.click{cursor:pointer;} .stat.click:hover{border-color:var(--primary);}

  .field{margin-bottom:13px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px;}
  .field .hint{font-size:12px;color:var(--ink-muted);margin-top:4px;line-height:1.45;}
  .field input,.field select,.field textarea{width:100%;font-family:inherit;font-size:14.5px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);}
  .field textarea{resize:vertical;min-height:64px;}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
  @media (max-width:520px){.two{grid-template-columns:1fr;}}
  .choices{display:flex;flex-wrap:wrap;gap:6px;}
  .choice{border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:13px;cursor:pointer;background:var(--surface);color:var(--ink);font-weight:500;}
  .choice.on{background:var(--primary);border-color:var(--primary);color:var(--primary-ink);font-weight:600;}

  .clicky{cursor:pointer;}
  .clicky:hover .row-title{text-decoration:underline;}
  .glyph{color:var(--primary);flex-shrink:0;}
  .glyph.pending{color:var(--accent);} .glyph.rejected{color:var(--rust);}
  .av{width:32px;height:32px;border-radius:50%;background:var(--line-soft);color:var(--ink-muted);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;}

  .empty{padding:24px 2px;color:var(--ink-muted);font-size:14px;border-top:1px dashed var(--line);line-height:1.6;}
  .back{display:inline-flex;align-items:center;gap:5px;color:var(--ink-muted);font-size:13px;font-weight:600;margin-bottom:13px;cursor:pointer;background:none;border:none;padding:0;}
  .back:hover{color:var(--ink);}

  .bar{height:7px;background:var(--line-soft);border-radius:4px;overflow:hidden;margin-top:6px;}
  .bar span{display:block;height:100%;background:var(--primary);border-radius:4px;}
  .bar.warn span{background:var(--accent);} .bar.bad span{background:var(--rust);}

  .overlay{position:fixed;inset:0;background:rgba(18,22,15,.45);display:none;align-items:flex-end;justify-content:center;z-index:40;}
  .overlay.open{display:flex;}
  .modal{background:var(--surface);width:100%;max-width:490px;border-radius:15px 15px 0 0;padding:21px 19px 23px;max-height:90vh;overflow-y:auto;}
  @media (min-width:640px){.overlay{align-items:center;} .modal{border-radius:13px;}}
  .modal h3{font-size:18px;margin-bottom:5px;}
  .modal .lead{font-size:13px;color:var(--ink-muted);margin:0 0 15px;line-height:1.5;}
  .m-actions{display:flex;gap:9px;margin-top:6px;justify-content:flex-end;flex-wrap:wrap;}

  .sheet{position:fixed;top:0;right:0;bottom:0;width:348px;max-width:89vw;background:var(--surface);border-left:1px solid var(--line);z-index:45;padding:18px 16px;overflow-y:auto;transform:translateX(100%);transition:transform .18s ease;}
  .sheet.open{transform:translateX(0);}
  .sheet h3{font-size:17px;}

  .toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:7px;align-items:center;}
  .toast{background:var(--ink);color:var(--bg);padding:10px 15px;border-radius:8px;font-size:13.5px;font-weight:500;box-shadow:0 6px 18px rgba(0,0,0,.2);animation:tin .16s ease-out;max-width:90vw;}
  @keyframes tin{from{opacity:0;transform:translateY(-5px);}to{opacity:1;transform:translateY(0);}}

  .srch{width:100%;font-family:inherit;font-size:14.5px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);margin-bottom:12px;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:13px;}
  .chip{border:1px solid var(--line);background:var(--surface);color:var(--ink-muted);border-radius:20px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer;}
  .chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg);}
  .check{display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:14px;cursor:pointer;}
  .check:last-child{border-bottom:none;}
  .check input{margin-top:3px;width:16px;height:16px;flex-shrink:0;accent-color:var(--primary);}
  .check.done span{color:var(--ink-faint);text-decoration:line-through;}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:13.5px;border-bottom:1px solid var(--line-soft);}
  .kv:last-child{border-bottom:none;}
  .kv .k{color:var(--ink-muted);}

  .lanes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  @media (max-width:640px){.lanes{grid-template-columns:1fr;}}
  .lane{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px;}
  .lane h4{margin:0 0 9px;font-size:12.5px;font-weight:700;color:var(--ink-muted);display:flex;justify-content:space-between;}
  .lane-card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:7px;}
  .lane-card .t{font-size:13.5px;font-weight:600;} .lane-card .s{font-size:12px;color:var(--ink-muted);margin-top:2px;}

  /* ── month calendar ── */
.cal-head{display:flex;align-items:center;gap:9px;margin:14px 0 10px;flex-wrap:wrap}
.cal-head strong{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:-.01em;min-width:140px}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.cal-dow div{font-family:var(--serif);font-size:12px;font-weight:600;color:var(--ink-muted);
  text-align:center;letter-spacing:.07em;padding:5px 0;text-transform:uppercase}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-cell{background:var(--card);border:1px solid var(--line);border-radius:8px;
  min-height:104px;padding:6px 6px 5px;overflow:hidden;transition:box-shadow .12s,border-color .12s;
  display:flex;flex-direction:column;gap:2px}
.cal-out{background:transparent;border-color:transparent;box-shadow:none}
.cal-has{cursor:pointer}
.cal-has:hover{border-color:var(--primary);box-shadow:0 2px 10px rgba(46,81,50,.10)}
.cal-today{border-color:var(--primary);border-width:2px;padding:5px;background:var(--primary-soft)}
.cal-today .cal-num{background:var(--primary);color:#fff;border-radius:50%;
  width:21px;height:21px;line-height:21px;text-align:center;font-weight:700;margin-left:auto}
.cal-top{display:flex;align-items:center;justify-content:space-between;flex-shrink:0;min-height:18px}
.cal-num{font-family:var(--serif);font-size:14px;font-weight:600;color:var(--ink-muted);
  margin-left:auto;letter-spacing:-.01em;line-height:1.1}
.cal-add{opacity:0;background:var(--primary-soft);color:var(--primary);border:0;border-radius:5px;
  width:19px;height:19px;line-height:1;font-size:14px;cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center;transition:opacity .12s,background .12s}
.cal-cell:hover .cal-add{opacity:1}
.cal-add:hover{background:var(--primary);color:#fff}
.cal-open{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
.cal-cell{cursor:pointer}
.cal-chip{font-size:11px;line-height:1.35;border-radius:5px;padding:3px 6px;
  display:flex;align-items:baseline;gap:5px;overflow:hidden;font-weight:500;
  letter-spacing:-.005em}
.cal-chip .cal-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-time{font-weight:700;font-size:10px;opacity:.8;flex-shrink:0;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cal-chip.k-event{background:var(--rust-soft);color:var(--rust)}
.cal-chip.k-visit{background:var(--info-soft);color:var(--info)}
.cal-chip.k-meeting{background:var(--primary-soft);color:var(--primary)}
.cal-chip.k-meeting.held{background:var(--primary);color:#fff}
.cal-dot{width:7px;height:7px;border-radius:2px;flex-shrink:0;display:inline-block}
.cal-more{font-size:9.5px;color:var(--ink-muted);padding-left:5px}
.cal-key{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--ink-muted)}
.cal-key span{display:flex;align-items:center;gap:5px}
@media (max-width:760px){
  .cal-grid,.cal-dow{gap:3px}
  .cal-cell{min-height:62px;padding:4px}
  .cal-chip{padding:2px 3px;font-size:0;min-height:5px}
  .cal-chip .cal-time,.cal-chip .cal-txt{display:none}
  .cal-more{font-size:9px}
}
.pw-wrap{position:relative;display:flex;align-items:center}
.pw-wrap input{width:100%;padding-right:42px}
.pw-eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);
  background:transparent;border:0;cursor:pointer;color:var(--ink-muted);
  padding:7px 8px;border-radius:6px;display:flex;align-items:center;
  transition:color .12s,background .12s}
.pw-eye:hover{color:var(--primary);background:var(--bg)}
.pw-eye:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
/* ── rep manager ── */
.mgr-top{display:flex;gap:0;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:4px;margin-bottom:14px}
.mgr-fig{flex:1;min-width:92px;padding:11px 12px;text-align:center;position:relative}
.mgr-fig+.mgr-fig::before{content:'';position:absolute;left:0;top:22%;height:56%;width:1px;background:var(--line)}
.mgr-n{font-family:var(--serif);font-size:25px;font-weight:600;line-height:1.05;letter-spacing:-.02em}
.mgr-l{font-size:11px;color:var(--ink-muted);margin-top:3px;letter-spacing:.01em}

.segs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.otp{font-family:ui-monospace,Menlo,monospace;font-size:26px;letter-spacing:.3em;
  text-align:center;font-weight:700}
.seg{display:flex;align-items:baseline;gap:6px;border:1px solid var(--line);background:var(--card);
  border-radius:999px;padding:7px 14px;cursor:pointer;font:inherit;transition:all .12s}
.seg:hover{border-color:var(--ink-muted)}
.seg.on{border-color:var(--primary);background:var(--primary)}
.seg.on .seg-n,.seg.on .seg-l{color:#fff}
.seg-n{font-weight:700;font-size:14px;color:var(--ink)}
.seg-l{font-size:12.5px;color:var(--ink)}
.seg-rust:not(.on) .seg-n{color:var(--rust)}
.seg-amber:not(.on) .seg-n{color:#A07A28}
.seg-green:not(.on) .seg-n{color:var(--primary)}

.mgr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.mgr-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 16px;
  transition:box-shadow .14s,border-color .14s}
.mgr-card:hover{box-shadow:0 3px 14px rgba(30,42,32,.07)}
.mgr-card.open{border-color:var(--primary);box-shadow:0 3px 18px rgba(46,81,50,.10)}
.mgr-head{display:flex;gap:11px;align-items:center;margin-bottom:11px}
.pill{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:999px;letter-spacing:.01em;white-space:nowrap}
.pill-rust{background:var(--rust-soft);color:var(--rust)}
.pill-amber{background:#F6EEDC;color:#8A6618}
.pill-green{background:var(--primary-soft);color:var(--primary)}
.pill-neutral{background:var(--bg);color:var(--ink-muted)}
.load{height:5px;background:var(--bg);border-radius:999px;overflow:hidden}
.load span{display:block;height:100%;border-radius:999px;transition:width .3s}

.mgr-nums{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.num{background:var(--bg);border:1px solid transparent;border-radius:9px;padding:8px 4px;cursor:pointer;
  font:inherit;display:flex;flex-direction:column;align-items:center;gap:1px;transition:all .12s}
.num:hover{border-color:var(--line);background:var(--card)}
.num.on{border-color:var(--primary);background:var(--primary-soft)}
.num-n{font-size:18px;font-weight:700;line-height:1.1}
.num-l{font-size:10px;color:var(--ink-muted);text-align:center;line-height:1.2}
.num-rust .num-n{color:var(--rust)}
.num-green .num-n{color:var(--primary)}
.num-mute .num-n{color:var(--ink-muted)}
.mgr-detail{margin-top:11px;padding-top:11px;border-top:1px solid var(--line);max-height:260px;overflow:auto}
@media (max-width:640px){ .mgr-grid{grid-template-columns:1fr} .mgr-fig{min-width:33%} }

/* ── event attendees ── */
.att-top{display:flex;gap:0;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:4px;margin-top:12px}
.att-fig{flex:1;min-width:84px;padding:10px;text-align:center;position:relative}
.att-fig+.att-fig::before{content:'';position:absolute;left:0;top:22%;height:56%;width:1px;background:var(--line)}
.att{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.att:last-child{border-bottom:0}
.att-av{width:32px;height:32px;border-radius:50%;background:var(--primary-soft);color:var(--primary);
  display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex-shrink:0}
.att-name{font-weight:600;font-size:14px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.att-sub{font-size:12px;color:var(--ink-muted);margin-top:2px}
.att-actions{display:flex;gap:5px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){ .att{flex-wrap:wrap} .att-actions{width:100%;justify-content:flex-start;padding-left:43px} }

.mgr-stat{background:transparent;border:1px solid transparent;border-radius:8px;
  padding:6px 10px;min-width:72px;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:1px;font:inherit;transition:background .12s,border-color .12s}
.mgr-stat:hover{background:var(--bg);border-color:var(--line)}
.mgr-stat.on{background:var(--primary-soft);border-color:var(--primary)}

    .rail,.tabbar,.topbar,.banner,.btnrow,.chips,.sheet,.overlay,.toasts,.back{display:none!important;}
    .content{padding:0;max-width:none;}

    .tbl-wrap{border:none;}
    table.rep th{border-bottom:1.5px solid #333;font-size:10px;}

    td.writein{border-bottom:1px solid #999;min-width:150px;}

  }
  td.writein{min-width:70px;}
  table.rep{width:100%;border-collapse:collapse;font-size:13px;}
  table.rep th{text-align:left;font-weight:700;color:var(--ink-muted);font-size:11.5px;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;}

<body>
<div id="app"></div>
<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()"><div class="modal" id="modalBody"></div></div>
<div class="sheet" id="sheet"></div>
<div class="toasts" id="toasts"></div>
<script>

/* ══════════════════ API CLIENT ══════════════════
 * Two modes, decided at sign-in:
 *   LOCAL  — everything in this browser. CSV import works, no server needed.
 *   SERVER — signs in against the API, reads and writes Zoho CRM.
 * The screens are identical either way; only where data lives changes.
 */
const API = {
  base: '/api',
  token: null,
  live: false,
  readOnly: false,
  init(){ try{ this.token = localStorage.getItem('rephub_token'); this.live = !!this.token; }catch(e){} },
  setToken(t){ this.token = t; this.live = !!t;
    try{ t ? localStorage.setItem('rephub_token', t) : localStorage.removeItem('rephub_token'); }catch(e){} },
  async call(path, opts = {}){
    const res = await fetch(this.base + path, { ...opts, headers: {
      'Content-Type':'application/json',
      ...(this.token ? { Authorization: 'Bearer ' + this.token } : {}),
      ...(opts.headers || {}) } });
    // A 401 on the login route means bad credentials; anywhere else it means
    // the session has lapsed. Treating them the same shows the wrong message.
    // A 401 on any /auth route is a real answer — wrong password, dead link,
    // bad code — and the message matters. Only elsewhere does it mean the
    // session lapsed. Treating them alike hid every sign-in error behind
    // "SESSION_EXPIRED".
    if(res.status === 401 && !path.startsWith('/auth/')){
      this.setToken(null); throw new Error('SESSION_EXPIRED');
    }
    if(!res.ok){ const b = await res.json().catch(()=>({})); throw new Error(b.error || ('Request failed: '+res.status)); }
    return res.status === 204 ? null : res.json();
  },
  login(email,password){ return this.call('/auth/login',{method:'POST',body:JSON.stringify({email,password})}); },
  requestLink(email){ return this.call('/auth/request-link',{method:'POST',body:JSON.stringify({email})}); },
  verifyLink(token){ return this.call('/auth/verify-link',{method:'POST',body:JSON.stringify({token})}); },
  forgot(email){ return this.call('/auth/forgot',{method:'POST',body:JSON.stringify({email})}); },
  verifyCode(email,code){ return this.call('/auth/verify-code',{method:'POST',body:JSON.stringify({email,code})}); },
  checkSetup(token){ return this.call('/auth/check-setup',{method:'POST',body:JSON.stringify({token})}); },
  setPassword(token,password){ return this.call('/auth/set-password',{method:'POST',body:JSON.stringify({token,password})}); },
  me(){ return this.call('/auth/me'); },
  rings(as){ return this.call('/rings' + (as ? '?as='+encodeURIComponent(as) : '')); },
  members(as){ return this.call('/members' + (as ? '?as='+encodeURIComponent(as) : '')); },
  activities(as){ return this.call('/activities' + (as ? '?as='+encodeURIComponent(as) : '')); },
  facilitators(){ return this.call('/facilitators'); },
  events(){ return this.call('/events'); },
  registrations(eventId){ return this.call('/events/'+eventId+'/registrations'); },
  visits(as){ return this.call('/visits' + (as ? '?as='+encodeURIComponent(as) : '')); },
  membersNoRingLive(){ return this.call('/members/no-ring'); },
  time(){ return this.call('/time'); },
  addTime(d){ return this.call('/time',{method:'POST',body:JSON.stringify(d)}); },
  approveTime(id){ return this.call('/time/'+id+'/approve',{method:'POST'}); },
  expenses(){ return this.call('/expenses'); },
  addExpense(d){ return this.call('/expenses',{method:'POST',body:JSON.stringify(d)}); },
  approveExpense(id){ return this.call('/expenses/'+id+'/approve',{method:'POST'}); },
  receipt(id){ return this.call('/expenses/'+id+'/receipt'); },
  accountingPending(){ return this.call('/accounting/pending'); },
  accountingSend(){ return this.call('/accounting/send',{method:'POST'}); },
  cyclePreview(){ return this.call('/cycle/preview'); },
  cycleStart(perWeek){ return this.call('/cycle/start',{method:'POST',body:JSON.stringify({perWeek})}); },
  bulkRings(ids,fields){ return this.call('/rings/bulk',{method:'PATCH',body:JSON.stringify({ids,fields})}); },
  resendLogin(id){ return this.call('/admin/users/'+id+'/resend',{method:'POST'}); },
  mailStatus(){ return this.call('/admin/mail-status'); },
  mailTest(to){ return this.call('/admin/mail-test',{method:'POST',body:JSON.stringify({to})}); },
  removeUser(id){ return this.call('/admin/users/'+id,{method:'DELETE'}); },
  pending(){ return this.call('/pending'); },
  askRegistration(d){ return this.call('/pending/registration',{method:'POST',body:JSON.stringify(d)}); },
  askCancellation(d){ return this.call('/pending/cancellation',{method:'POST',body:JSON.stringify(d)}); },
  askLead(d){ return this.call('/pending/lead',{method:'POST',body:JSON.stringify(d)}); },
  approvePending(id){ return this.call('/pending/'+id+'/approve',{method:'POST'}); },
  rejectPending(id,reason){ return this.call('/pending/'+id+'/reject',{method:'POST',body:JSON.stringify({reason})}); },
  membersNoRing(){ return this.call('/members/no-ring'); },
  createRing(d){ return this.call('/rings',{method:'POST',body:JSON.stringify(d)}); },
  updateRing(id,d){ return this.call('/rings/'+id,{method:'PATCH',body:JSON.stringify(d)}); },
  logActivity(d){ return this.call('/activities',{method:'POST',body:JSON.stringify(d)}); },
  logMeeting(d){ return this.call('/meetings',{method:'POST',body:JSON.stringify(d)}); },
  meetings(as){ return this.call('/meetings' + (as ? '?as='+encodeURIComponent(as) : '')); },
  pushQueue(items){ return this.call('/sync/push',{method:'POST',body:JSON.stringify({items})}); },
  health(){ return fetch(this.base+'/healthz').then(r=>r.json()).catch(()=>({ok:false})); },
  setupStatus(){ return this.call('/setup/status'); },
  setup(d){ return this.call('/setup',{method:'POST',body:JSON.stringify(d)}); },
  createUser(d){ return this.call('/admin/users',{method:'POST',body:JSON.stringify(d)}); },
  users(){ return this.call('/admin/users'); },
  repsFromZoho(){ return this.call('/admin/reps-from-zoho'); },
  createUserFromZoho(d){ return this.call('/admin/users/from-zoho',{method:'POST',body:JSON.stringify(d)}); },
  resetPassword(id){ return this.call('/admin/users/'+id+'/reset-password',{method:'POST'}); },
  removeUser(id){ return this.call('/admin/users/'+id,{method:'DELETE'}); }
};

/* Offline write queue — a rep with no signal keeps working. */
const OutBox = {
  KEY:'rephub_outbox',
  all(){ try{ return JSON.parse(localStorage.getItem(this.KEY)||'[]'); }catch(e){ return []; } },
  save(i){ try{ localStorage.setItem(this.KEY, JSON.stringify(i)); }catch(e){} },
  add(module,op,payload){ const i=this.all();
    i.push({clientUuid:uuid(),module,op,payload,at:Date.now()}); this.save(i); return i.length; },
  count(){ return this.all().length; },
  async flush(){
    if(!API.live) return {sent:0};
    const items=this.all(); if(!items.length) return {sent:0};
    try{ const o=await API.pushQueue(items); this.save([]); return {sent:o.accepted||0}; }
    catch(e){ return {sent:0,error:e.message}; }   // keep them, retry later
  }
};
function uuid(){
  try{ if(crypto && crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
  return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);
}
window.addEventListener('online', async ()=>{
  const o=await OutBox.flush();
  if(o.sent) toast(o.sent+' change'+(o.sent===1?'':'s')+' synced to Zoho');
  if(typeof render==='function') render();
});
window.addEventListener('offline', ()=>{ if(typeof toast==='function') toast('Offline — your work is saved here'); });
API.init();
window.API=API; window.OutBox=OutBox;

/* ══════════════════ CONFIG ══════════════════ */
/**
 * Today, actually.
 *
 * These were pinned to a fixed date during early development and never
 * unpinned, so every "due in N days", every overdue count and every
 * next-due calculation was measured from 18 September. Read the real clock.
 */
const TODAY = new Date();
const TODAY_S = (() => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
})();
const KEY = 'rephub_v3_symbiz';
/**
 * Bumped whenever the shape or origin of stored data changes. Anything saved
 * under an older version is discarded rather than merged — this is what stops
 * demo records from an earlier build lingering in someone's browser.
 */
const STORE_VERSION = 'prod-1';

/**
 * Which build is actually running.
 *
 * Shown in Settings and System check. Without it there is no way to tell a
 * missing feature from an undeployed file, which has cost real time.
 */
const BUILD = '2026-10-15 08:01 UTC';

/** Filled from the server at sign-in. Never hardcoded. */
const PEOPLE = [];
const OUTCOMES = ['Connected','No answer','Left voicemail','Rescheduled'];
const EXIT_REASONS = ['Cost of membership','Time commitment','Business closed or sold','Moved away','Group not a fit','Relational conflict','Other'];
const LAUNCH_STEPS = ['Facilitator briefed on format','Meeting date and place set','All members invited','Covenant and expectations reviewed','First meeting held','Next meeting scheduled'];
const REQ_STAGES = ['New','Contacted','Placed'];
const EVENT_TYPES = ['Info Meeting','Expo','Summit','Local Event'];
const TIME_CATEGORIES = ['Growth Ring visit','Facilitator call','Member call','Local event','Travel','Admin','Training'];
/**
 * Their growth stages, straight from Zoho's Life_Stage picklist. Mel wanted
 * these visible so a rep knows who they are walking in to see.
 */
const LIFE_STAGES = {
  'Seedling':   { tag:'soon',  hint:'New — still finding their feet' },
  'Sapling':    { tag:'info',  hint:'Growing — building momentum' },
  'Mighty Oak': { tag:'ok',    hint:'Established — a good mentor for others' },
  'Bookshelf':  { tag:'later', hint:'Bookshelf cohort' },
};
function lifeStageTag(stage){
  if(!stage) return '';
  const s = LIFE_STAGES[stage] || { tag:'later', hint:'' };
  return `<span class="tag ${s.tag}" title="${esc(s.hint)}">${esc(stage)}</span>`;
}

/**
 * Call buttons, with a prompt when the rep comes back.
 *
 * A browser cannot tell whether a call connected. Tapping a tel: link hands
 * off to the phone's dialler and nothing is reported back — no API on iOS or
 * Android exposes this to a web page. Anyone claiming otherwise is logging
 * button presses, which is worse than useless: it would show calls that
 * never happened.
 *
 * What we CAN see is how long the rep was away from the app. That is a strong
 * hint, not proof, so we use it to pre-fill the answer and still ask. A rep
 * who taps and comes back in six seconds almost certainly got no answer; one
 * who returns four minutes later probably spoke to someone.
 */
let callAttempt = null;

/** One place that writes a call, whether logged by hand or after a dial. */
async function logCall(entry){
  if(API.live){
    await API.logActivity(entry);
    S.activities = (await API.activities(previewRepId || null)).map(adapt.activity);
    save(); render();
    return;
  }
  S.activities.push({
    id: 'a_' + (S.ids.act++), repId: ui.me, ...entry,
    who: (member(entry.memberId) || {}).name || '',
    nextDue: nextDueCheck(entry.type, entry.outcome, 'Quarterly', 'Annual'),
  });
  save(); queueWrite('activity'); render();
}

function callButtons(m){
  const nums = [
    ['Phone', m.phone], ['Mobile', m.mobile], ['Other', m.phone2],
  ].filter(([,v]) => v);
  if(!nums.length) return '<div class="row-sub">No phone number in Zoho</div>';
  return `<div class="btnrow">${nums.map(([label,v]) =>
    `<a class="btn primary" href="tel:${esc(String(v).replace(/[^0-9+ext.]/gi,''))}"
        onclick="noteCallStarted('${esc(m.id)}','${esc(m.name)}','${esc(v)}')">Call ${label.toLowerCase()} · ${esc(v)}</a>`
  ).join('')}</div>`;
}

function noteCallStarted(memberId, name, number){
  callAttempt = { memberId, name, number, at: Date.now(), ring: ui.ringId || null };
}

/** Fired when the rep returns to the app after the dialler took over. */
function onReturnFromCall(){
  if(!callAttempt) return;
  const away = Math.round((Date.now() - callAttempt.at) / 1000);
  const a = callAttempt;
  callAttempt = null;

  // Under twenty seconds is not a conversation — a ring-out or a misdial.
  const likelyNoAnswer = away < 20;
  const mins = Math.floor(away / 60), secs = away % 60;
  const spent = mins ? `${mins} minute${mins===1?'':'s'}${secs>20?` ${secs} seconds`:''}` : `${away} seconds`;

  openModal(`<h3>How did the call go?</h3>
    <p class="lead">${esc(a.name)} · ${esc(a.number)}</p>
    <div class="callout" style="padding:9px 13px;font-size:12.5px">
      You were away from the app for <strong>${spent}</strong>.
      That's a guess at the call length, not a measurement — the phone doesn't
      tell the app anything, so please confirm what actually happened.</div>
    <form onsubmit="submitCallOutcome(event,'${esc(a.memberId)}',${away})">
      <div class="field"><label>What happened?</label>
        <select name="outcome">
          ${['Connected','No answer','Left voicemail','Rescheduled'].map(o =>
            `<option ${((likelyNoAnswer && o==='No answer') || (!likelyNoAnswer && o==='Connected'))?'selected':''}>${o}</option>`).join('')}
        </select></div>
      <div class="field"><label>Anything worth noting</label>
        <textarea name="notes" rows="2" placeholder="What you talked about"></textarea></div>
      <div id="callErr" style="display:none;color:var(--rust);font-size:13px;margin-bottom:8px"></div>
      <div class="m-actions">
        <button type="button" class="btn" onclick="closeModal()">Don't log it</button>
        <button type="submit" class="btn primary">Log the call</button></div></form>`);
}

async function submitCallOutcome(ev, memberId, awaySeconds){
  ev.preventDefault();
  const f = ev.target.elements, err = document.getElementById('callErr');
  const outcome = f.namedItem('outcome').value;
  const notes = f.namedItem('notes').value;
  const m = member(memberId);
  try{
    await logCall({
      memberId,
      ringId: m ? m.ringId : null,
      type: m && m.isFacilitator ? 'Facilitator Call' : 'Member Call',
      date: TODAY_S,
      outcome,
      // Recorded as what it is: time away from the app, not a verified duration.
      notes: [notes, `(away from the app ${awaySeconds}s)`].filter(Boolean).join(' '),
    });
    closeModal();
    toast(outcome === 'Connected' ? 'Call logged' : `Logged as ${outcome.toLowerCase()}`);
  }catch(e){
    err.style.display = 'block';
    err.textContent = e.message || 'Could not log that';
  }
}

document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible') setTimeout(onReturnFromCall, 350);
});

/**
 * A password box with a show/hide eye.
 *
 * Reps type these on phones where a mistyped character is invisible and the
 * only feedback is "wrong password". Being able to look is the difference
 * between getting in and calling the office.
 */
function passwordField(label, name, opts){
  const o = opts || {};
  const id = 'pw_' + name + '_' + Math.random().toString(36).slice(2,7);
  return `<div class="field"><label>${esc(label)}</label>
    <div class="pw-wrap">
      <input id="${id}" name="${esc(name)}" type="password"
             ${o.required===false?'':'required'}
             ${o.minlength?`minlength="${o.minlength}"`:''}
             ${o.autocomplete?`autocomplete="${esc(o.autocomplete)}"`:''}
             ${o.placeholder?`placeholder="${esc(o.placeholder)}"`:''}>
      <button type="button" class="pw-eye" aria-label="Show password"
              onclick="togglePassword('${id}', this)">${EYE_SHOW}</button>
    </div>
    ${o.hint?`<div class="hint">${esc(o.hint)}</div>`:''}</div>`;
}
const EYE_SHOW = '<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1.8 10S4.9 4.6 10 4.6 18.2 10 18.2 10 15.1 15.4 10 15.4 1.8 10 1.8 10Z"/><circle cx="10" cy="10" r="2.6"/></svg>';
const EYE_HIDE = '<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1.8 10S4.9 4.6 10 4.6c1.2 0 2.3.3 3.2.7M18.2 10s-1.4 2.4-3.9 3.9M10 15.4c-5.1 0-8.2-5.4-8.2-5.4"/><path d="M3 3l14 14"/></svg>';

function togglePassword(id, btn){
  const el = document.getElementById(id);
  if(!el) return;
  const showing = el.type === 'text';
  el.type = showing ? 'password' : 'text';
  btn.innerHTML = showing ? EYE_SHOW : EYE_HIDE;
  btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
  // Keep the cursor where it was rather than jumping to the start
  const pos = el.value.length;
  el.focus();
  try{ el.setSelectionRange(pos, pos); }catch(e){}
}

const EXPENSE_CATEGORIES = ['Mileage','Meals','Lodging','Event supplies','Printing','Other'];
const EXPENSE_STATUS = ['Draft','Submitted','Approved','Reimbursed'];
const REGIONS = ['Lancaster PA','Holmes County OH','Shenandoah VA'];
/* Forms and documents reps need to hand. Replace url with the real Drive links. */
const RESOURCES = {
  forms: [
    {id:'f_exit', name:'Growth Ring Exit Interview', note:'Complete when a member discontinues', url:'#', type:'PDF'},
    {id:'f_visit', name:'Growth Ring Visit Report', note:'After each group visit', url:'#', type:'PDF'},
    {id:'f_conv', name:'Quarterly Facilitator / Annual Member Conversation', note:'Use on scheduled calls', url:'#', type:'PDF'},
    {id:'f_reimb', name:'Local Event Reimbursement', note:'Submit with receipts', url:'#', type:'PDF'}
  ],
  folders: [
    {id:'d_rep', name:'Regional Rep folder', note:'Shared Google Drive folder', url:'#'},
    {id:'d_summit', name:'Regional Summits folder', note:'Shared Google Drive folder', url:'#'}
  ],
  docs: [
    {id:'doc_job', name:'Rep job description', note:'What the role covers', url:'#'},
    {id:'doc_manual', name:'Rep manual', note:'How we do things', url:'#'}
  ]

/**
 * How many rows a long list renders at once.

 * Building 423 member rows as one string cost ~170ms per keystroke, which is
 * what made the app feel heavy. Rendering a page at a time keeps every
 * interaction under a frame; "Show more" adds the next page.
 */
const PAGE = 25;   // a screenful; "Show more" adds another
let pageSize = {};
function pageOf(key){ return pageSize[key] || PAGE; }
function showMore(key, total){
  pageSize[key] = pageOf(key) + PAGE;
  if(pageSize[key] > total) pageSize[key] = total;
  renderContent();
}
function resetPaging(){ pageSize = {}; }
function moreButton(key, shown, total){
  if(shown >= total) return '';
  return `<div class="btnrow" style="margin-top:12px;justify-content:center">
    <button class="btn" onclick="showMore('${key}', ${total})">
      Show ${Math.min(PAGE, total - shown)} more · ${shown} of ${total}</button></div>`;
}

/**
 * Re-render without losing what someone is typing. Rebuilding the view
 * destroys the input and the caret with it, which felt like dropped keys.
 */

  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    const active = document.activeElement;

 * their calls, their calendar. Clearly banner-flagged, read-only in spirit,

/**
 * Load saved state, bringing it up to date with the current shape.
 *
 * Someone who used an earlier build has state without the newer collections.
 * Reading `.length` off a missing array throws mid-render and leaves a blank
 * screen, so every known key is backfilled here rather than trusted.
 */
function migrateState(st){
  const base = seed();
  if(!st || typeof st !== 'object') return base;

  ['rings','members','membersNoRing','facilitators','activities','meetings','requests',
   'events','registrations','visits','timeEntries','expenses','announcements',
   'audit','syncQueue'].forEach(k=>{
    if(!Array.isArray(st[k])) st[k] = Array.isArray(base[k]) ? base[k] : [];
  });

  st.settings = Object.assign({}, base.settings, st.settings || {});
  st.settings.links = Object.assign({}, base.settings.links, st.settings.links || {});
  st.ids = Object.assign({}, base.ids, st.ids || {});

  // Keep id counters ahead of anything already stored, or new records collide
  const bump = (key, list, prefix) => {
    let max = 0;
    (list||[]).forEach(r=>{
      const m = String(r.id||'').match(new RegExp('^'+prefix+'_?(\\d+)$'));
      if(m) max = Math.max(max, parseInt(m[1],10));
    });
    st.ids[key] = Math.max(st.ids[key]||0, max+1);
  };
  bump('ring',st.rings,'g'); bump('mem',st.members,'m'); bump('act',st.activities,'a');
  bump('fac',st.facilitators,'f'); bump('ev',st.events,'e'); bump('vis',st.visits,'v');
  bump('meet',st.meetings,'t'); bump('req',st.requests,'j');
  bump('time',st.timeEntries,'t'); bump('exp',st.expenses,'x');

  // Records added before these fields existed
  st.rings.forEach(r=>{ if(!Array.isArray(r.launchSteps)) r.launchSteps=[]; });
  st.members.forEach(m=>{ if(m.ringId===undefined) m.ringId=null; if(!m.status) m.status='active'; });
  return st;
}

function load(){
  try{
    const stored = localStorage.getItem(KEY + '_version');
    if(stored !== STORE_VERSION){
      // Data from an older build, including the demo records. Clear it.
      try{
        localStorage.removeItem(KEY);
        localStorage.removeItem('rephub_outbox');
        localStorage.setItem(KEY + '_version', STORE_VERSION);
      }catch(e){}
      const fresh = seed();
      try{ localStorage.setItem(KEY, JSON.stringify(fresh)); }catch(e){}
      return fresh;
    }
    const r = localStorage.getItem(KEY);
    if(r) return migrateState(JSON.parse(r));
  }catch(e){ console.warn('Saved data could not be read, starting fresh:', e.message); }
  const s = seed();
  try{
    localStorage.setItem(KEY, JSON.stringify(s));
    localStorage.setItem(KEY + '_version', STORE_VERSION);
  }catch(e){}
  return s;
}
/**
 * Write straight away. Deferring this saved about a millisecond and risked
 * losing a rep's logged call if the tab closed first — a bad trade.
 */
function save(){
  bumpData();                       // data changed, so the lookups are stale
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}
const saveNow = save;
function resetDemo(){
  S=seed(); save();
  ui={me:ui.me,view:'today',ringId:null,memberId:null,facId:null,q:'',filter:'all',offline:false,gq:'',report:'contact-due'};
  toast('Demo data reset'); render();
}

 *
 * Called once per row, and each call scanned all 423 members — 81 rows meant
 * 34,000 comparisons per render. Cached per render pass instead; any write
 * clears it via bumpData().
 */
let _ringMembersCache = null;
function ringMembers(gid){
  if(!_ringMembersCache){
    _ringMembersCache = new Map();
    S.members.forEach(m=>{
      if(m.status!=='active' || !m.ringId) return;
      if(!_ringMembersCache.has(m.ringId)) _ringMembersCache.set(m.ringId, []);
      _ringMembersCache.get(m.ringId).push(m);
    });
  }
  return _ringMembersCache.get(gid) || [];
}

/** Same problem for facilitator and activity lookups. */

function facById(id){
  if(!_facCache){ _facCache = new Map(); S.facilitators.forEach(f=>_facCache.set(f.id,f)); }
  return _facCache.get(id) || null;
}
let _lastContactCache = null;
function lastContactCached(memberId){
  if(!_lastContactCache){
    _lastContactCache = new Map();
    [...S.activities].sort((a,b)=>String(b.date).localeCompare(String(a.date))).forEach(a=>{
      if(a.memberId && !_lastContactCache.has(a.memberId)) _lastContactCache.set(a.memberId, a);
    });
  }
  return _lastContactCache.get(memberId) || null;
}

/** Call whenever the data changes, so the caches are rebuilt. */
function bumpData(){ _ringMembersCache = null; _facCache = null; _lastContactCache = null; }

function days(d){ if(!d) return null; return Math.round((new Date(d+'T09:00:00')-TODAY)/86400000); }
function fmt(d){ if(!d) return '—'; return new Date(d+'T09:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function fmtShort(d){ if(!d) return '—'; return new Date(d+'T09:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function addDays(d,n){ const x=new Date(d+'T09:00:00'); x.setDate(x.getDate()+n); return x.toISOString().slice(0,10); }
function freqDays(f){ return f==='Quarterly'?91 : f==='Semi-Annual'?182 : 365; }

  return `<span class="tag later">${fmtShort(d)}</span>`;
}

function glyph(s){ return `<svg class="ring-mark glyph ${s==='pending'?'pending':s==='rejected'?'rejected':''}" width="21" height="21" viewBox="0 0 26 26"><circle cx="13" cy="13" r="11" stroke-width="1.7"/><circle cx="13" cy="13" r="6.4" stroke-width="1.7"/></svg>`; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

/* Ring health: attendance + contact recency + capacity fill */
/**
 * Ring health, or null when there is nothing to judge it on.
 *
 * Symbiz's rings mostly have no meeting rhythm, visit dates or attendance
 * recorded yet. Scoring those as "at risk" would flag all 81 and tell the
 * office nothing. A ring with no data is UNRATED, which is a different
 * problem — one of data entry, surfaced separately.
 */
function ringHealth(r){
  if(r.status !== 'active') return null;
  const mts = S.meetings.filter(m => m.ringId === r.id);
  const members = ringMembers(r.id).length || r.serverMemberCount || 0;
  // Member count alone says how big a group is, not whether it is working.
  // Health needs evidence of activity: meetings held, a rep visit, or at
  // least an agreed meeting rhythm.
  const hasSignal = mts.length || r.lastRepVisit || r.meetingRhythm;
  if(!hasSignal) return null;              // nothing recorded — unrated

  let score = 0, weight = 0;

  if(mts.length){
    const recent = mts.slice(0,3);
    const rate = recent.reduce((a,m)=>{
      const total = (m.attended||[]).length + (m.absent||[]).length;
      return a + (total ? (m.attended||[]).length/total : 0);
    },0)/recent.length;
    score += rate*40; weight += 40;
  }

  if(r.lastRepVisit){
    const gap = Math.abs(days(r.lastRepVisit));
    score += gap<=180 ? 30 : gap<=365 ? 18 : 5;
    weight += 30;
  }

  if(r.capacity){
    score += Math.min(20, (members/Math.max(1,r.capacity))*20);
    weight += 20;
  }

  if(r.meetingRhythm){ score += 10; weight += 10; }

  if(!weight) return null;
  return Math.max(0, Math.min(100, Math.round((score/weight)*100)));
}

function healthWord(h){ return h===null?'Not rated yet':h>=75?'Healthy':h>=50?'Needs attention':'At risk'; }
function healthCls(h){ return h===null?'':h>=75?'':h>=50?'warn':'bad'; }

  S.members.filter(m=>m.repId===ui.me&&m.status==='active'&&m.renews&&days(m.renews)<=45&&days(m.renews)>=0).forEach(m=>

function toCSV(rows){
  return rows.map(r=>r.map(c=>{
    const s=String(c==null?'':c);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\n');
}
function downloadCSV(name, rows){
  const blob=new Blob([toCSV(rows)],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
  toast('Export downloaded');
}

function vPeople(){
  const q=ui.q.toLowerCase();
  // Only people in this rep's own rings. Unaffiliated members live elsewhere.
  const mem=S.members.filter(m=>m.repId===ui.me && m.ringId);
  const facs=S.facilitators.filter(f=>myRings(ui.me).some(r=>r.facId===f.id));
  let list=mem.filter(m=>!q||m.name.toLowerCase().includes(q)||m.business.toLowerCase().includes(q));
  // The Members screen shares ui.filter with its own chips (active,
  // discontinued). Carried over here they matched no chip and hid people.
  if(!['all','overdue','never','renewing'].includes(ui.filter)) ui.filter='all';
  if(ui.filter==='overdue') list=list.filter(m=>{const a=currentDue(m.id);return a&&days(a.nextDue)<0;});
  if(ui.filter==='never') list=list.filter(m=>!lastContact(m.id));
  if(ui.filter==='renewing') list=list.filter(m=>m.renews&&days(m.renews)<=60&&days(m.renews)>=0);
  if(ui.filter!=='all'&&ui.filter!=='never') list=list.filter(m=>m.status==='active');

  const memRows=list.map(m=>{
    const lc=lastContact(m.id), due=currentDue(m.id);
    return `<div class="row clicky" onclick="openMember('${m.id}')">
      <div style="display:flex;gap:10px;align-items:center;flex:1;min-width:0">
        <div class="av">${initials(m.name)}</div>
        <div class="row-main"><div class="row-title">${esc(m.name)}${m.status!=='active'?` <span class="tag later">${m.status}</span>`:''}${m.lifeStage?' '+lifeStageTag(m.lifeStage):''}</div>
        <div class="row-sub">${esc(m.business)} · ${ring(m.ringId)?esc(ring(m.ringId).name):'no ring'} · last spoke ${lc?fmt(lc.date):'never'}</div></div>
      </div>${due?tag(due.nextDue):''}</div>`;
  }).join('')||`<div class="empty">Nobody matches that.</div>`;

  const facRows=facs.filter(f=>!q||f.name.toLowerCase().includes(q)).map(f=>{
    const lc=lastFacContact(f.id);
    return `<div class="row clicky" onclick="openFac('${f.id}')">
      <div style="display:flex;gap:10px;align-items:center;flex:1;min-width:0">
        <div class="av" style="background:var(--primary-soft);color:var(--primary)">${initials(f.name)}</div>
        <div class="row-main"><div class="row-title">${esc(f.name)}</div>
        <div class="row-sub">${esc(f.business)} · last spoke ${lc?fmt(lc.date):'never'}</div></div>
      </div></div>`;
  }).join('')||`<div class="row-sub" style="padding:9px 0">No facilitators yet.</div>`;

  return `<div class="section-head"><div><h2>My people</h2><div class="sub">Members and facilitators across your rings.</div></div>
    ${API.live?`<button class="btn primary" onclick="openAddLead()">Add a lead</button>`:''}</div>

    <div class="chips">${['all','overdue','never','renewing'].map(f=>
      `<button class="chip ${ui.filter===f?'on':''}" onclick="ui.filter='${f}';renderContent()">${f==='all'?'Everyone':f==='never'?'Never contacted':f==='renewing'?'Renewing soon':'Overdue'}</button>`).join('')}</div>
    <h3 class="sub-h">Facilitators</h3>${facRows}

function vCallSheet(){
  const reps = PEOPLE.filter(x=>x.role==='rep');

  const repId = isRep() ? ui.me : (ui.sheetRep || (reps[0] && reps[0].id) || null);
  if(!repId){
    return `<div class="section-head"><div><h2>Call sheet</h2>
      <div class="sub">A printable list of who is due, for a rep to carry.</div></div></div>
      ${emptyState('reps', 'No rep accounts yet. Add them under Reps, then a call sheet can be printed for each one.')}`;
  }
  const items=dueItems(repId).filter(a=>days(a.nextDue)<=45);
  const p=PEOPLE.find(x=>x.id===repId) || {name:'Rep'};
  const rows=items.map(a=>{
    const m=a.memberId?member(a.memberId):null, f=a.facId?fac(a.facId):null;
    const phone=m?m.phone:f?f.phone:'—';
    const lc=m?lastContact(m.id):f?lastFacContact(f.id):null;
    return [a.who, a.type.replace(' Call',''), ring(a.ringId)?ring(a.ringId).name:'', phone,
      a.nextDue, lc?fmt(lc.date):'never', lc&&lc.notes?lc.notes:''];
  });
  return `<div class="section-head"><div><h2>Call sheet</h2>
      <div class="sub">One page you can print and carry. Everything due in the next 45 days, with room to write.</div></div>
    ${isOffice()&&reps.length>1?`<select class="sel" onchange="ui.sheetRep=this.value;renderContent()">
      ${reps.map(x=>`<option value="${x.id}" ${x.id===repId?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`:''}
    </div>
    <div class="btnrow" style="margin-bottom:14px">
      <button class="btn primary" onclick="window.print()">Print this sheet</button>
      <button class="btn" onclick="exportCallSheet('${repId}')">Export CSV</button>

function exportCallSheet(repId){
  const items=dueItems(repId).filter(a=>days(a.nextDue)<=45);
  downloadCSV(`call-sheet-${repId}-${TODAY_S}.csv`,[['Who','Type','Ring','Phone','Due','Last spoke','Notes'],

function vReminders(){
  const s = S.settings;
  const reps = PEOPLE.filter(p => p.role === 'rep');
  const win = s.dueWindow || 21;

  // Who actually has something to be reminded about
  const lines = reps.map(p => {
    const items = dueItems(p.id).filter(a => days(a.nextDue) <= win);
    const overdue = items.filter(a => days(a.nextDue) < 0).length;
    return { p, items, overdue };
  });
  const withWork = lines.filter(l => l.items.length);
  const idle = lines.filter(l => !l.items.length);
  const noEmail = reps.filter(p => !p.email);

  return `<div class="section-head"><div><h2>Reminders</h2>
    <div class="sub">What gets sent out, so reps don't have to remember to open the app.</div></div></div>

    <div class="callout info"><strong>What the weekly email is for</strong>
      Most reps will not open an app to find out who to call. Once a week each rep gets their own
      list — just the people due, with tap-to-call links — so the work starts from their inbox.
      The app is where it gets recorded afterwards.
      <div style="margin-top:6px">Nobody with an empty list is emailed, so it never becomes noise.</div></div>

    <div class="card">
      <div class="field"><label>Weekly rep digest</label>
        <select onchange="setSetting('digestDay',this.value)">${['Monday','Tuesday','Sunday','Off'].map(d=>`<option ${d===(s.digestDay||'Monday')?'selected':''}>${d}</option>`).join('')}</select>
        <div class="hint">Each rep gets their own list of calls due, with tap-to-call links.</div></div>
      <div class="field"><label>Also send by text message</label>
        <select onchange="setSetting('smsOn',this.value)">${['Yes','No'].map(d=>`<option ${d===(s.smsOn||'No')?'selected':''}>${d}</option>`).join('')}</select>
        <div class="hint">Short version for reps who don't use email much.</div></div>
      <div class="field"><label>Overdue nudge after</label>
        <select onchange="setSetting('nudgeDays',parseInt(this.value))">${[7,14,30].map(d=>`<option value="${d}" ${d===(s.nudgeDays||14)?'selected':''}>${d} days overdue</option>`).join('')}</select></div>
      <div class="field"><label>Monthly summary to the office</label>
        <select onchange="setSetting('officeDigest',this.value)">${['Yes','No'].map(d=>`<option ${d===(s.officeDigest||'Yes')?'selected':''}>${d}</option>`).join('')}</select></div>
    </div>

    ${noEmail.length ? `<div class="callout rust"><strong>${noEmail.length} rep${noEmail.length===1?'':'s'} without an email address</strong>
      ${noEmail.slice(0,6).map(p=>esc(p.name)).join(', ')}${noEmail.length>6?` and ${noEmail.length-6} more`:''}.
      They won't receive anything. Add the address to their Contact in Zoho.</div>` : ''}

    <h3 class="sub-h">Next send · ${s.digestDay === 'Off' ? 'switched off' : (s.digestDay || 'Monday')}</h3>

    ${withWork.length ? withWork.map(({p, items, overdue}) => `<div class="card flat" style="margin-bottom:10px">
      <div class="row-title">${esc(p.name)}</div>
      <div class="row-sub" style="margin-bottom:8px">
        ${p.email ? esc(p.email) : '<span style="color:var(--rust)">no email on file</span>'}
        · ${items.length} call${items.length===1?'':'s'}${overdue?` · <span style="color:var(--rust)">${overdue} overdue</span>`:''}</div>
      ${items.slice(0,5).map(a=>`<div class="kv"><span>${esc(a.who||a.ringName||a.type)} — ${esc(String(a.type).replace(' Call',''))}</span>
        <span class="${days(a.nextDue)<0?'':''}" style="${days(a.nextDue)<0?'color:var(--rust)':''}">${days(a.nextDue)<0?Math.abs(days(a.nextDue))+'d overdue':'due '+fmtShort(a.nextDue)}</span></div>`).join('')}
      ${items.length>5?`<div class="row-sub" style="margin-top:4px">and ${items.length-5} more</div>`:''}
      ${p.email ? `<div class="btnrow" style="margin-top:10px">
        <button class="btn sm" onclick="sendDigestTest('${esc(p.id)}','${esc(p.email)}')">Send this to me as a test</button></div>` : ''}

      : `<div class="callout"><strong>Nothing is due within ${win} days</strong>
         No weekly emails would go out right now. That is the correct behaviour — reps are only
         emailed when they have calls waiting.</div>`}

    ${idle.length ? `<div class="row-sub" style="margin-top:10px">
      ${idle.length} rep${idle.length===1?'':'s'} with nothing due will not be emailed:

/** Send one rep's weekly digest to whoever is asking, to see what it looks like. */

function vOfficeDash(){
  const pend=S.rings.filter(r=>r.status==='pending').length;
  const od=dueItems(null).filter(a=>days(a.nextDue)<0).length;
  const act=S.members.filter(m=>m.status==='active').length;
  const rings=S.rings.filter(r=>r.status==='active');
  const atRisk=rings.filter(r=>ringHealth(r)<50);
  const exits=S.activities.filter(a=>a.type==='Exit Interview'&&a.date>='2026-01-01').length;
  // Joined = Paid_Membership_StartDate in Zoho, counted across the members
  // loaded. "Left" cannot be dated: Zoho records that someone is Inactive
  // but not WHEN they went inactive, so we show the current total instead
  // of inventing a year figure.
  const yr = String(new Date().getFullYear());
  const newM = S.members.filter(m => m.status==='active' && m.joined && m.joined >= yr+'-01-01').length;
  const inactive = S.members.filter(m => m.status !== 'active').length;

  return `${announceBanner()}
    <div class="section-head"><div><h2>Network overview</h2><div class="sub">Where things stand across every rep and ring.</div></div></div>
    <div class="stats">
      <div class="stat click" onclick="setView('approvals')"><div class="n" style="color:var(--accent)">${pend}</div><div class="l">Awaiting approval</div></div>
      <div class="stat click" onclick="setView('coverage')"><div class="n" style="color:var(--rust)">${od}</div><div class="l">Overdue contacts</div></div>
      <div class="stat click" onclick="setView('members')"><div class="n">${act}</div><div class="l">Active members</div></div>
      <div class="stat click" onclick="setView('allrings')"><div class="n">${rings.length}</div><div class="l">Active rings</div></div>
      <div class="stat click" onclick="setView('members')" title="Members whose paid start date in Zoho falls this year">
        <div class="n" style="color:var(--primary)">+${newM}</div><div class="l">Joined in ${yr}</div></div>
      <div class="stat click" onclick="setView('insights')" title="Members marked Inactive in Zoho. Zoho does not record the date they left, so this is a running total, not a figure for this year.">
        <div class="n" style="color:var(--rust)">${inactive}</div><div class="l">Inactive members</div></div>
    </div>
    ${(() => {
      const rated = rings.map(r=>({r, h:ringHealth(r)})).filter(x=>x.h!==null);
      const risky = rated.filter(x=>x.h<50);
      const unrated = rings.length - rated.length;

      let out = '';
      if(risky.length){
        const show = risky.slice(0,6).map(x=>esc(x.r.name)).join(', ');
        out += `<div class="callout rust"><strong>${risky.length} ring${risky.length===1?'':'s'} at risk</strong>
          ${show}${risky.length>6?` and ${risky.length-6} more`:''}
          <div class="btnrow" style="margin-top:9px"><button class="btn sm" onclick="setView('allrings')">See them</button></div></div>`;
      } else if(rated.length){
        out += `<div class="callout ok"><strong>No rings at risk</strong>Every rated group is scoring above 50.</div>`;
      }

      if(unrated){
        out += `<div class="callout"><strong>${unrated} ring${unrated===1?'':'s'} cannot be rated yet</strong>
          They have no meeting rhythm, visit dates or attendance recorded in Zoho, so there is nothing to score.
          Filling those in is what turns this into a useful signal.
          <div class="btnrow" style="margin-top:9px">
            <button class="btn sm" onclick="ui.report='missing-detail';setView('reports')">See what's missing</button>
          </div></div>`;
      }
      return out;
    })()}

    ${(() => {
      const due = dueItems(null).length;
      const active = S.rings.filter(r=>r.status==='active').length;
      if(due || !active) return '';
      return `<div class="callout info"><strong>No calls are scheduled yet</strong>
        ${active} active ring${active===1?'':'s'} and nothing due, so every rep will sign in to an empty screen.
        Starting the cycle creates a first facilitator call for each ring, spread over coming weeks
        so nobody opens the app to twenty calls at once.
        <div class="btnrow" style="margin-top:9px">
          <button class="btn sm primary" onclick="openStartCycle()">Start the call cycle</button>
        </div></div>`;
    })()}

    <h3 class="sub-h">Needs your attention</h3>
    ${S.rings.filter(r=>r.status==='pending').map(r=>`<div class="row clicky" onclick="setView('approvals')">
      <div class="row-main"><div class="row-title">${esc(r.name)}</div><div class="row-sub">${pname(r.repId)} · submitted ${fmt(r.createdAt)}</div></div>
      <span class="tag soon">approve</span></div>`).join('')}
    ${dueItems(null).filter(a=>days(a.nextDue)<-14).slice(0,5).map(a=>`<div class="row">
      <div class="row-main"><div class="row-title">${esc(a.who)}</div><div class="row-sub">${a.type} · ${pname(a.repId)} · ${ring(a.ringId)?esc(ring(a.ringId).name):''}</div></div>
      ${tag(a.nextDue)}</div>`).join('')}
    <h3 class="sub-h">Recent activity across the network</h3>
    ${[...S.activities].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,6).map(a=>`<div class="row">
      <div class="row-main"><div class="row-title">${a.type} — ${esc(a.who)}</div>
      <div class="row-sub">${pname(a.repId)} · ${fmt(a.date)}${a.notes?' · '+esc(a.notes):''}</div></div></div>`).join('')}`;
