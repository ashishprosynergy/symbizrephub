/* Ring health: attendance + contact recency + capacity fill */
/**
 * Ring health, or null when there is nothing to judge it on.
 *
 * Symbiz's rings mostly have no meeting rhythm, visit dates or attendance
 * recorded yet. Scoring those as "at risk" would flag all 81 and tell the
 * office nothing. A ring with no data is UNRATED, which is a different
 * problem — one of data entry, surfaced separately.
 */
function ringHealth(r){
  if(r.status !== 'active') return null;
  // Only meetings that took place count; planned and cancelled ones say nothing yet
  const held = S.meetings.filter(m => m.ringId === r.id && (m.status || 'held') === 'held' && m.date && m.date <= TODAY_S)
    .sort((a, b) => String(b.date).localeCompare(String(a.date)));
  const members = ringMembers(r.id).length || r.serverMemberCount || 0;
  const visit = lastVisitOf(r);
  // Member count alone says how big a group is, not whether it is working.
  // Health needs evidence of activity: meetings held, a rep visit, or at
  // least an agreed meeting rhythm.
  const hasSignal = held.length || visit || r.meetingRhythm;
  if(!hasSignal) return null;              // nothing recorded — unrated

  let score = 0, weight = 0;

  if(held.length){
    // Attendance when it was recorded; otherwise how regularly the group met.
    // Zoho's GR Meetings carry no attendance, and reading that as 0% present
    // marked 64 healthy groups "at risk".
    const n = x => Array.isArray(x) ? x.length : (Number(x) || 0);
    const withAtt = held.filter(m => n(m.attended) + n(m.absent) > 0).slice(0, 3);
    if(withAtt.length){
      score += withAtt.reduce((a, m) => a + n(m.attended) / (n(m.attended) + n(m.absent)), 0) / withAtt.length * 40;
    } else {
      const last120 = held.filter(m => days(m.date) >= -120).length;   // monthly ≈ 4
      score += Math.min(40, last120 * 10);
    }
    weight += 40;
  }

  if(visit){
    const gap = Math.abs(days(visit));
    score += gap<=180 ? 30 : gap<=365 ? 18 : 5;
    weight += 30;
  }

  if(r.capacity){
    score += Math.min(20, (members/Math.max(1,r.capacity))*20);
    weight += 20;
  }

  if(r.meetingRhythm){ score += 10; weight += 10; }

  if(!weight) return null;
  return Math.max(0, Math.min(100, Math.round((score/weight)*100)));
}

      const sub = S.timeEntries.filter(t => t.status === 'Submitted').length + S.expenses.filter(x => x.status === 'Submitted').length;
      if(sub) out.push({k:'claims:'+sub+':'+TODAY_S, t:`${sub} hours or expense claim${sub===1?'':'s'} to approve`,
        s:[...new Set([...S.timeEntries, ...S.expenses].filter(x => x.status === 'Submitted').map(x => splitRepName(x.repName || pname(x.repId)).name))].slice(0,3).join(', '),
        go:()=>setView('approvals')});
    }
    S.rings.filter(r=>r.status==='pending').forEach(r=>
      out.push({k:'pending:'+r.id, t:`${r.name} is waiting on approval`, s:`Submitted by ${pname(r.repId)}`, go:()=>setView('approvals')}));
    const od=dueItems(null).filter(a=>days(a.nextDue)<-30);
    if(od.length) out.push({k:'od-network:'+od.length, t:`${od.length} contact${od.length===1?' is':'s are'} more than a month overdue`, s:'Across the network', go:()=>setView('coverage')});
    // Only genuinely rated, genuinely struggling rings. An alert that fires
    // on everything is noise, and gets ignored.
    const risky = S.rings.filter(r=>r.status==='active')
      .map(r=>({r,h:ringHealth(r)}))
      .filter(x=>x.h!==null && x.h<50);
    risky.slice(0,5).forEach(x=>
      out.push({k:'risk:'+x.r.id, t:`${x.r.name} is at risk`, s:`Health ${x.h} · ${x.r.repName||pname(x.r.repId)}`, go:()=>setView('allrings')}));
    if(risky.length>5) out.push({k:'risk-more:'+risky.length, t:`${risky.length-5} more rings at risk`, s:'See the Rings screen', go:()=>setView('allrings')});
    // Summit tasks given to me, due within a week or already late
    if(can('summits')) ((summitMine && summitMine.tasks) || []).filter(t => t.due && days(t.due) <= 7).forEach(t => out.push({
      k:'summit-task:'+t.id+':'+t.due, t: days(t.due) < 0 ? `Summit task late: ${t.title}` : `Summit task due ${days(t.due) === 0 ? 'today' : 'in ' + days(t.due) + ' days'}: ${t.title}`,
      s: t.summit, go:()=>openSummit(t.eventId)}));
    // Early warnings about the reps, for whoever manages them
    if(can('manager')){
      loadMgr();
      ((mgrData && mgrData.warnings) || []).forEach(w => out.push({
        k:`mgr:${w.kind}:${w.repId}:${w.kind==='checkin'?(mgrRep(w.repId)||{}).nextCheckin:TODAY_S.slice(0,7)}`,
        t:`${splitRepName(w.rep).name} ${w.text}`,
        s: w.kind==='checkin' ? 'Tap to add a check-in note' : 'Rep manager',
        go:()=>{ setView('manager'); attnGo(w.kind, w.repId); }}));
    }
    return out;
  }
  dueItems(ui.me).forEach(a=>{
    const n=days(a.nextDue);
    const key = (a.id||a.memberId||a.who)+':'+a.nextDue;
    // Separate keys for "due" and "overdue": clearing a heads-up still lets
    // the overdue warning through once the date passes.
    if(n<0) out.push({k:'od:'+key, t:`${a.who} is ${Math.abs(n)} days overdue`, s:`${a.type} · ${ring(a.ringId)?ring(a.ringId).name:''}`, go:()=>openLog({ringId:a.ringId,who:a.who,type:a.type,memberId:a.memberId,facId:a.facId})});
    else if(n<=S.settings.dueWindow) out.push({k:'due:'+key, t:`${a.who} is due in ${n} days`, s:`${a.type} · ${ring(a.ringId)?ring(a.ringId).name:''}`, go:()=>openLog({ringId:a.ringId,who:a.who,type:a.type,memberId:a.memberId,facId:a.facId})});
  });
  S.rings.filter(r=>r.repId===ui.me&&r.status==='rejected').forEach(r=>
    out.push({k:'rejected:'+r.id, t:`${r.name} needs changes`, s:'Tap to edit and resubmit', go:()=>openRing(r.id)}));
  S.rings.filter(r=>r.repId===ui.me&&r.status==='active'&&!launchDone(r)).forEach(r=>
    out.push({k:'launch:'+r.id, t:`${r.name} launch is unfinished`, s:`${r.launchSteps.length} of ${LAUNCH_STEPS.length} steps done`, go:()=>openRing(r.id)}));
  S.members.filter(m=>m.repId===ui.me&&m.status==='active'&&m.renews&&days(m.renews)<=45&&days(m.renews)>=0).forEach(m=>
    out.push({k:'renew:'+m.id+':'+m.renews, t:`${m.name} renews in ${days(m.renews)} days`, s:'Worth a call before then', go:()=>openMember(m.id)}));
  (S.visits||[]).filter(v=>v.repId===ui.me&&v.status==='Scheduled'&&days(v.date)>=0&&days(v.date)<=14).forEach(v=>{
    const g=ring(v.ringId);
    out.push({k:'visit:'+v.id, t:`Visit to ${g?g.name:'a ring'} in ${days(v.date)} days`, s:`${fmt(v.date)} · ${v.location||''}`, go:()=>setView('visits')});
  });
  (S.events||[]).filter(e=>e.repId===ui.me&&days(e.date)>=0&&days(e.date)<=21).forEach(e=>
    out.push({k:'event:'+e.id, t:`${e.title} in ${days(e.date)} days`, s:`${eventRegs(e.id).length} registered · ${e.location}`, go:()=>openEvent(e.id)}));
  [...S.timeEntries, ...S.expenses].filter(x => x.status === 'Declined').forEach(x => out.push({ k:'declined:'+x.id,
    t:`Your ${x.hours != null ? 'hours' : 'expense'} for ${fmt(x.date)} were sent back`, s: x.declineNote || 'Tap to fix and send again', go:()=>setView('timesheet') }));
  const noRing=S.members.filter(m=>m.repId===ui.me&&m.status==='active'&&!m.ringId).length;
  if(noRing) out.push({k:'noring:'+noRing, t:`${noRing} member${noRing===1?'':'s'} not in a Growth Ring`, s:'They are paying but have no group', go:()=>setView('unaffiliated')});
  return out;
}

/* ══════════════════ CSV EXPORT ══════════════════ */
function toCSV(rows){
  return rows.map(r=>r.map(c=>{
    const s=String(c==null?'':c);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\n');
}
function downloadCSV(name, rows){
  const blob=new Blob([toCSV(rows)],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
  toast('Export downloaded');
}

/* Where someone is: a small map of the address, with directions. Google's
   embedded map needs no key; it loads only when scrolled to. */
function addressMap(address){
  const a = String(address || '').trim();
  if(!a || a.replace(/[^a-z0-9]/gi, '').length < 6) return '';
  const q = encodeURIComponent(a);
  return `<div class="card addr-map">
    <iframe title="Map of ${esc(a)}" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
      src="https://maps.google.com/maps?q=${q}&z=14&output=embed"></iframe>
    <div class="addr-map-bar"><span class="row-sub" style="flex:1;min-width:0">${esc(a)}</span>
      <a class="btn sm" href="https://www.google.com/maps/dir/?api=1&destination=${q}" target="_blank" rel="noopener">Directions</a>
      <a class="btn sm" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">Open in Google Maps</a></div></div>`;
}

      return [a.who,a.type,ring(a.ringId)?ring(a.ringId).name:'',m?m.phone:f?f.phone:'',a.nextDue,lc?lc.date:'never',''];})]);
}

function vReminders(){
  const s = S.settings;
  const reps = PEOPLE.filter(p => p.role === 'rep');
  const win = s.dueWindow || 21;

  // Who actually has something to be reminded about
  const lines = reps.map(p => {
    const items = dueItems(p.id).filter(a => days(a.nextDue) <= win);
    const overdue = items.filter(a => days(a.nextDue) < 0).length;
    return { p, items, overdue };
  });
  const withWork = lines.filter(l => l.items.length);
  const idle = lines.filter(l => !l.items.length);
  const noEmail = reps.filter(p => !p.email);

  return `<div class="section-head"><div><h2>Reminders</h2>
    <div class="sub">What gets sent out, so reps don't have to remember to open the app.</div></div></div>

    <div class="callout info"><strong>What the weekly email is for</strong>
      Most reps will not open an app to find out who to call. Once a week each rep gets their own
      list — just the people due, with tap-to-call links — so the work starts from their inbox.
      The app is where it gets recorded afterwards.
      <div style="margin-top:6px">Nobody with an empty list is emailed, so it never becomes noise.</div></div>

    <div class="card">
      <div class="field"><label>Weekly rep digest</label>
        <select onchange="setSetting('digestDay',this.value)">${['Monday','Tuesday','Sunday','Off'].map(d=>`<option ${d===(s.digestDay||'Monday')?'selected':''}>${d}</option>`).join('')}</select>
        <div class="hint">Each rep gets their own list of calls due, with tap-to-call links.</div></div>
      <div class="field"><label>Also send by text message</label>
        <select onchange="setSetting('smsOn',this.value)">${['Yes','No'].map(d=>`<option ${d===(s.smsOn||'No')?'selected':''}>${d}</option>`).join('')}</select>
        <div class="hint">Short version for reps who don't use email much.</div></div>
      <div class="field"><label>Overdue nudge after</label>
        <select onchange="setSetting('nudgeDays',parseInt(this.value))">${[7,14,30].map(d=>`<option value="${d}" ${d===(s.nudgeDays||14)?'selected':''}>${d} days overdue</option>`).join('')}</select></div>
      <div class="field"><label>Monthly summary to the office</label>
        <select onchange="setSetting('officeDigest',this.value)">${['Yes','No'].map(d=>`<option ${d===(s.officeDigest||'Yes')?'selected':''}>${d}</option>`).join('')}</select></div>
    </div>

    ${noEmail.length ? `<div class="callout rust"><strong>${noEmail.length} rep${noEmail.length===1?'':'s'} without an email address</strong>
      ${noEmail.slice(0,6).map(p=>esc(p.name)).join(', ')}${noEmail.length>6?` and ${noEmail.length-6} more`:''}.
      They won't receive anything. Add the address to their Contact in Zoho.</div>` : ''}

    <h3 class="sub-h">Next send · ${s.digestDay === 'Off' ? 'switched off' : (s.digestDay || 'Monday')}</h3>

    ${withWork.length ? withWork.map(({p, items, overdue}) => `<div class="card flat" style="margin-bottom:10px">
      <div class="row-title">${esc(p.name)}</div>
      <div class="row-sub" style="margin-bottom:8px">
        ${p.email ? esc(p.email) : '<span style="color:var(--rust)">no email on file</span>'}
        · ${items.length} call${items.length===1?'':'s'}${overdue?` · <span style="color:var(--rust)">${overdue} overdue</span>`:''}</div>
      ${items.slice(0,5).map(a=>`<div class="kv"><span>${esc(a.who||a.ringName||a.type)} — ${esc(String(a.type).replace(' Call',''))}</span>
        <span class="${days(a.nextDue)<0?'':''}" style="${days(a.nextDue)<0?'color:var(--rust)':''}">${days(a.nextDue)<0?daysWords(days(a.nextDue))+' overdue':'due '+fmtShort(a.nextDue)}</span></div>`).join('')}
      ${items.length>5?`<div class="row-sub" style="margin-top:4px">and ${items.length-5} more</div>`:''}
      ${p.email ? `<div class="btnrow" style="margin-top:10px">
        <button class="btn sm" onclick="sendDigestTest('${esc(p.id)}','${esc(p.email)}')">Send this to me as a test</button></div>` : ''}
    </div>`).join('')
      : `<div class="callout"><strong>Nothing is due within ${win} days</strong>
         No weekly emails would go out right now. That is the correct behaviour — reps are only
         emailed when they have calls waiting.</div>`}

    ${idle.length ? `<div class="row-sub" style="margin-top:10px">
      ${idle.length} rep${idle.length===1?'':'s'} with nothing due will not be emailed:
      ${idle.slice(0,8).map(l=>esc(l.p.name)).join(', ')}${idle.length>8?` and ${idle.length-8} more`:''}.</div>` : ''}`;
}

/** Send one rep's weekly digest to whoever is asking, to see what it looks like. */

function vOfficeDash(){
  const pend=waitingApprovals();
  const od=dueItems(null).filter(a=>days(a.nextDue)<0).length;
  // Zoho's own counts when we have them: exact, and the same on every load
  const st = S.stats || null;
  const act = st ? st.activeMembers : S.members.filter(m=>m.status==='active').length;
  const rings=S.rings.filter(r=>r.status==='active');
  const atRisk=rings.filter(r=>ringHealth(r)<50);
  const exits=S.activities.filter(a=>a.type==='Exit Interview'&&a.date>=TODAY_S.slice(0,4)+'-01-01').length;
  // Joined = Paid_Membership_StartDate in Zoho, counted across the members
  // loaded. "Left" cannot be dated: Zoho records that someone is Inactive
  // but not WHEN they went inactive, so we show the current total instead
  // of inventing a year figure.
  const yr = String(new Date().getFullYear());
  const newM = st && st.year === yr ? st.joinedThisYear : S.members.filter(m => m.status==='active' && m.joined && m.joined >= yr+'-01-01').length;
  const inactive = st ? st.inactiveMembers : S.members.filter(m => m.status !== 'active').length;

  return `${announceBanner()}
    <div class="hello"><h2>${greeting()}</h2><div class="sub">${todayLong()} · where things stand across every rep and ring</div></div>
    <div class="stats">
      <div class="stat click" onclick="setView('approvals')"><div class="n" style="color:var(--accent)">${pend}</div><div class="l">Awaiting approval</div></div>
      <div class="stat click" onclick="setView('coverage')"><div class="n" style="color:var(--rust)">${od}</div><div class="l">Overdue contacts</div></div>
      <div class="stat click" onclick="setView('members')"><div class="n">${act}</div><div class="l">Active members</div></div>
      <div class="stat click" onclick="setView('allrings')"><div class="n">${rings.length}</div><div class="l">Active rings</div></div>
      <div class="stat click" onclick="setView('members')" title="Members whose paid start date in Zoho falls this year">
        <div class="n" style="color:var(--primary)">+${newM}</div><div class="l">Joined in ${yr}</div></div>
      <div class="stat click" onclick="setView('insights')" title="Members marked Inactive in Zoho. Zoho does not record the date they left, so this is a running total, not a figure for this year.">
        <div class="n" style="color:var(--rust)">${inactive}</div><div class="l">Inactive members</div></div>
      ${(() => { // Mel: members paying but in no group, beside Inactive

        return `<div class="stat click" onclick="setView('unaffiliated')" title="Active members who are not in any Growth Ring">
          <div class="n" style="color:var(--accent)">${known ? n : '…'}</div><div class="l">Not in a Growth Ring</div></div>`; })()}
    </div>
    ${(() => {
      const counts = weeklyCounts(S.activities.filter(a => a.outcome));   // calls made, not merely booked
      // Nothing logged yet: one line, not an empty chart that loads last
      // Always the same box while loading, so nothing below it jumps when it settles
      if(!counts.some(n => n)) return (loading || loadingDetail) && !S.activities.length
        ? `<div class="card nudge">${icon('phone',18)}<div style="flex:1"><strong>Calls logged by the reps</strong>
            <div class="row-sub">Checking the last 8 weeks…</div></div></div>`
        : `<div class="card nudge">${icon('phone',18)}<div style="flex:1">
        <strong>No calls logged by any rep in the last 8 weeks</strong>
        <div class="row-sub">The weekly chart and the most-active list appear here as reps log calls.</div></div></div>`;
      // Who logged the most this month, so the office sees effort, not just totals
      const month = TODAY_S.slice(0,7), by = {};
      S.activities.forEach(a => { if(a.outcome && a.repId && String(a.date||'').slice(0,7) === month) by[a.repId] = (by[a.repId]||0) + 1; });
      const top = Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,5);
      const most = top.length ? top[0][1] : 1;
      return `<div class="dash-pair">${trendCard('Calls and meetings logged · all reps', counts)}
        ${top.length ? `<div class="card leader"><div class="trend-t">Most active this month</div>
          ${top.map(([id,n]) => `<div class="leader-row"><span class="rp-av">${esc(repInitials(pname(id)))}</span>
            <div style="flex:1;min-width:0"><div class="leader-name">${esc(splitRepName(pname(id)).name)}</div>

            <strong class="leader-n">${n}</strong></div>`).join('')}</div>` : ''}</div>`;
    })()}
    ${arCard()}
    ${summitProgressCard()}
    ${(() => {
      const rated = rings.map(r=>({r, h:ringHealth(r)})).filter(x=>x.h!==null);
      const risky = rated.filter(x=>x.h<50);
      const unrated = rings.length - rated.length;

      let out = '';
      if(risky.length){
        const show = risky.slice(0,6).map(x=>esc(x.r.name)).join(', ');
        out += `<div class="callout rust"><strong>${risky.length} ring${risky.length===1?'':'s'} at risk</strong>
          ${show}${risky.length>6?` and ${risky.length-6} more`:''}
          <div class="btnrow" style="margin-top:9px"><button class="btn sm" onclick="setView('allrings');ui.ringHealth='risk';renderContent()">See the ${risky.length}</button></div></div>`;
      } else if(rated.length){
        out += `<div class="callout ok"><strong>No rings at risk</strong>Every rated group is scoring above 50.</div>`;
      }

      if(unrated){
        out += `<div class="callout"><strong>${unrated} ring${unrated===1?'':'s'} cannot be rated yet</strong>
          They have no meeting rhythm, visit dates or attendance recorded in Zoho, so there is nothing to score.
          Filling those in is what turns this into a useful signal.
          <div class="btnrow" style="margin-top:9px">
            <button class="btn sm" onclick="ui.report='missing-detail';setView('reports')">See what's missing</button>
          </div></div>`;
      }
      return out;
    })()}

    ${(() => {
      const due = dueItems(null).length;
      const active = S.rings.filter(r=>r.status==='active').length;
      if(due || !active) return '';
      return `<div class="callout info"><strong>No calls are scheduled yet</strong>
        ${active} active ring${active===1?'':'s'} and nothing due, so every rep will sign in to an empty screen.
        Starting the cycle creates a first facilitator call for each ring, spread over coming weeks
        so nobody opens the app to twenty calls at once.
        <div class="btnrow" style="margin-top:9px">
          <button class="btn sm primary" onclick="openStartCycle()">Start the call cycle</button>
        </div></div>`;
    })()}

    ${(() => {
      // The next few events, with who is coming — names behind "See the list"
      const soon = (S.events||[]).filter(e => e.date && days(e.date) >= 0 && days(e.date) <= 21)
        .sort((a,b) => a.date.localeCompare(b.date)).slice(0, 3);
      if(!soon.length) return '';
      return `<h3 class="sub-h">Upcoming events</h3>
        ${soon.map(e => `<div class="card" style="margin-bottom:10px;padding:13px 15px">
          <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">
            <div style="flex:1;min-width:180px">
              <div class="row-title clicky" onclick="openEvent('${e.id}')">${esc(e.title)}</div>
              <div class="row-sub">${fmt(e.date)}${e.time?' · '+esc(e.time):''}${e.location?' · '+mapLink(e.location):''}</div>
            </div>
            <span class="tag info">${days(e.date)===0?'today':days(e.date)===1?'tomorrow':'in '+days(e.date)+' days'}</span>
          </div>
          ${attendeeBlock(e.id, e.registrationCount)}
        </div>`).join('')}`;
    })()}

    <h3 class="sub-h">Needs your attention</h3>
    ${S.rings.filter(r=>r.status==='pending').map(r=>`<div class="row clicky" onclick="setView('approvals')">
      <div class="row-main"><div class="row-title">${esc(r.name)}</div><div class="row-sub">${pname(r.repId)} · submitted ${fmt(r.createdAt)}</div></div>
      <span class="tag soon">approve</span></div>`).join('')}
    ${dueItems(null).filter(a=>days(a.nextDue)<-14).slice(0,5).map(a=>`<div class="row">
      <div class="row-main"><div class="row-title">${esc(a.who)}</div><div class="row-sub">${a.type} · ${pname(a.repId)} · ${ring(a.ringId)?esc(ring(a.ringId).name):''}</div></div>
      ${tag(a.nextDue)}</div>`).join('')}
    <h3 class="sub-h">Recent activity across the network</h3>
    ${(S.activities.some(a=>a.outcome) ? '' : `<div class="empty">No calls logged yet. Booked calls show above as they fall due.</div>`)}
    ${S.activities.filter(a=>a.outcome).sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,6).map(a=>`<div class="row">
      <div class="row-main"><div class="row-title">${a.type} — ${esc(a.who)}</div>
      <div class="row-sub">${pname(a.repId)} · ${fmt(a.date)}${a.notes?' · '+esc(a.notes):''}</div></div></div>`).join('')}`;
}

function vApprovals(){
  const asks = (S.pending||[]);
  const waiting = asks.filter(p=>p.status==='pending');
  // Sent back: the rep has it with the reason; it no longer needs the office
  const decided = asks.filter(p=>p.status==='approved').slice(0,20);
  const zohoAsks = `
    <h3 class="sub-h">Requests to add to Zoho · ${waiting.length}</h3>
    <div class="row-sub" style="margin-bottom:10px">Registrations, cancellations and leads submitted by reps.
      Nothing reaches the CRM until you approve it here.</div>
    ${waiting.length ? pendingRows(waiting, true) : `<div class="empty">Nothing waiting.</div>`}
    ${decided.length ? `<h3 class="sub-h">Recently decided</h3>${pendingRows(decided, false)}` : ''}
  `;
  // Hours and expenses reps have submitted: the first thing to approve
  const claims = can('accounting') ? [...S.timeEntries.filter(t => t.status === 'Submitted').map(t => ({ ...t, kind:'time' })),
    ...S.expenses.filter(x => x.status === 'Submitted').map(x => ({ ...x, kind:'exp' }))].sort((a,b) => String(a.date).localeCompare(String(b.date))) : [];
  const claimRows = claims.length ? `<h3 class="sub-h">Hours and expenses to approve · ${claims.length}</h3>
    <div class="card" style="padding:4px 15px;margin-bottom:12px">${claims.map(c => `<div class="row">
      <div class="row-main"><div class="row-title">${c.kind === 'exp' ? money(c.amount) : c.hours + (c.hours === 1 ? ' hour' : ' hours')} — ${esc(c.category)}</div>
        <div class="row-sub"><strong>${esc(c.repName || pname(c.repId) || 'Unknown')}</strong> · ${fmt(c.date)}${c.kind === 'exp' && c.vendor ? ' · ' + esc(c.vendor) : ''} · ${esc(c.description)}</div></div>
      <div class="row-actions">${c.kind === 'exp' && c.receipt ? `<button class="btn sm" onclick="viewReceipt('${c.id}')">Receipt</button>` : c.kind === 'exp' ? '<span class="tag later">no receipt</span>' : ''}
        <button class="btn sm" onclick="openDecline('${c.kind}','${c.id}')">Decline</button>
        <button class="btn sm primary" onclick="approveEntry('${c.kind}','${c.id}')">Approve</button></div></div>`).join('')}
      <div class="row-sub" style="padding:8px 0">Approved items go to accounting from <a href="#" class="inline-link" onclick="event.preventDefault();setView('timesheet')">Hours and expenses</a>.</div></div>` : '';
  // Hours and expenses waiting for an admin's final approval come first
  return claimRows + (can('accounting') && S.acctBatches && S.acctBatches.pending && S.acctBatches.pending.length
    ? `<h3 class="sub-h">Hours and expenses · final approval</h3>${acctStatusCallouts()}` : '')
    + vApprovalsInner(zohoAsks);
}

/**
 * Hours and expenses waiting for the final OK, and the last batch sent back.
 * Admins get the Review button; everyone else sees where things stand.
 */
function acctStatusCallouts(){
  if(!can('accounting')) return '';
  const b = S.acctBatches || {};
  const waiting = (b.pending || [])[0];
  const back = b.returned;
  return `${waiting ? `<div class="callout ${isAdmin() ? 'ok' : 'info'}">
      <strong>${isAdmin() ? 'Ready for your final approval' : 'Waiting for an admin to give the final approval'}</strong>
      ${waiting.expenses} expense${waiting.expenses === 1 ? '' : 's'} and ${waiting.time} time entr${waiting.time === 1 ? 'y' : 'ies'},
      sent by ${esc(waiting.requestedBy || 'the office')} on ${fmt(String(waiting.createdAt).slice(0,10))}.
      ${isAdmin() ? 'Nothing goes to accounting until you send it.' : 'It goes to accounting as soon as an admin approves it.'}
      ${isAdmin() ? `<div class="btnrow" style="margin-top:9px"><button class="btn sm primary" onclick="openBatchReview(${waiting.id})">Review and send</button></div>` : ''}
    </div>` : ''}
    ${back && !waiting ? `<div class="callout rust"><strong>Sent back by ${esc(back.decidedBy || 'an admin')}</strong>
      ${back.note ? esc(back.note) : 'No note was left.'} Nothing went to accounting — make any changes, then send again.</div>` : ''}`;
}

/** The admin's review: every item and receipt, then send or return. */
async function openBatchReview(id){
  openModal(`<h3>Final approval</h3><p class="lead">Loading…</p>`);
  let b;
  try{ b = await API.batch(id); }
  catch(e){ openModal(`<h3>Couldn't open it</h3><p class="lead">${esc(e.message)}</p>
    <div class="m-actions"><button class="btn primary" onclick="closeModal()">Close</button></div>`); return; }
  const total = b.expenses.reduce((s,x)=>s+x.amount,0), hours = b.time.reduce((s,x)=>s+x.hours,0);
  openModal(`<h3>Final approval</h3>
    <p class="lead">${b.expenses.length} expense${b.expenses.length===1?'':'s'} · <strong>${money(total)}</strong> · ${hours} hour${hours===1?'':'s'}.
      Approving emails ${esc(S.settings.accountingEmail || 'accounting')}${S.settings.booksAuto !== 'off' ? ' and makes the Zoho Books bills' : ''}.</p>
    <div style="max-height:46vh;overflow:auto;margin-bottom:8px">
    ${b.expenses.length ? `<h3 class="sub-h" style="margin-top:0">Expenses</h3>${b.expenses.map(x=>`<div class="row">
      <div class="row-main"><div class="row-title">${money(x.amount)} — ${esc(x.category)}${x.vendor?' · '+esc(x.vendor):''}</div>
        <div class="row-sub">${esc(x.rep)} · ${fmt(x.date)} · ${esc(x.description)}</div></div>
      <div class="row-actions">${x.hasReceipt?`<button class="btn sm" onclick="viewReceipt('x_${x.id}',{backToBatch:${b.id}})">Receipt</button>`:`<span class="tag overdue">no receipt</span>`}</div>
      </div>`).join('')}` : ''}
    ${b.time.length ? `<h3 class="sub-h">Hours</h3>${b.time.map(x=>`<div class="row"><div class="row-main">
      <div class="row-title">${x.hours} hour${x.hours===1?'':'s'} — ${esc(x.category)}</div>
      <div class="row-sub">${esc(x.rep)} · ${fmt(x.date)} · ${esc(x.description)}</div></div></div>`).join('')}` : ''}
    </div>
    <div id="batchReturn"></div>
    <div id="batchErr" style="display:none;color:var(--rust);font-size:13px;margin-bottom:8px"></div>
    <div class="m-actions">
      <button type="button" class="btn" onclick="closeModal()">Close</button>
      <button type="button" class="btn" id="batchBackBtn" onclick="showBatchReturn(${b.id})">Send back with a note</button>
      <button type="button" class="btn primary" id="batchOkBtn" onclick="approveBatchInApp(${b.id})">Approve and send to accounting</button>
    </div>`);
}
function showBatchReturn(id){
  document.getElementById('batchReturn').innerHTML = `<div class="field"><label>What needs changing?</label>
    <textarea id="batchNote" placeholder="e.g. the Staples receipt is missing; check mileage on the 4th"></textarea></div>`;
  const btn = document.getElementById('batchBackBtn');
  btn.textContent = 'Send back to the office';
  btn.onclick = () => returnBatchInApp(id);
}
async function approveBatchInApp(id){
  const btn = document.getElementById('batchOkBtn'), err = document.getElementById('batchErr');
  btn.disabled = true; btn.textContent = 'Sending…';
  try{
    const out = await API.approveBatch(id);
    const [t, x, b] = await Promise.all([API.time(), API.expenses(), API.accountingBatches()]);
    S.timeEntries = t.map(adapt.timeEntry); S.expenses = x.map(adapt.expense); S.acctBatches = b; save();
    openModal(`<h3>Sent to accounting</h3>
      <p class="lead">${out.time} time entr${out.time === 1 ? 'y' : 'ies'} and ${out.expenses} expense${out.expenses === 1 ? '' : 's'} emailed to ${esc(out.to)}.</p>
      ${out.books && can('books') ? booksResult(out.books) || `<div class="callout ${out.books.failed || out.books.error ? 'rust' : 'ok'}"><strong>Zoho Books</strong>
        ${out.books.error ? esc(out.books.error) : `${out.books.made} bill${out.books.made === 1 ? '' : 's'} made${out.books.left ? `; ${out.books.left} more within 15 minutes` : ''}.
        ${out.books.failed ? `${out.books.failed} could not be made — see Settings → Zoho Books.` : ''}`}</div>` : ''}
      <div class="m-actions"><button class="btn primary" onclick="closeModal();render()">Done</button></div>`);
  }catch(e){ err.style.display='block'; err.textContent = e.message; btn.disabled = false; btn.textContent = 'Approve and send to accounting'; }
}
async function returnBatchInApp(id){
  const btn = document.getElementById('batchBackBtn');
  btn.disabled = true;
  try{
    await API.returnBatch(id, (document.getElementById('batchNote')||{}).value || '');
    S.acctBatches = await API.accountingBatches(); save();
    closeModal(); toast('Sent back to the office'); render();
  }catch(e){ btn.disabled = false; toast(e.message); }
}

function vCoverage(){
  const reps=PEOPLE.filter(p=>p.role==='rep');
  const cards=reps.map(p=>{
    const items=dueItems(p.id), od=items.filter(a=>days(a.nextDue)<0).length;
    const total=items.length||1, onTime=Math.round(((total-od)/total)*100);
    const rs=myRings(p.id).filter(r=>r.status==='active');
    const avgH=rs.length?Math.round(rs.reduce((s,r)=>s+ringHealth(r),0)/rs.length):0;
    return `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:baseline;">
        <div><div class="row-title">${esc(p.name)}</div><div class="row-sub">${esc(p.region||'')}</div></div>
        <div style="font-family:'Fraunces',serif;font-size:20px;">${onTime}%</div></div>
      <div class="row-sub" style="margin-top:4px">${rs.length} rings · ${activeMembers(p.id).length} members · ${od} overdue · avg health ${avgH}</div>
      <div class="bar ${onTime>=85?'':onTime>=60?'warn':'bad'}"><span style="width:${onTime}%"></span></div>
      <div class="btnrow" style="margin-top:10px"><button class="btn sm" onclick="openRepSheet('${p.id}')">View detail</button></div></div>`;
  }).join('');
  const risk=S.members.filter(m=>m.status==='active').map(m=>{
    const lc=lastContact(m.id); return {m,gap:lc?Math.abs(days(lc.date)):9999,lc};
  }).filter(x=>x.gap>300).sort((a,b)=>b.gap-a.gap);
  return `<div class="section-head"><div><h2>Coverage</h2><div class="sub">How well reps are keeping up.</div></div>
    <button class="btn" onclick="exportCoverage()">Export CSV</button></div>
    <div class="stats">
      <div class="stat"><div class="n" style="color:var(--rust)">${dueItems(null).filter(a=>days(a.nextDue)<0).length}</div><div class="l">Overdue</div></div>
      <div class="stat"><div class="n" style="color:var(--accent)">${dueItems(null).filter(a=>days(a.nextDue)<=S.settings.dueWindow).length}</div><div class="l">Due soon</div></div>
      <div class="stat"><div class="n">${S.members.filter(m=>m.status==='active'&&!lastContact(m.id)).length}</div><div class="l">Never contacted</div></div>
      <div class="stat"><div class="n">${S.rings.filter(r=>r.status==='active'&&!launchDone(r)).length}</div><div class="l">Unfinished launches</div></div>
    </div>
    <h3 class="sub-h">By rep</h3>${cards}
    <h3 class="sub-h">Members nobody has reached in a while</h3>
    ${risk.map(x=>`<div class="row clicky" onclick="openMember('${x.m.id}')"><div class="row-main">
      <div class="row-title">${esc(x.m.name)}</div>
      <div class="row-sub">${pname(x.m.repId)} · ${ring(x.m.ringId)?esc(ring(x.m.ringId).name):''} · last spoke ${x.lc?fmt(x.lc.date):'never'}</div>
    </div><span class="tag overdue">${x.lc?Math.round(x.gap/30)+' mo':'never'}</span></div>`).join('')||`<div class="empty">Everyone has been contacted recently.</div>`}`;
}

/* ── selecting rings for a bulk edit ── */
let bulkPick = new Set();

function toggleBulk(id){
  bulkPick.has(id) ? bulkPick.delete(id) : bulkPick.add(id);
  // Only the banner changes. Rebuilding all 81 rows to tick one box was the
  // laggiest interaction in the app.
  updateBulkBanner();
}
function updateBulkBanner(){
  const el = document.getElementById('bulkBanner');
  if(!el){ renderContent(); return; }
  el.innerHTML = bulkPick.size
    ? `<div class="callout ok" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
        <span><strong>${bulkPick.size} selected</strong></span>
        <span class="btnrow"><button class="btn sm primary" onclick="openBulkEdit()">Set details</button>
        <button class="btn sm" onclick="bulkClear()">Clear</button></span></div>`
    : '';
}
function bulkPickAllMissing(){
  bulkPick = new Set(S.rings.filter(r=>r.status==='active' && (!r.meetingRhythm || !r.meetingFormat)).map(r=>r.id));
  renderContent();   // every checkbox changes, so a full redraw is right here
}
function bulkClear(){ bulkPick = new Set(); renderContent(); }

function openBulkEdit(){
  if(!bulkPick.size){ toast('Pick some rings first'); return; }
  openModal(`<h3>Set details on ${bulkPick.size} ring${bulkPick.size===1?'':'s'}</h3>
    <p class="lead">Only the fields you fill in are changed. Facilitator, rep and status are left alone —
      those are per-ring decisions.</p>
    <form onsubmit="submitBulkEdit(event)">
      <div class="field"><label>How often the group meets</label>
        <select name="meetingFrequency"><option value="">— leave as is —</option>
          ${['Weekly','Monthly','Bi Monthly','Quarterly','Yearly','Other'].map(x=>`<option>${x}</option>`).join('')}
        </select></div>
      <div class="field"><label>Meeting format</label>
        <select name="meetingFormat"><option value="">— leave as is —</option>
          ${['In Person','Virtual','Hybrid'].map(x=>`<option>${x}</option>`).join('')}
        </select></div>
      <div class="field"><label>Target group size</label>
        <input type="number" name="capacity" min="2" max="20" placeholder="Leave blank to keep"></div>
      <div id="bulkErr" style="display:none;color:var(--rust);font-size:13px;margin-bottom:8px"></div>
      <div class="m-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button>
      <button type="submit" class="btn primary">Apply to ${bulkPick.size}</button></div></form>`);
}
async function submitBulkEdit(e){
  e.preventDefault();
  const f=e.target.elements, err=document.getElementById('bulkErr');
  const fields={
    meetingFrequency:f.namedItem('meetingFrequency').value,
    meetingFormat:f.namedItem('meetingFormat').value,
    capacity:f.namedItem('capacity').value,
  };
  try{
    const out = await API.bulkRings([...bulkPick], fields);
    closeModal(); bulkClear();
    toast(`${out.updated} ring${out.updated===1?'':'s'} updated`);
    await loadFromServer(); render();
  }catch(ex){
    err.style.display='block';
    err.textContent = ex.message || 'Could not update those rings';
  }
}

/* Retention, worked out on the server from Zoho Memberships (see /stats/retention) */
// The last answer is kept on this device, so the screen opens at once and
// quietly updates; it is also fetched in the background after sign-in.
var retentionData = (() => { try{ return JSON.parse(localStorage.getItem('rephub_retention') || 'null'); }catch(e){ return null; } })();
var retentionBusy = false, retentionFresh = false;
function loadRetention(force){
  if(retentionBusy || (retentionFresh && !force) || !API.live) return;
  retentionBusy = true;
  API.call('/stats/retention' + (force ? '?fresh=1' : '')).then(v => {
    retentionData = v; retentionFresh = true;
    try{ localStorage.setItem('rephub_retention', JSON.stringify(v)); }catch(e){}
  }).catch(e => { if(!retentionData) retentionData = { error: e.message }; })
    .finally(() => { retentionBusy = false; if(ui.view === 'insights') renderContent(); });
}
const MONTH_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
/* Joined vs left, month by month: two bars a month */
function joinLeftChart(months){
  const max = Math.max(1, ...months.map(m => Math.max(m.joined, m.left)));
  const w = 100 / Math.max(1, months.length);
  return `<div class="card trend"><div class="trend-head"><div><div class="trend-t">Joined and left, month by month</div></div>
      <div class="jl-key"><span><i style="background:var(--primary)"></i>Joined</span><span><i style="background:var(--rust)"></i>Left</span></div></div>
    <svg class="trend-bars" viewBox="0 0 100 100" preserveAspectRatio="none" style="height:110px">
      ${months.map((m, i) => { const x = i * w, bw = w * 0.32, hj = Math.round(m.joined / max * 96), hl = Math.round(m.left / max * 96);
        return `<rect x="${(x + w*0.16).toFixed(2)}" y="${100-hj}" width="${bw.toFixed(2)}" height="${Math.max(hj, m.joined?2:0)}" rx="1" style="fill:var(--primary)"><title>${MONTH_SHORT[m.month-1]}: ${m.joined} joined</title></rect>
          <rect x="${(x + w*0.52).toFixed(2)}" y="${100-hl}" width="${bw.toFixed(2)}" height="${Math.max(hl, m.left?2:0)}" rx="1" style="fill:var(--rust)"><title>${MONTH_SHORT[m.month-1]}: ${m.left} left</title></rect>`; }).join('')}
    </svg>
    <div class="trend-foot" style="justify-content:space-around">${months.map(m => `<span>${MONTH_SHORT[m.month-1]}</span>`).join('')}</div></div>`;
}
function vInsights(){
  const exits=S.activities.filter(a=>a.type==='Exit Interview');
  const counts={}; exits.forEach(e=>{const k=e.exitReason||'Not recorded'; counts[k]=(counts[k]||0)+1;});
  const max=Math.max(1,...Object.values(counts));
  const head = `<div class="section-head"><div><h2>Retention insights</h2><div class="sub">Who joins, who leaves, and whether the network is growing.
      ${retentionData && retentionData.at ? `<span class="row-sub">· updated ${esc(new Date(retentionData.at).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}))}${retentionBusy ? ' · checking…' : ''}</span>` : ''}</div></div>
    <div class="btnrow"><button class="btn sm" onclick="loadRetention(true);renderContent()" ${retentionBusy?'disabled':''}>${retentionBusy?'Refreshing…':'Refresh'}</button>
    <button class="btn" onclick="ui.report='exit-interviews';exportReport()">Export CSV</button></div></div>`;
  loadRetention();
  const R = retentionData;
  const top = !R ? skeleton(3) : R.error ? `<div class="callout rust"><strong>Could not work out retention</strong>${esc(R.error)}</div>` : `
    <div class="stats">
      <div class="stat click" onclick="document.getElementById('joinedList').scrollIntoView({behavior:'smooth'})"><div class="n" style="color:var(--primary)">+${R.joined}</div><div class="l">Joined in ${R.year}</div></div>
      <div class="stat click" onclick="document.getElementById('leftList').scrollIntoView({behavior:'smooth'})"><div class="n" style="color:var(--rust)">−${R.left}</div><div class="l">Left in ${R.year}</div></div>
      <div class="stat"><div class="n">${R.retention == null ? '—' : R.retention + '%'}</div><div class="l">Retained since 1 Jan<br><span style="font-size:10px;opacity:.7">${R.retained} of ${R.base}</span></div></div>
      <div class="stat"><div class="n">${R.activeMemberships}</div><div class="l">Current memberships</div></div>
    </div>
    <div class="dash-pair">${joinLeftChart(R.months)}
      ${donut('Current members by level', Object.entries(R.tiers).sort((a,b)=>b[1]-a[1]).map(([t,n]) =>
        ({ label: t, value: n, color: TIER_COLOURS[t] || '#8A9284' })), R.activeMemberships, 'members')}</div>
    <div class="callout"><strong>Where these numbers come from</strong>
      All from Zoho. <em>Joined</em> is the paid membership start date on the member.
      <em>Left</em> is a member with no current membership whose last one ended (Membership End Date) this year.
      <em>Retained</em> is, of everyone whose membership was running on 1 January, how many still have one.
      ${R.leftNoDate ? `<br><strong style="display:inline">${R.leftNoDate} inactive membership${R.leftNoDate===1?' has':'s have'} no end date</strong> in Zoho, so ${R.leftNoDate===1?'it is':'they are'} not counted in a month — filling those in makes Left exact.` : ''}</div>
    <h3 class="sub-h" id="leftList">Who left in ${R.year} · ${R.left}</h3>
    ${R.leftList.length ? `<div class="card" style="padding:4px 15px">${R.leftList.map(l => `<div class="row ${S.members.some(m=>m.id===l.id)?'clicky':''}" ${S.members.some(m=>m.id===l.id)?`onclick="openMember('${l.id}')"`:''}>
      <div class="row-main"><div class="row-title">${esc(l.name)} ${l.tier?`<span class="tag tier tier-${esc(l.tier.toLowerCase().replace(/\s+/g,'-'))}">${esc(l.tier)}</span>`:''}</div>
        <div class="row-sub">Membership ended ${fmt(l.ended)}${l.reason?' · reason: '+esc(l.reason):''}</div></div></div>`).join('')}</div>`
      : `<div class="empty">Nobody has left this year.</div>`}
    <h3 class="sub-h" id="joinedList">Who joined in ${R.year} · ${R.joined}</h3>
    ${(R.joinedList || []).length ? `<div class="card" style="padding:4px 15px">${R.joinedList.map(j => { const here = S.members.some(m => m.id === j.id);
      return `<div class="row ${here?'clicky':''}" ${here?`onclick="openMember('${j.id}')"`:''}>
      <div class="row-main"><div class="row-title">${esc(j.name)} ${j.tier?`<span class="tag tier tier-${esc(j.tier.toLowerCase().replace(/\s+/g,'-'))}">${esc(j.tier)}</span>`:''}</div>
        <div class="row-sub">Paid membership started ${fmt(j.joined)}</div></div></div>`; }).join('')}</div>`
      : (R.joinedList ? `<div class="empty">Nobody has joined yet this year.</div>` : `<div class="row-sub">Refresh to see the list.</div>`)}`;
  return head + top + `
    <h3 class="sub-h">Reasons given for leaving</h3>
    ${R && R.reasons && Object.keys(R.reasons).length ? `<div class="row-sub" style="margin:-4px 0 8px">From Zoho's "Reason for loss": ${Object.entries(R.reasons).map(([k,v])=>`${esc(k)} ${v}`).join(' · ')}</div>` : ''}
    ${Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div style="margin-bottom:11px">
      <div style="display:flex;justify-content:space-between;font-size:13.5px"><span>${esc(k)}</span><strong>${v}</strong></div>
      <div class="bar"><span style="width:${(v/max)*100}%"></span></div></div>`).join('')||`<div class="empty">No exit interviews recorded yet.</div>`}
    ${exits.length ? `<h3 class="sub-h">Each exit interview</h3>` : ''}
    ${exits.map(e=>`<div class="row"><div class="row-main"><div class="row-title">${esc(e.who)}</div>
      <div class="row-sub">${pname(e.repId)} · ${fmt(e.date)} · would return: ${esc(e.wouldReturn||'—')}${e.notes?' · '+esc(e.notes):''}</div></div>
      <span class="tag later">${esc(e.exitReason||'—')}</span></div>`).join('')}`;
}

/**
 * The Reps screen's two lists. Kept from the last visit (and across a
 * refresh) so the screen shows at once, then quietly brought up to date —
 * instead of a blank wait while two calls ran one after the other on every
 * visit, sometimes several times over.
 */
let serverUsers = null;
let zohoReps = null;
let usersLoadedAt = 0, usersInFlight = null;
try{
  const t = JSON.parse(localStorage.getItem('rephub_team') || 'null');
  if(t && Array.isArray(t.users)) serverUsers = t.users;
  if(t && Array.isArray(t.reps)) zohoReps = t.reps;
}catch(e){}
function keepTeam(){
  try{ localStorage.setItem('rephub_team', JSON.stringify({
    users: Array.isArray(serverUsers) ? serverUsers : null, reps: Array.isArray(zohoReps) ? zohoReps : null })); }catch(e){}
}
function loadUsers(force){
  if(usersInFlight) return usersInFlight;
  if(!force && Date.now() - usersLoadedAt < 60_000 && serverUsers && zohoReps) return Promise.resolve();
  usersInFlight = Promise.all([
    API.users().then(v => { serverUsers = v; }).catch(e => { if(!Array.isArray(serverUsers)) serverUsers = { error: e.message }; }),
    API.repsFromZoho().then(v => { zohoReps = v; }).catch(e => { if(!Array.isArray(zohoReps)) zohoReps = { error: e.message }; }),
  ]).then(() => {
    usersLoadedAt = Date.now(); keepTeam();
    if(ui.view === 'team' || ui.view === 'repAccount') renderContent();
  }).finally(() => { usersInFlight = null; });
  return usersInFlight;
}

async function repsInvite(ids, btn){

/* ══════════════ REPS ══════════════
 * One row per rep: their rings, where they cover and whether they use Rep Hub.
 * Opening a rep shows everything about them on one page. Office staff and
 * directors are listed separately below. */
/** Every rep, from Zoho (who is named on a ring) joined to their Rep Hub account */
function teamReps(){
  const su = Array.isArray(serverUsers) ? serverUsers : [];
  const z = Array.isArray(zohoReps) ? zohoReps : [];
  const out = z.map(r => ({ id: r.contactId, name: r.name, rings: r.rings, regions: r.regions || [], email: r.email || '',
    phone: r.phone || '', business: r.business || '', account: r.account || su.find(u => u.zoho_owner_id === r.contactId) || null }));
  // Accounts for reps no longer named on a ring, or never linked to Zoho
  su.filter(u => u.role === 'rep' && !out.some(r => r.account && r.account.id === u.id)).forEach(u =>
    out.push({ id: u.zoho_owner_id || 'u:' + u.id, name: u.name, rings: 0, regions: u.region ? [u.region] : [], email: u.email, account: u, unlinked: !u.zoho_owner_id }));
  out.forEach(r => { r.status = r.account && r.account.last_login_at ? 'active' : r.account ? 'invited' : r.email ? 'none' : 'noemail'; });
  return out.sort((a, b) => b.rings - a.rings || String(a.name).localeCompare(String(b.name)));
}

  const [l, t] = TEAM_STATUS[r.status];

async function connectBooks(btn){
  const code = (document.getElementById('booksCode').value || '').trim();
  if(!code){ toast('Paste the code from the Zoho API console first'); return; }
  btn.disabled = true; btn.textContent = 'Connecting…';
  try{
    booksInfo = await API.booksConnect(code);
    toast('Zoho Books connected');
  }catch(e){ toast(e.message || 'Could not connect'); btn.disabled = false; btn.textContent = 'Connect'; return; }
  const el = document.getElementById('booksCard'); if(el) el.innerHTML = booksCard();
}
async function disconnectBooks(){
  if(!confirm('Disconnect Zoho Books? Expenses will still be emailed to accounting, but no bills will be made.')) return;
  try{ await API.booksDisconnect(); toast('Zoho Books disconnected'); }catch(e){ toast(e.message); }
  booksInfo = null; loadBooksStatus(true);
}

  if(!elevated()) return head + `<div class="card access-lock">

async function unlockAccess(e){
  e.preventDefault();
  const btn = e.target.querySelector('button[type=submit]'), err = document.getElementById('lockErr');
  btn.disabled = true; btn.textContent = 'Checking…';
  try{
    const out = await API.elevate(e.target.elements.namedItem('password').value);
    elevation = { token: out.elevation, until: Date.now() + (out.minutes || 15) * 60000 - 20000 }; keepElevation();
    accessData = out.access || await API.owner('/admin/access');   // usually comes back with the password check
    renderContent();
  }catch(ex){
    if(err){ err.style.display = 'block'; err.textContent = ex.message || 'That password is not right'; }
    btn.disabled = false; btn.textContent = 'Continue';
  }
}
function lockAccess(){ elevation = { token: null, until: 0 }; keepElevation(); accessData = null; renderContent(); toast('Locked'); }
async function ownerCall(path, opts){
  try{ return await API.owner(path, opts); }
  catch(e){ if(e.data && e.data.needsPassword){ lockAccess(); } throw e; }
}
async function saveAccess(body, msg){
  try{ accessData = await ownerCall('/admin/access', { method: 'PUT', body: JSON.stringify(body) }); toast(msg || 'Saved'); }
  catch(e){ toast(e.message || 'Could not save'); }
  renderContent();
}
function setPerm(role, cap, on){
  const perms = JSON.parse(JSON.stringify(accessData.perms));
  perms[role][cap] = on;
  saveAccess({ perms }, `${role==='admin'?'Directors':'Office staff'}: ${accessData.caps[cap].label} ${on?'on':'off'}`);
}
function setPermGroup(role, group, on){
  const perms = JSON.parse(JSON.stringify(accessData.perms));
  Object.entries(accessData.caps).forEach(([k, c]) => { if((c.group || 'sensitive') === group) perms[role][k] = on; });
  saveAccess({ perms }, `${role==='admin'?'Directors':'Office staff'}: every screen ${on?'on':'off'}`);
}
async function saveCaptcha(off){
  const siteKey = off ? '' : (document.getElementById('capSite').value || '').trim();
  const secret = off ? '' : (document.getElementById('capSecret').value || '').trim();
  if(!off && !siteKey){ toast('Paste the site key first'); return; }
  if(off && !confirm('Switch off the "I\'m not a robot" check?')) return;
  const type = (document.getElementById('capType') || {}).value === 'v2' ? 'v2' : 'v3';
  await saveAccess({ captcha: { siteKey, secret, type } }, off ? 'Robot check switched off' : 'Robot check is on for sign-in');
  captchaSiteKey = off ? null : siteKey; captchaType = type;
  try{ off ? localStorage.removeItem('rephub_captcha') : localStorage.setItem('rephub_captcha', siteKey);
       localStorage.setItem('rephub_captcha_type', type); }catch(e){}
}
function setTwoStep(k, on){
  saveAccess({ twoStep: { ...accessData.twoStep, [k]: on } }, `2-step sign-in ${on?'on':'off'} for ${k==='admin'?'directors':k==='staff'?'office staff':'reps'}`);
}
async function setRole(id, role, sel){
  const p = accessData.people.find(x => x.id === id);
  if(role === 'rep' && !confirm(`Remove ${p.name}'s office access? They will only see what a rep sees.`)){ sel.value = p.role; return; }
  try{ accessData = await ownerCall('/admin/access/role', { method: 'POST', body: JSON.stringify({ userId: id, role }) });
    toast(`${p.name} is now ${role==='admin'?'a director':role==='staff'?'office staff':'a rep'}`); serverUsers = null; }
  catch(e){ toast(e.message || 'Could not change that'); }
  renderContent();
}
async function transferOwner(id, name){
  if(!confirm(`Make ${name} the owner of Rep Hub?\n\nThey will control every permission, including yours. You will become a director.`)) return;
  try{
    await ownerCall('/admin/access/transfer', { method: 'POST', body: JSON.stringify({ userId: id }) });
    toast(`${name} is now the owner`);
    const out = await API.me(); signInAs(out.user, { keepView: true });
    lockAccess(); accessStatus = null; render();
  }catch(e){ toast(e.message || 'Could not transfer'); }
}
async function claimOwnership(e){
  e.preventDefault();
  const btn = e.target.querySelector('button[type=submit]');
  btn.disabled = true; btn.textContent = 'Checking…';
  try{
    const out = await API.elevate(e.target.elements.namedItem('password').value);
    elevation = { token: out.elevation, until: Date.now() + (out.minutes || 15) * 60000 - 20000 }; keepElevation();
    const res = await API.owner('/admin/access/claim', { method: 'POST' });

/* ══════════════════ ASKING THE OFFICE TO WRITE TO ZOHO ══════════════════
 * Nothing here touches the CRM directly. A rep submits, the office approves,
 * and only then is anything written — so a mistyped name never reaches Zoho.
 */
/* ══════════════ QR CODES ══════════════
 * Drawn in the browser (qrcode.js, loaded the first time one is needed).
 * Registration codes open /register.html for that event (or every summit
 * coming up): people sign themselves up, and it waits on Approvals. */
var qrLib = null;
function ensureQR(){
  if(window.QRCode) return Promise.resolve();
  return qrLib || (qrLib = addScript('https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js').catch(e => { qrLib = null; throw e; }));
}
/** Fill every [data-qr] on the page with its code */
function drawQRs(root){
  const els = [...(root || document).querySelectorAll('[data-qr]')].filter(el => !el.dataset.done);
  if(!els.length) return;
  ensureQR().then(() => els.forEach(el => {
    const url = new URL(el.dataset.qr, location.origin).href, size = parseInt(el.dataset.size || '84', 10);
    el.innerHTML = ''; new QRCode(el, { text: url, width: size, height: size, correctLevel: QRCode.CorrectLevel.M }); el.dataset.done = '1';
  })).catch(() => {});
}
/* One event, every summit coming up (null), or every event (`all`) */
function regLink(eventId){ return location.origin + '/register.html' + (eventId === 'all' ? '' : eventId ? '?e=' + encodeURIComponent(eventId) : '?summits=1'); }
function openRegQR(eventId, title){
  const link = regLink(eventId);
  openModal(`<h3>Registration QR · ${esc(title)}</h3>
    <p class="lead">${eventId === 'all' ? 'This one code lists every event and summit coming up; anyone who scans it' : eventId ? 'Anyone who scans this' : 'This one code lists every summit coming up; anyone who scans it'} can register themselves on their phone.
      Each sign-up waits on <strong>Approvals</strong> until the office approves it, then goes into Zoho. Members are matched by their email.</p>
    <div class="qr-big"><div id="qrBox" data-qr="${esc(link)}" data-size="220"></div></div>
    <div class="qr-link"><input value="${esc(link)}" readonly onclick="this.select()"></div>
    <div class="m-actions">
      <button class="btn" onclick="navigator.clipboard&&navigator.clipboard.writeText(${esc(JSON.stringify(link))}).then(()=>toast('Link copied'))">Copy link</button>
      <button class="btn" onclick="downloadQR(${esc(JSON.stringify(title))})">Download image</button>
      <button class="btn primary" onclick="printQRPoster(${esc(JSON.stringify(title))}, ${esc(JSON.stringify(link))})">Print poster</button></div>`);
  drawQRs(document.getElementById('modalBody'));
}
function qrImage(){ const box = document.getElementById('qrBox'); const c = box && box.querySelector('canvas'); const i = box && box.querySelector('img');
  return c ? c.toDataURL('image/png') : i ? i.src : ''; }
function downloadQR(title){
  const src = qrImage(); if(!src) return toast('The code is still being drawn');
  const a = document.createElement('a'); a.href = src; a.download = 'register-' + String(title).toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 40) + '.png'; a.click();
}
function printQRPoster(title, link){
  const src = qrImage(); if(!src) return toast('The code is still being drawn');
  const ev = (S.events || []).find(e => regLink(e.id) === link) || (Array.isArray(summitList) ? summitList.find(x => regLink(x.id) === link) : null);
  const when = ev ? fmt(ev.date) + (ev.time ? ' · ' + ev.time : '') : '';
  const where = ev ? [ev.venue, [ev.city, ev.state].filter(Boolean).join(', ')].filter(Boolean).join(', ') : '';
  openPrintable('Register · ' + title, `
    <div style="text-align:center;padding:30px 10px">

  arBusy = true;
  API.call('/members/ar' + (force ? '?fresh=1' : '')).then(v => { arData = v; }).catch(e => { arData = { error: e.message, members: [] }; })
    .finally(() => { arBusy = false; if(['ar','today','dash'].includes(ui.view)) renderContent(); });
}
const arMember = a => a.contactId ? member(a.contactId) : null;
function arCard(){
  if(!API.live || !(isRep() || can('members') || can('manager'))) return '';

  if(!arData || arData.error || arData.connected === false || !Array.isArray(arData.members) || !arData.members.length) return '';

const regKey = n => String(n || '').replace(/\s*#\s*\d+\s*$/, '').replace(/\s+/g, ' ').trim().toLowerCase();
/** Fill the registration form from one of the rep's members, linked to their Zoho contact */
function fillRegFromMember(sel){
  const f = sel.form.elements, m = S.members.find(x => x.id === sel.value);
  const warn = document.getElementById('regAlready');
  const already = m && eventRegs(sel.dataset.event).find(r => r.attending !== 'Cancelled' && regKey(r.name) === regKey(m.name));
  if(warn){ warn.hidden = !already; warn.innerHTML = already ? `⚠ <strong>${esc(m.name)}</strong> is already registered for this event${already.registered ? ' (' + fmt(String(already.registered).slice(0,10)) + ')' : ''}. There's no need to register them again.` : ''; }
  f.namedItem('contactId').value = m ? m.id : '';
  if(!m) return;
  const name = String(m.name || '').replace(/\s*#\s*\d+\s*$/, '').trim().split(/\s+/);
  f.namedItem('firstName').value = name.slice(0, -1).join(' ') || name[0] || '';
  f.namedItem('lastName').value = name.length > 1 ? name[name.length - 1] : '';
  f.namedItem('business').value = m.business && m.business !== '—' ? m.business : '';
  f.namedItem('phone').value = m.phone || m.mobile || '';
  f.namedItem('email').value = m.email || '';
  const parts = String(m.address || '').split(',').map(x => x.trim());
  if(parts.length >= 3){ f.namedItem('city').value = parts[parts.length - 2] || ''; f.namedItem('state').value = (parts[parts.length - 1] || '').split(' ')[0]; }
  f.namedItem('registrantType').value = 'Member';
}
function toggleGuestFields(on){
  const el = document.getElementById('guestFields');
  if(el) el.style.display = on ? 'block' : 'none';
}
async function submitRegistration(ev, eventId){
  ev.preventDefault();
  const f=ev.target.elements, err=document.getElementById('regErr');
  const g = f.namedItem('bringingGuest').checked;
  const confirmDuplicate = ev.target.dataset.confirmDup === '1';
  try{
    await API.askRegistration({
      confirmDuplicate,
      eventId, contactId: f.namedItem('contactId') ? f.namedItem('contactId').value || undefined : undefined,
      firstName:f.namedItem('firstName').value,
      lastName:f.namedItem('lastName').value,
      name:`${f.namedItem('firstName').value} ${f.namedItem('lastName').value}`.trim(),
      business:f.namedItem('business').value,
      phone:f.namedItem('phone').value,
      email:f.namedItem('email').value,
      city:f.namedItem('city').value,
      state:f.namedItem('state').value,
      registrantType:f.namedItem('registrantType').value,
      bringingGuest:g,
      guestFirstName:g?f.namedItem('guestFirstName').value:undefined,
      guestLastName:g?f.namedItem('guestLastName').value:undefined,
      guestType:g?f.namedItem('guestType').value:undefined,
      guestBusiness:g?f.namedItem('guestBusiness').value:undefined,
      guestPhone:g?f.namedItem('guestPhone').value:undefined,
      guestEmail:g?f.namedItem('guestEmail').value:undefined,
    });
    closeModal();
    toast('Sent to the office for approval');
    S.pending = await API.pending(); save(); render();
  }catch(e){
    err.style.display='block';
    if(e.data && e.data.duplicate){
      // Already registered or already asked for: say so, and let them decide
      err.innerHTML = `<strong>Looks like a duplicate.</strong> ${esc(e.message)}
        <div class="row-sub" style="margin-top:4px">${e.data.duplicate.map(d => esc((d.name || '') + ' — ' + d.why.join(', '))).join('<br>')}</div>`;
      ev.target.dataset.confirmDup = '1';
      const b = ev.target.querySelector('button[type=submit]'); if(b) b.textContent = 'Send anyway';
    } else err.textContent=e.message||'Could not send that';
  }
}
