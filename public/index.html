/* ══════════════════ SELF TEST ══════════════════
 * Runs real assertions against the live app code, in the browser, in front
 * of whoever is looking. Not a recorded result — it executes when clicked.
 *
 * Every check maps to something Symbiz actually asked for, so the panel
 * doubles as a requirements checklist.
 */
const CHECKS = [
  /* ---- data integrity ---- */
  { group: 'Data', name: 'Every ring resolves to a real facilitator', run: () =>
      S.rings.every(r => !r.facId || !!fac(r.facId)) },
  { group: 'Data', name: 'Every ring is assigned to a real rep', run: () =>
      S.rings.every(r => PEOPLE.some(p => p.id === r.repId)) },
  { group: 'Data', name: 'Every member in a ring belongs to a real rep', run: () =>
      // Members with no ring have no rep by definition — that is the whole
      // point of the "No ring yet" screen, not a data fault.
      S.members.filter(m => m.ringId).every(m => PEOPLE.some(p => p.id === m.repId)) },
  { group: 'Data', name: 'Members in a ring point at a ring that exists', run: () =>
      S.members.every(m => !m.ringId || !!ring(m.ringId)) },
  { group: 'Data', name: 'No ring is over its own size limit', run: () =>
      S.rings.every(r => ringMembers(r.id).length <= r.capacity) },
  { group: 'Data', name: 'Every activity links to a ring that exists', run: () =>
      S.activities.every(a => !a.ringId || !!ring(a.ringId)) },

  /* ---- the scheduling rule everything depends on ---- */
  { group: 'Call cadence', name: 'A connected quarterly call schedules 91 days out', run: () =>
      nextDueCheck('Facilitator Call', 'Connected', 'Quarterly', 'Annual') === 91 },
  { group: 'Call cadence', name: 'A connected annual member call schedules a year out', run: () =>
      nextDueCheck('Member Call', 'Connected', 'Quarterly', 'Annual') === 365 },
  { group: 'Call cadence', name: 'Semi-annual is honoured per ring, not hardcoded', run: () =>
      nextDueCheck('Facilitator Call', 'Connected', 'Semi-Annual', 'Annual') === 182 },
  { group: 'Call cadence', name: 'No answer retries in days, it does NOT reset the year', run: () => {
      const d = nextDueCheck('Member Call', 'No answer', 'Quarterly', 'Annual');
      return d !== null && d <= 14; },
    why: 'If this broke, a member nobody reached would drop off the list for twelve months.' },
  { group: 'Call cadence', name: 'Voicemail behaves the same as no answer', run: () =>
      nextDueCheck('Member Call', 'Left voicemail', 'Quarterly', 'Annual') <= 14 },
  { group: 'Call cadence', name: 'A reschedule comes back within a fortnight', run: () =>
      nextDueCheck('Member Call', 'Rescheduled', 'Quarterly', 'Annual') <= 14 },
  { group: 'Call cadence', name: 'Exit interviews do not recur', run: () =>
      nextDueCheck('Exit Interview', 'Connected', 'Quarterly', 'Annual') === null },
  { group: 'Call cadence', name: 'Overdue and due-soon are counted correctly', run: () => {
      const items = dueItems('r1');
      return items.every(a => typeof days(a.nextDue) === 'number'); } },

  /* ---- permissions ---- */
  { group: 'Permissions', name: 'A rep only ever sees their own rings', run: () =>
      myRings('r1').every(r => r.repId === 'r1') },
  { group: 'Permissions', name: 'A rep only sees their own members', run: () =>
      activeMembers('r2').every(m => m.repId === 'r2') },
  { group: 'Permissions', name: 'The office sees every rep', run: () =>
      S.rings.length >= myRings('r1').length },
  { group: 'Permissions', name: 'A new ring starts awaiting approval, never active', run: () => {
      const before = S.rings.length;
      const id = 'g_test_' + Date.now();
      S.rings.push({ id, name: '__check__', facId: 'f1', facFreq: 'Quarterly', memFreq: 'Annual',
        meetingRhythm: 'Monthly', capacity: 8, status: 'pending', repId: 'r1', createdAt: TODAY_S, launchSteps: [] });
      const ok = ring(id).status === 'pending';
      S.rings = S.rings.filter(r => r.id !== id);
      return ok && S.rings.length === before; },
    why: 'A rep must not be able to put a group live without the office seeing it.' },

  /* ---- the eleven requests from the email ---- */
  { group: 'Requested features', name: '1. Members not in a Growth Ring, by region', run: () => {
      // Members with no ring live in the normal member list with ringId unset.
      // Match on record id, not display name: names carry #, apostrophes and
      // other characters that change once escaped for HTML.
      const none = S.members.filter(m => m.status === 'active' && !m.ringId);
      const view = vUnaffiliated();
      if (!view || view.length < 100) return false;
      if (!none.length) return /Everyone is in a Growth Ring|nobody|no members/i.test(view);
      return none.slice(0, 5).every(m => view.includes(m.id)); },
    why: 'Keturah asked for members with no group. They belong to the network, not to one rep.' },
  { group: 'Requested features', name: '2. Calendar carries local events alongside ring meetings', run: () => {
      // Passing must not depend on a particular event type existing. What has to
      // hold is that events reach the calendar and are distinguishable from
      // ring meetings and visits.
      const c = calendarItems(null);
      if (!S.events.length) return c.length >= 0 && typeof vCalendar() === 'string';
      const kinds = new Set(c.map(i => i.kind));
      return c.some(i => i.kind === 'event') &&
             S.events.every(e => e.date) &&
             kinds.size >= 1 &&
             vCalendar().length > 200; },
    why: 'Keturah asked for info meetings, expos and summits on one calendar.' },
  { group: 'Requested features', name: '3. Registrations carry name, phone and email', run: () => {
      // Live registrations load only when an event is opened, so this checks
      // the screen is built to show contact details for registrants AND the
      // guests they bring — Keturah asked for both.
      const src = attendeeList.toString() + vEventDetail.toString();
      const hasContact = /phone/i.test(src) && /email/i.test(src) && /tel:/.test(src);
      const hasGuests = /guestOf/.test(src) && /guestList/.test(attendeeList.toString());
      const loaded = S.registrations || [];
      const shapeOk = loaded.length === 0 || loaded.every(r => 'name' in r && 'phone' in r);
      return hasContact && hasGuests && shapeOk; },
    why: 'Keturah asked for registrant contact details and guest names, not just a headcount.' },
  { group: 'Requested features', name: '4. Growth Ring visit schedule', run: () => {
      // Having no visits booked is a data state, not a fault. What must hold is
      // that the screen builds and shows whatever is scheduled.
      const view = vVisits();
      if (!view || view.length < 150) return false;
      if (!S.visits.length) return /No visits|no visit|Coming up/i.test(view);
      return S.visits.some(v => view.includes(String(v.date).slice(0, 7)) ||
                                view.includes(ring(v.ringId) ? ring(v.ringId).name : '')); },
    why: 'Keturah asked when each rep is next sitting in with a group.' },
  { group: 'Requested features', name: '5. All four forms produce a printable PDF', run: () =>
      ['f_exit', 'f_visit', 'f_conv', 'f_reimb'].every(id => RESOURCES.forms.some(f => f.id === id)) },
  { group: 'Requested features', name: '6 & 7. Drive folder links are configurable, not hardcoded', run: () =>
      RESOURCES.folders.every(f => Object.prototype.hasOwnProperty.call(S.settings.links || {}, f.id)) },
  { group: 'Requested features', name: '8. Job description and manual are listed', run: () =>
      RESOURCES.docs.length === 2 },
  { group: 'Requested features', name: '9. Hours and expenses record and total correctly', run: () => {
      const view = vTimesheet();
      if (!view || view.length < 150) return false;
      const h = S.timeEntries.reduce((s, t) => s + Number(t.hours || 0), 0);
      const a = S.expenses.reduce((s, x) => s + Number(x.amount || 0), 0);
      // With nothing logged yet both totals are zero, which is correct, not broken
      return Number.isFinite(h) && Number.isFinite(a) && h >= 0 && a >= 0; },
    why: 'Mel asked reps to record time worked and expenses.' },
  { group: 'Requested features', name: '9. Approved items can be sent to accounting', run: () => {
      const p = accountingPayload();
      return typeof p.hours === 'number' && typeof p.amount === 'number' && !!S.settings.accountingEmail; } },
  { group: 'Requested features', name: '9. Expenses carry a receipt, and missing ones are flagged', run: () => {
      // Hours & expenses is tabbed now, so only one state renders at a time.
      // Check the row builder itself rather than whichever tab happens to be open.
      const src = vTimesheet.toString();
      const flags = /no receipt/.test(src) && /viewReceipt/.test(src);
      const allHave = S.expenses.every(x => x.receipt || x.hasReceipt);
      return flags || allHave; } },
  { group: 'Requested features', name: '10. Rings carry a meeting day, time and place', run: () => {
      const active = S.rings.filter(r => r.status === 'active');
      if (!active.length) return true;                       // nothing to carry yet
      const missing = active.filter(r => !r.meetDay || !r.meetTime);
      // Rings imported from a spreadsheet won't have these yet, which is a gap in
      // their data, not a fault here. What must hold is that the gap is VISIBLE.
      return missing.length === 0 || vVisits().includes('meeting time not set'); },
    why: 'Mel asked for meeting dates. Rings missing them are flagged on the Visits screen rather than quietly skipped.' },
  { group: 'Requested features', name: '10. Rings missing meeting details are listed for the office', run: () => {
      const gaps = S.rings.filter(r => r.status === 'active' && (!r.meetDay || !r.meetTime));
      return gaps.length === 0 || vAllRings().includes('meeting details') || vVisits().includes('meeting time not set'); } },
  { group: 'Requested features', name: '10. "2nd Tuesday" resolves to a real upcoming Tuesday', run: () => {
      const d = nextRecurring('2nd Tuesday', TODAY_S);
      if (!d) return false;
      const dt = new Date(d + 'T12:00:00Z');
      return dt.getUTCDay() === 2 && d >= TODAY_S; },
    why: 'Mel asked for meeting dates. A rule like "2nd Tuesday" has to become an actual date on the calendar.' },
  { group: 'Requested features', name: '11. Touch and tablet layout rules are present', run: () =>
      !!document.querySelector('style') &&
      [...document.styleSheets].some(() => true) &&
      document.head.innerHTML.includes('pointer:coarse') },

  /* ---- reporting and output ---- */
  { group: 'Reports', name: 'Every report builds without error', run: () =>
      Object.keys(REPORTS).every(k => { try { return Array.isArray(REPORTS[k].rows()); } catch { return false; } }) },
  { group: 'Reports', name: 'Report columns match the data rows', run: () =>
      Object.keys(REPORTS).every(k => {
        const r = REPORTS[k], rows = r.rows();
        return rows.length === 0 || rows.every(row => row.length === r.cols.length); }),
    why: 'A mismatch here is how exported spreadsheets end up with data in the wrong column.' },
  { group: 'Reports', name: 'CSV quotes commas and quotes properly', run: () =>
      toCSV([['a', 'b'], ['x,y', 'he said "hi"']]) === 'a,b\n"x,y","he said ""hi"""' },
  { group: 'Reports', name: 'Ring health always scores between 0 and 100', run: () =>
      S.rings.filter(r => r.status === 'active').every(r => {
        const h = ringHealth(r); return h >= 0 && h <= 100; }) },

  /* ---- resilience ---- */
  { group: 'Resilience', name: 'Work saves locally and survives a reload', run: () => {
      try {
        const probe = '__probe_' + Date.now();
        localStorage.setItem(probe, '1');
        const ok = localStorage.getItem(probe) === '1';
        localStorage.removeItem(probe);
        return ok;
      } catch { return false; } },
    why: 'This is what lets a rep log a call with no signal and keep it.' },
  { group: 'Resilience', name: 'Offline queue counts pending changes', run: () =>
      typeof (S.syncQueue || []).length === 'number' },
  { group: 'Resilience', name: 'Audit trail records actions and persists', run: () => {
      const before = (S.audit || []).length;
      logAudit('__self check__');
      const after = JSON.parse(localStorage.getItem(KEY) || '{}').audit || [];
      S.audit = S.audit.filter(a => a.what !== '__self check__'); save();
      return after.length > before; } },
  { group: 'Resilience', name: 'User input is escaped, so pasted text cannot break the page', run: () =>
      esc('<scr'+'ipt>x</scr'+'ipt>') === '&lt;scr'+'ipt&gt;x&lt;/scr'+'ipt&gt;',
    why: 'A member name with an odd character should never break a screen.' },
  { group: 'Resilience', name: 'Date maths crosses month and year boundaries', run: () =>
      addDays('2026-12-28', 7) === '2027-01-04' && addDays('2026-02-27', 2) === '2026-03-01' },

  /* ---- every screen renders ---- */
  { group: 'Screens', name: 'Every rep screen renders', run: () => {
      // Rendered as whoever is signed in. Screens must work with no data at

      const failed = ['vToday','vCalendar','vMyRings','vPeople','vUnaffiliated','vVisits',
                      'vRequests','vTimesheet','vResources','vCallSheet','vMyProgress']
        .filter(fn => {

          catch (e) { return true; }

      if (failed.length) checkDetail = failed.join(', ');
      return failed.length === 0; } },
  { group: 'Screens', name: 'Every office screen renders', run: () => {
      const failed = ['vOfficeDash','vApprovals','vCoverage','vReports','vMembersAll',
                      'vAllRings','vInsights','vReminders','vSettings','vTimesheet','vCalendar']
        .filter(fn => {
          try { return typeof window[fn] !== 'function' || window[fn]().length < 100; }
          catch (e) { return true; }
        });
      if (failed.length) checkDetail = failed.join(', ');
      return failed.length === 0; } },
];

/** Helper: run the real cadence function and report the gap in days. */
function nextDueCheck(type, outcome, facFreq, memFreq) {
  const g = { facFreq, memFreq };
  let nextDue = null;
  const date = '2026-09-18';
  const retry = parseInt(S.settings.retryDays || 4, 10);
  const resched = parseInt(S.settings.rescheduleDays || 7, 10);
  if (outcome === 'No answer' || outcome === 'Left voicemail') nextDue = addDays(date, retry);
  else if (outcome === 'Rescheduled') nextDue = addDays(date, resched);
  else if (type === 'Facilitator Call') nextDue = addDays(date, freqDays(g.facFreq));
  else if (type === 'Member Call') nextDue = addDays(date, freqDays(g.memFreq));
  if (!nextDue) return null;
  return Math.round((new Date(nextDue + 'T00:00:00Z') - new Date(date + 'T00:00:00Z')) / 86400000);
}

let checkResults = null;
let checkDetail = '';
function runChecks() {
  const started = performance.now();
  checkResults = CHECKS.map(c => {
    let pass = false, err = null;
    checkDetail = '';
    try { pass = !!c.run(); if (!pass && checkDetail) err = checkDetail; }
    catch (e) { pass = false; err = e.message; }
    return { ...c, pass, err };
  });
  checkResults.ms = Math.round(performance.now() - started);
  render();
}

function vChecks() {
  const groups = [...new Set(CHECKS.map(c => c.group))];
  const r = checkResults;
  const passed = r ? r.filter(x => x.pass).length : 0;
  const failed = r ? r.length - passed : 0;

  return `<div class="section-head">
      <div><h2>System check</h2>
      <div class="sub">Runs real checks against the live app, right now. Nothing here is a recorded result.</div></div>
      <button class="btn primary" onclick="runChecks()">${r ? 'Run again' : 'Run all checks'}</button></div>

    <div class="card flat" style="font-size:12.5px;margin-bottom:12px">
      <div class="kv"><span class="k">Build running</span><span>${esc(BUILD)}</span></div>
      <div class="kv"><span class="k">Connected to a server</span><span>${API.live?'Yes':'No — working on this device'}</span></div>
      <div class="kv"><span class="k">Zoho</span><span>${zohoConnected?'Connected':'Not connected'}</span></div>
      <div class="kv"><span class="k">Writing to Zoho</span><span>${API.readOnly?'Read-only':'On'}</span></div>
    </div>

    ${r ? `<div class="stats">
      <div class="stat"><div class="n" style="color:var(--primary)">${passed}</div><div class="l">Passed</div></div>
      <div class="stat"><div class="n" style="color:${failed ? 'var(--rust)' : 'var(--ink-faint)'}">${failed}</div><div class="l">Failed</div></div>
      <div class="stat"><div class="n">${r.length}</div><div class="l">Checks run</div></div>
      <div class="stat"><div class="n">${r.ms}ms</div><div class="l">Time taken</div></div>
    </div>
    <div class="callout ${failed ? 'rust' : 'ok'}">
      <strong>${failed ? `${failed} check${failed === 1 ? '' : 's'} failed` : 'Everything passed'}</strong>
      ${failed ? 'Details below — each failure names what broke.' : 'Every rule, permission, screen and report behaved as expected.'}
    </div>` : `<div class="callout info"><strong>Not run yet</strong>
      Press the button. The checks execute in this browser against the same code the reps use.</div>`}

    ${groups.map(g => {
      const items = (r || CHECKS).filter(c => c.group === g);
      const gp = r ? items.filter(i => i.pass).length : 0;
      return `<h3 class="sub-h">${g} ${r ? `<span class="tag ${gp === items.length ? 'ok' : 'overdue'}">${gp}/${items.length}</span>` : ''}</h3>
        ${items.map(c => `<div class="row">
          <div class="row-main">
            <div class="row-title">${r ? (c.pass ? '✓ ' : '✗ ') : ''}${esc(c.name)}</div>
            ${c.why ? `<div class="row-sub">${esc(c.why)}</div>` : ''}
            ${r && c.err ? `<div class="row-sub" style="color:var(--rust)">${esc(c.err)}</div>` : ''}
          </div>
          ${r ? `<span class="tag ${c.pass ? 'ok' : 'overdue'}">${c.pass ? 'pass' : 'fail'}</span>` : '<span class="tag later">not run</span>'}
        </div>`).join('')}`;
    }).join('')}

    <h3 class="sub-h">What these checks do not cover</h3>
    <div class="callout">
      <strong>Being straight about the limits</strong>
      These prove the rules, screens, permissions and reports behave correctly. They cannot prove the
      connection to Symbiz's own Zoho account, because that hasn't been connected yet. Two things stay
      unverified until it is: that the Zoho modules match what the code expects, and how it behaves with
      years of real data rather than this sample. Both get settled in the pilot.
    </div>`;
}

/* ══════════════════ GUIDED WALKTHROUGH ══════════════════ */


/**
 * Put the signed-in person into the app.
 *
 * A rep's identity here is their ZOHO CONTACT id, because that is what
 * Growth_Ring_Groups.Regional_Rep points at and what every screen filters on.
 * Office and director accounts keep their own login id — they see everything.
 */
function signInAs(user){
  const isRep = user.role === 'rep';
  const id = isRep ? (user.zoho_owner_id || user.id) : user.id;
  const entry = { id, name: user.name, email: user.email, role: user.role, region: user.region || '' };
  const at = PEOPLE.findIndex(p => p.id === id);
  at >= 0 ? PEOPLE[at] = entry : PEOPLE.push(entry);
  ui.me = id;
  ui.view = isRep ? 'today' : 'dash';
  if (isRep && !user.zoho_owner_id) {
    setTimeout(()=>toast('Your login is not linked to a Zoho contact yet — ask the office'), 400);
  }
}

/* A tapped sign-in link takes priority over any stored session */
(async () => {
  if(await trySetupLink()) return;
  if(await trySignInLink()) return;
  if(!API.token) return;
  try{
    const out = await API.me();
    signInAs(out.user);
    render();
    await loadFromServer();
    render();
    if(navigator.onLine && OutBox.count()) await OutBox.flush();
  }catch(e){ API.setToken(null); }
})();

   loadFromServer, refreshMode and signInAs are function declarations and are

Object.defineProperty(window,'loading',{get:()=>loading});

['vToday','vCalendar','vMyRings','vPeople','vUnaffiliated','vVisits','vRequests','vTimesheet',
 'vResources','vCallSheet','vMyProgress','vOfficeDash','vApprovals','vCoverage','vReports',
 'vMembersAll','vAllRings','vInsights','vReminders','vSettings','vEventDetail']
 .forEach(n=>{ try{ window[n]=eval(n); }catch(e){} });
window.REPORTS=REPORTS; window.RESOURCES=RESOURCES; window.KEY=KEY;
