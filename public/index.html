/**
 * Keeping the page still while it redraws.
 *
 * Every change rebuilds the screen's HTML. Without care that drops the scroll
 * position, so the page jumped up and down whenever data arrived or a filter
 * was tapped. Redraws keep the reader exactly where they were; only going to
 * a different screen starts at the top.
 */
var scrollTopNext = false;   // var, not let: render() may run before this line does
// Where the reader was on each screen, so coming back (say, Back from a
// member to the People list) returns them to the same spot instead of
// throwing them to the top.
var placeByScreen = {};
function screenKey(){ return [ui.view, ui.ringId, ui.memberId, ui.facId, ui.eventId, ui.view === 'repAccount' ? ui.repAcct : ''].join('|'); }
function goingTo(){
  if (ui && ui.me) placeByScreen[screenKey()] = window.scrollY;
  // Remember where we were, so "Back" on a detail screen returns there (the
  // map, the calendar, a ring) rather than to a fixed list
  if (ui && ui.me && ui.view) {
    ui.trail = (ui.trail || []).slice(-11);
    ui.trail.push({ view: ui.view, ringId: ui.ringId, memberId: ui.memberId, facId: ui.facId, eventId: ui.eventId, summitId: ui.summitId, repAcct: ui.repAcct });
  }
  scrollTopNext = true;
  // Attendee lists start closed again on every screen you come to
  if (ui) ui.calLists = {};
}
function keepPlace(draw){
  const y = window.scrollY;
  const rail = document.querySelector('.rail');
  const railY = rail ? rail.scrollTop : 0;
  draw();
  if (scrollTopNext) {
    scrollTopNext = false;
    const back = placeByScreen[screenKey()] || 0;    // a screen not seen before opens at the top
    if (window.scrollY !== back) window.scrollTo(0, back);
  }
  else if (window.scrollY !== y) window.scrollTo(0, y);
  const rail2 = document.querySelector('.rail');
  if (rail2 && rail2.scrollTop !== railY) rail2.scrollTop = railY;
}

function renderContent(){
  const el=document.getElementById('content'); if(!el) return;
  keepPlace(() => renderContentSafe(el));

var renderRetry = null;
function renderContentSafe(el){
  const prev = el.dataset.view;
  el.dataset.view = ui.view;     // lets wide screens (the map) use the full width
  // Already on the map: a background update refreshes the pins and list in
  // place. Redrawing the screen used to throw the map away mid-pan.
  if(prev === 'map' && ui.view === 'map' && document.getElementById('mapSlot') && mapData && !mapData.error){
    drawMemberMap(false); return;
  }
  // Was showing the grey "loading" rows: when the real screen replaces them, ease it in
  const wasLoading = prev === ui.view && !!el.querySelector('.skel');
  try { renderContentInner(el); renderRetry = null; animateCounts(el);
    if(wasLoading && !el.querySelector('.skel')){ el.classList.remove('v-enter'); void el.offsetWidth; el.classList.add('v-enter'); } }
  catch(e){
    console.error('[render]', e);
    // A hiccup while data is still arriving should not flash an error
    // screen: keep what is showing and try once more on the next frame.
    const key = screenKey();
    if(renderRetry !== key){
      renderRetry = key;
      requestAnimationFrame(() => { if(screenKey() === key) renderContent(); });
      if(!el.innerHTML.trim()) el.innerHTML = skeleton(5);
      return;
    }
    renderRetry = null;
    // Never leave a blank screen. Say what happened and offer a way out.
    el.innerHTML = `<div class="section-head"><div><h2>This screen could not load</h2>
      <div class="sub">Something in the saved data on this device didn't match what the app expected.</div></div></div>
      <div class="callout rust"><strong>${esc(e.message||'Unknown error')}</strong>
        Your other screens should still work. If this keeps happening, resetting the data on this device usually clears it.</div>
      <div class="btnrow">
        <button class="btn" onclick="setView(isRep()?'today':'dash')">Go to the home screen</button>
        <button class="btn danger" onclick="resetDemo()">Reset data on this device</button>
      </div>`;
  }
}

  const newScreen = scrollTopNext;
  fillShell();
  renderContent();
  if(newScreen){
    const el = document.getElementById('content');
    if(el){ el.classList.remove('v-enter'); void el.offsetWidth; el.classList.add('v-enter'); }
  }
}

/* Opening or refreshing the app: if someone was signed in on this device,
   show their app at once, on the screen they were on, while the server

(function resumeSession(){
  if(!API.token || ui.me) return;
  try{
    const u = JSON.parse(localStorage.getItem('rephub_user') || 'null');
    if(!u) return;

    signInAs(u);

    // A reload is not a first visit: the numbers don't count up again, and

    countedFor = screenKey();

/* Once the restored screen is tall enough, go back to the remembered place.
   Stops as soon as the person scrolls themselves or opens another screen. */
function restoreReloadScroll(){
  const r = reloadScroll; if(!r) return;
  if(Date.now() > r.until || screenKey() !== r.key){ reloadScroll = null; return; }
  if(document.documentElement.scrollHeight - window.innerHeight >= r.y - 4){ window.scrollTo(0, r.y); reloadScroll = null; }
}

/* ══════════════════ NEW: helpers for calendar + money ══════════════════ */
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const money = n => '$' + Number(n || 0).toFixed(2);

/**
 * Events on a rep's calendar.
 * Live events mostly carry no Regional Rep — summits and info meetings are
 * network-wide — so a rep sees all of them. Filtering by rep would leave the
 * calendar empty, which is worse than showing one event too many.
 */
/**
 * Events for a rep's calendar.
 * Most Symbiz events carry no Regional Rep — summits and info meetings are
 * network-wide and every rep should see them. Those with a rep set are shown
 * only to that rep, which is what makes filtering by rep meaningful.
 */
/**
 * Events for one rep. Events carrying no Regional Rep are network-wide
 * (summits, info meetings) and show for everyone; the rest filter properly.
 * Previously this returned everything whenever the app was live, which made
 * the rep picker do nothing at all.
 */
/**
 * Events for one rep. Events with no Regional Rep in Zoho are network-wide
 * and show for everyone unless the office asks for only that rep's.
 */
const myEvents = id => S.events.filter(e => !id || !e.repId || e.repId === id);
const myVisits = id => S.visits.filter(v => !id || v.repId === id);
const eventRegs = eid => S.registrations.filter(r => r.eventId === eid);
const myTime = id => S.timeEntries.filter(t => t.repId === id);
const myExpenses = id => S.expenses.filter(x => x.repId === id);

/** Next calendar date for a "2nd Tuesday" style rule, so recurring ring meetings show on the calendar. */
function nextRecurring(meetDay, fromISO) {
  if (!meetDay) return null;
  const ord = { '1st': 0, '2nd': 1, '3rd': 2, '4th': 3, 'Last': 4 };
  const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const parts = String(meetDay).split(' ');
  if (parts.length < 2) return null;
  const nth = ord[parts[0]], dow = dayNames.indexOf(parts[1]);
  if (nth === undefined || dow < 0) return null;

  const from = new Date((fromISO || TODAY_S) + 'T00:00:00Z');
  for (let add = 0; add < 3; add++) {            // look up to three months ahead
    const y = from.getUTCFullYear(), m = from.getUTCMonth() + add;
    const first = new Date(Date.UTC(y, m, 1));
    let day = 1 + ((dow - first.getUTCDay() + 7) % 7) + nth * 7;
    const probe = new Date(Date.UTC(y, m, day));
    if (probe.getUTCMonth() !== ((m % 12) + 12) % 12) continue;   // e.g. no 5th Tuesday
    const iso = probe.toISOString().slice(0, 10);
    if (iso >= (fromISO || TODAY_S)) return iso;
  }
  return null;
}

/**
 * Every date a "2nd Tuesday" / "Last Thursday" rule falls on between two
 * days. Monthly groups appear in every month you look at, not just once.
 */
function recurringBetween(meetDay, fromISO, toISO) {
  if (!meetDay) return [];
  const parts = String(meetDay).split(' ');
  const ord = { '1st': 0, '2nd': 1, '3rd': 2, '4th': 3, 'Last': -1 }[parts[0]];
  const dow = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'].indexOf(parts[1]);
  if (ord === undefined || dow < 0) return [];
  const out = [];
  const start = new Date(fromISO + 'T00:00:00Z');
  for (let m = 0; m < 14; m++) {
    const y = start.getUTCFullYear(), mo = start.getUTCMonth() + m;
    let day;
    if (ord === -1) {
      const last = new Date(Date.UTC(y, mo + 1, 0));
      day = last.getUTCDate() - ((last.getUTCDay() - dow + 7) % 7);
    } else {
      const first = new Date(Date.UTC(y, mo, 1));
      day = 1 + ((dow - first.getUTCDay() + 7) % 7) + ord * 7;
    }
    const d = new Date(Date.UTC(y, mo, day));
    if (d.getUTCMonth() !== ((mo % 12) + 12) % 12) continue;
    const iso = d.toISOString().slice(0, 10);
    if (iso > toISO) break;
    if (iso >= fromISO) out.push(iso);
  }
  return out;
}

/**
 * One merged stream: local events, scheduled ring visits, and group meetings.
 * With a range, a ring that meets monthly appears on each meeting day in it;
 * without one, just its next meeting (what the home screen wants).
 */
function calendarItems(repId, range) {
  const out = [];
  const mine = r => !repId || r.repId === repId;
  myEvents(repId).forEach(e => out.push({
    kind: 'event', date: e.date, time: e.time, title: e.title, repId: e.repId || null,
    sub: e.type, where: e.location, id: e.id, regs: e.registrationCount || eventRegs(e.id).length,
    go: `openEvent('${e.id}')`
  }));
  myVisits(repId).filter(v => v.status === 'Scheduled').forEach(v => {
    const g = ring(v.ringId);
    out.push({ kind: 'visit', date: v.date, time: v.time, title: `Visit — ${g ? g.name : ''}`,
               sub: '', where: v.location, id: v.id, repId: v.repId || (g ? g.repId : null), ringId: v.ringId,
               go: g ? `openRing('${g.id}')` : '' });
  });
  // Meetings a rep has actually recorded. These were being saved and then
  // never shown, so the calendar looked empty even after logging one.
  // Ring meetings from Zoho's GR Meetings: held, planned or cancelled. The same
  // meeting is sometimes entered twice there, so each shows once.
  const seenMtg = new Set();
  (S.meetings || []).forEach(mt => {
    const g = ring(mt.ringId);
    if(!g || !mine(g)) return;
    const key = mt.ringId + '|' + mt.date + '|' + (mt.time || '');
    if(seenMtg.has(key)) return;
    seenMtg.add(key);
    const attended = Array.isArray(mt.attended) ? mt.attended.length : (mt.attended || 0);
    const absent = Array.isArray(mt.absent) ? mt.absent.length : (mt.absent || 0);
    const held = mt.status === 'held', cancelled = mt.status === 'cancelled';
    out.push({
      kind: 'meeting', date: mt.date, time: mt.time || '',
      title: cancelled ? `${g.name} — cancelled` : held ? `${g.name} met` : `${g.name} meets`,
      repId: g.repId, ringId: g.id, id: mt.id, held: held || cancelled, cancelled,
      sub: held && (attended || absent) ? `${attended} there${absent?`, ${absent} away`:''}`
        : [g.facName ? 'Facilitator ' + g.facName : '', mt.link ? 'online' : '',
           /host/i.test(mt.place || '') ? mt.place : ''].filter(Boolean).join(' · '),
      // A town opens in Maps; "at the host's home" is just words
      where: /host/i.test(mt.place || '') ? '' : mt.place,
      go: `openRing('${g.id}')`,
    });
  });

  S.rings.filter(r => r.status === 'active' && mine(r) && r.meetDay).forEach(r => {
    // A "2nd Tuesday" rule is a monthly rhythm; other rhythms only know the next date
    const monthly = !r.meetingRhythm || /monthly/i.test(r.meetingRhythm);
    const dates = range && monthly
      ? recurringBetween(r.meetDay, range.from, range.to)
      : [nextRecurring(r.meetDay)].filter(Boolean);
    dates.forEach(d => {
      // Already in Zoho for that day (held, planned or cancelled): show that, not a guess
      if ((S.meetings || []).some(mt => mt.ringId === r.id && mt.date === d)) return;
      out.push({
        kind: 'meeting', date: d, time: r.meetTime, repId: r.repId, ringId: r.id,
        title: `${r.name} meets`, sub: `${r.meetingRhythm || ''} · ${r.meetPlace || 'place to be set'}`.replace(/^ · /,''),
        id: r.id + ':' + d, go: `openRing('${r.id}')`
      });
    });
  });
  return out.sort((a, b) => a.date.localeCompare(b.date) || String(a.time).localeCompare(String(b.time)));
}

/**
 * Month grid. The list was fine for "what's next" but useless for planning —
 * you could not see that two summits fell in the same week. Grid by default,
 * list still a tap away.
 */
function vCalendar() {
  const repId = isRep() ? ui.me : (ui.calRep || null);
  if(!ui.calMonth){
    const t = new Date();
    ui.calMonth = `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}`;
  }
  // Reps on a phone get the agenda first: a month grid that small is all dots
  if(!ui.calView) ui.calView = (isRep() && window.innerWidth < 700) ? 'agenda' : 'month';
  const monthStart = ui.calMonth + '-01';
  const monthEnd = (() => { const [y,m] = ui.calMonth.split('-').map(Number);
    return new Date(Date.UTC(y, m, 0)).toISOString().slice(0,10); })();
  const agendaEnd = addDays(TODAY_S, 30);
  const range = { from: monthStart < TODAY_S ? monthStart : TODAY_S, to: monthEnd > agendaEnd ? monthEnd : agendaEnd };
  let items = calendarItems(repId, range).filter(i => !ui.calFilter || ui.calFilter === 'all' || i.kind === ui.calFilter);

  /**
   * Picking a rep used to look like it did nothing. Most events carry no
   * Regional Rep in Zoho — they are network-wide — so they showed for
   * everybody either way. Now you can hide them and see only what belongs
   * to that rep, and the count says plainly what is being hidden.
   */
  let networkHidden = 0;
  if(repId && ui.calOnlyTheirs){
    const before = items.length;
    items = items.filter(i => i.repId === repId);
    networkHidden = before - items.length;
  } else if(repId){
    networkHidden = items.filter(i => i.kind === 'event' && !i.repId).length;
  }

  const [yy, mm] = ui.calMonth.split('-').map(Number);
  const first = new Date(Date.UTC(yy, mm-1, 1));
  const daysInMonth = new Date(Date.UTC(yy, mm, 0)).getUTCDate();
  const startDow = first.getUTCDay();                 // 0 = Sunday
  const monthName = first.toLocaleDateString('en-US', { month:'long', year:'numeric', timeZone:'UTC' });

  const byDay = {};
  items.forEach(i => { (byDay[i.date] = byDay[i.date] || []).push(i); });

  const shiftMonth = n => {
    const d = new Date(Date.UTC(yy, mm-1+n, 1));
    return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}`;
  };
  const dot = k => k==='event' ? 'var(--rust)' : k==='visit' ? 'var(--info)' : 'var(--primary)';
  const todayIso = TODAY_S;

  const cells = [];
  for(let i=0;i<startDow;i++) cells.push('<div class="cal-cell cal-out"></div>');
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${yy}-${String(mm).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const list = byDay[iso] || [];
    const isToday = iso === todayIso;
    cells.push(`<div class="cal-cell${isToday?' cal-today':''}${list.length?' cal-has':''}${ui.calDay===iso?' cal-open':''}"
      onclick="ui.calDay=(ui.calDay==='${iso}'?null:'${iso}');renderContent()">
      <div class="cal-top">
        ${isOffice()&&API.live?`<button class="cal-add" title="Add an event on this day"
          onclick="event.stopPropagation();openEventForm(null,'${iso}')">+</button>`:''}
        <div class="cal-num">${d}</div>
      </div>
      ${list.slice(0,3).map(i=>`<div class="cal-chip k-${i.kind}" title="${esc(i.title)}${i.time?' · '+esc(i.time):''}">
        ${i.time?`<span class="cal-time">${esc(String(i.time).replace(':00',''))}</span>`:''}
        <span class="cal-txt">${esc(i.title)}</span></div>`).join('')}
      ${list.length>3?`<div class="cal-more">+${list.length-3} more</div>`:''}
    </div>`);
  }
  while(cells.length % 7) cells.push('<div class="cal-cell cal-out"></div>');

  const dayList = ui.calDay ? (byDay[ui.calDay] || []) : [];
  const agenda = ui.calView === 'agenda';

  /* ── what a rep needs at a glance: the coming week, and rings left unvisited ── */
  const week = items.filter(i => i.date >= TODAY_S && i.date <= addDays(TODAY_S, 7));
  const count = k => week.filter(i => i.kind === k).length;
  const myActiveRings = repId ? S.rings.filter(r => r.status === 'active' && r.repId === repId) : [];
  const booked = new Set((S.visits||[]).filter(v => v.status === 'Scheduled' && v.date >= TODAY_S).map(v => v.ringId));
  const unbooked = myActiveRings.filter(r => !booked.has(r.id));
  const summary = repId ? `<div class="cal-sum">
      <div class="cal-fig"><div class="mgr-n">${week.length}</div><div class="mgr-l">in the next 7 days</div></div>
      <div class="cal-fig"><div class="mgr-n" style="color:var(--rust)">${count('event')}</div><div class="mgr-l">event${count('event')===1?'':'s'}</div></div>
      <div class="cal-fig"><div class="mgr-n" style="color:var(--info)">${count('visit')}</div><div class="mgr-l">visit${count('visit')===1?'':'s'}</div></div>
      <div class="cal-fig"><div class="mgr-n" style="color:var(--primary)">${count('meeting')}</div><div class="mgr-l">group meeting${count('meeting')===1?'':'s'}</div></div>
    </div>
    ${unbooked.length ? `<div class="callout" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <div><strong>${unbooked.length} of ${myActiveRings.length} ring${myActiveRings.length===1?'':'s'} ${unbooked.length===1?'has':'have'} no visit booked</strong>
        ${unbooked.slice(0,3).map(r=>esc(r.name)).join(', ')}${unbooked.length>3?` and ${unbooked.length-3} more`:''}</div>
      ${isRep()?`<button class="btn sm primary" onclick="openVisit('${unbooked[0].id}')">Schedule a visit</button>`:''}</div>` : ''}` : '';

  /* ── agenda: the next 30 days as a list, with the thing to do on each ── */
  const dayLabel = iso => { const n = days(iso);
    return n === 0 ? 'Today' : n === 1 ? 'Tomorrow'
      : new Date(iso + 'T12:00:00').toLocaleDateString('en-US', { weekday:'long', month:'short', day:'numeric' }); };
  const actions = i => {
    if (i.kind === 'event') return `<button class="btn sm" onclick="openEvent('${i.id}')">Details${i.regs?` · ${i.regs} registered`:''}</button>
      <button class="btn sm" onclick="printSignInSheet('${i.id}')">Sign-in sheet</button>`;
    if (i.kind === 'visit') return `${i.repId === ui.me ? `<button class="btn sm primary" onclick="completeVisit('${i.id}')">Mark visited</button>` : ''}
      ${i.ringId ? `<button class="btn sm" onclick="openRing('${i.ringId}')">Open ring</button>` : ''}`;
    if (i.kind === 'meeting' && !i.held) return `${i.repId === ui.me && days(i.date) <= 0 ? `<button class="btn sm primary" onclick="openMeeting('${i.ringId}')">Log this meeting</button>` : ''}
      <button class="btn sm" onclick="openRing('${i.ringId}')">Open ring</button>`;
    return i.go ? `<button class="btn sm" onclick="${i.go}">Open</button>` : '';
  };
  const agendaDays = [...new Set(items.filter(i => i.date >= TODAY_S && i.date <= agendaEnd).map(i => i.date))].sort();
  const agendaHTML = agendaDays.length ? agendaDays.map(d => `
    <div class="ag-day${d===TODAY_S?' ag-today':''}">
      <div class="ag-date">${dayLabel(d)}${days(d)>1?'':` <span class="row-sub">${fmtShort(d)}</span>`}</div>
      ${byDay[d].map(i => `<div class="ag-item k-${i.kind}">
        <div class="ag-time">${i.time ? esc(i.time) : 'All day'}</div>
        <div class="ag-body">
          <div class="row-title">${esc(i.title)}</div>
          ${i.sub || i.where ? `<div class="row-sub">${esc(i.sub||'')}${i.sub && i.where ? ' · ' : ''}${mapLink(i.where)}</div>` : ''}
          <div class="btnrow" style="margin-top:7px">${actions(i)}</div>
        </div></div>`).join('')}
    </div>`).join('')
    : isRep() ? emptyWithAction('Nothing in the next 30 days. A good time to book a ring visit.', 'Schedule a visit', 'openVisit()')
    : `<div class="empty">Nothing in the next 30 days.</div>`;

  return `<div class="section-head"><div><h2>Calendar</h2>
    <div class="sub">Local events, ring visits, and when each of your groups meets.</div></div>
    <div class="btnrow" style="margin:0">
      ${isRep()?`<button class="btn sm primary" onclick="openVisit()">Schedule a visit</button>`:''}
      ${isOffice()?repPicker('calRep', PEOPLE.filter(p=>p.role==='rep'), ui.calRep, 'All reps'):''}</div></div>

    ${summary}

    <div class="chips">${[['all','Everything'],['event','Local events'],['visit','Ring visits'],['meeting','Group meetings']]
      .map(([k,l])=>`<button class="chip ${((ui.calFilter||'all')===k)?'on':''}" onclick="ui.calFilter='${k}';renderContent()">${l}</button>`).join('')}</div>

    <div class="cal-head">
      <div class="seg-toggle" role="tablist">
        <button class="${agenda?'':'on'}" onclick="ui.calView='month';renderContent()">Month</button>
        <button class="${agenda?'on':''}" onclick="ui.calView='agenda';renderContent()">Agenda</button>

    ${repId && networkHidden ? `<div class="callout" style="padding:9px 13px;font-size:12.5px">
      ${ui.calOnlyTheirs
        ? `<strong>${networkHidden} network-wide event${networkHidden===1?'':'s'} hidden</strong>
           Summits and info meetings carry no rep in Zoho, so they are not tied to anyone.
           <button class="btn sm" style="margin-left:8px" onclick="ui.calOnlyTheirs=false;renderContent()">Show them</button>`
        : `<strong>Includes ${networkHidden} network-wide event${networkHidden===1?'':'s'}</strong>
           Summits and info meetings show for every rep because Zoho holds no rep against them.
           <button class="btn sm" style="margin-left:8px" onclick="ui.calOnlyTheirs=true;renderContent()">Only this rep's</button>`}
    </div>` : ''}

    <div class="cal-dow">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div>${d}</div>`).join('')}</div>
    <div class="cal-grid">${cells.join('')}</div>

    <div class="cal-key">
      <span><span class="cal-dot" style="background:var(--rust)"></span>Local event</span>
      <span><span class="cal-dot" style="background:var(--info)"></span>Ring visit</span>
      <span><span class="cal-dot" style="background:var(--primary)"></span>Group meeting</span>
    </div>

    ${ui.calDay ? `<h3 class="sub-h">${fmt(ui.calDay)}</h3>
      ${dayList.length ? dayList.map(i=>{
        return `<div class="card" style="margin-bottom:10px;padding:13px 15px">
          <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">

              ${i.kind==='event'?'Local event':i.kind==='visit'?'Ring visit':'Group meeting'}</span>
          </div>
          ${i.kind==='event' ? attendeeBlock(i.id, i.regs) : `<div class="btnrow" style="margin-top:9px">${actions(i)}</div>`}
        </div>`;
      }).join('')
        : `<div class="empty">Nothing on this day.</div>`}` : ''}
    </div>

    ${!items.length ? emptyState('events and meetings', 'Nothing scheduled yet.') : ''}`;
}

/**
 * Who is coming to one event: the head count straight away, the names
 * behind "See the list". Used on the calendar and the Overview. The list
 * starts closed every time the screen is opened, and has a Hide button at
 * the top as well as the bottom, so a long list can be closed from where
 * you are.
 */
function attendeeBlock(eventId, regCount){
  if(API.live && !regsFresh[eventId] && !regsError[eventId]) loadRegs(eventId);
  const coming = attendeeList(eventId);
  const guests = coming.filter(a=>a.guestOf);
  const open = !!(ui.calLists && ui.calLists[eventId]);
  if(!coming.length) return `<div class="row-sub" style="margin-top:8px">${regsError[eventId] ? esc(regsError[eventId])
      : regCount || regsLoading[eventId] ? 'Loading who is coming…' : 'Nobody registered yet.'}</div>
    <div class="btnrow" style="margin-top:9px">
      <button class="btn sm" onclick="openEvent('${eventId}')">Full details</button>
      <button class="btn sm" onclick="printSignInSheet('${eventId}')">Blank sign-in sheet</button></div>`;
  const toggle = `<button class="btn sm ${open?'':'primary'}" onclick="toggleCalList('${eventId}')">
      ${open ? 'Hide the list' : `See the list · ${coming.length}`}</button>`;
  return `<div class="row-sub" style="margin-top:9px;font-weight:600">
      ${coming.length} coming — ${coming.length-guests.length} registered${guests.length?`, ${guests.length} guest${guests.length===1?'':'s'}`:''}</div>
    ${open ? `<div class="btnrow" style="margin-top:8px">${toggle}</div>
      <div style="margin-top:6px">${coming.map(a=>`<div class="kv" style="padding:5px 0">
        <span>${a.name?esc(a.name):'<span style="color:var(--ink-muted)">name not given</span>'}
          ${a.guestOf?`<span class="tag later">${esc(a.kind)}</span>`:''}</span>
        <span class="row-sub">${a.guestOf?`${esc(a.kind.toLowerCase())} of ${esc(a.guestOf)}`:esc(a.business||'')}${a.phone?' · '+esc(a.phone):''}</span>
      </div>`).join('')}</div>` : ''}
    <div class="btnrow" style="margin-top:9px">
      ${toggle}
      <button class="btn sm" onclick="openEvent('${eventId}')">Full details</button>
      <button class="btn sm" onclick="printSignInSheet('${eventId}')">Sign-in sheet</button>
    </div>`;
}

/**
 * A sign-in sheet to carry to the event.
 *
 * Every attendee gets a line with a box to tick — guests included, listed
 * under the person who registered them, because at the door you are ticking
 * people off, not registrations. Blank lines at the end for walk-ins.
 */
/**
 * Everyone expected at an event: each registrant, and the guest they are
 * bringing as their own line. At the door you tick off people, not
 * registrations, so guests need to be visible in their own right.
 */
/* Search an event's registrations in place, so the box keeps its focus */
function filterRegs(){
  const q = (ui.regQ || '').trim().toLowerCase();
  let n = 0;
  document.querySelectorAll('.reg-block').forEach(b => { const hit = !q || b.dataset.q.includes(q); b.hidden = !hit; if(hit) n++; });
  const none = document.getElementById('regNone'); if(none) none.hidden = n > 0;
}
function attendeeList(eventId){
  const out = [];
  eventRegs(eventId).forEach(r => {
    if(r.attending === 'Cancelled') return;      // cancelled people are not coming
    out.push({
      key: r.id, name: r.name, business: r.business || '',
      phone: r.phone || '', email: r.email || '',
      kind: 'Registered', attending: r.attending, attended: r.attended,
    });
    // Each guest is a person in their own right, from the Guests subform.
    (r.guestList && r.guestList.length ? r.guestList : []).forEach((g, i) => {
      out.push({
        key: `${r.id}_g${i}`,
        name: g.name || '',                    // blank when Zoho holds no name
        business: g.business || '',
        phone: g.phone || '', email: g.email || '',
        address: g.address || '',
        kind: g.type || 'Guest',               // Spouse | Other Guest
        guestOf: r.name, attended: g.attended || '',
      });
    });
  });
  return out;
}

  const heads = lines.length;

    <p style="margin:0 0 14px;color:#555;font-size:12px">
      ${regs.length} registered · ${heads} expected including guests</p>
    <table style="width:100%;border-collapse:collapse;font-size:13px">
      <thead><tr style="border-bottom:2px solid #333">
        <th style="width:34px;padding:5px;text-align:center">In</th>
        <th style="text-align:left;padding:5px 9px">Name</th>
        <th style="text-align:left;padding:5px 9px">Business / notes</th>

      </tbody>
    </table>
    <p style="margin-top:14px;font-size:11px;color:#777">
      Tick the box as each person arrives. Blank lines are for walk-ins —
      please add their name and business so the office can follow up.</p>`);
}

/* ══════════════════ TIME AND EXPENSES ══════════════════ */
function vTimesheet() {
  const repId = isRep() ? ui.me : (ui.tsRep || null);
  const time = S.timeEntries.filter(t => !repId || t.repId === repId).sort((a, b) => b.date.localeCompare(a.date));
  const exp = S.expenses.filter(x => !repId || x.repId === repId).sort((a, b) => b.date.localeCompare(a.date));

  const month = TODAY_S.slice(0, 7);
  /**
   * The figures cover work still in hand. Anything already sent to accounting
   * is settled, so counting it here made the month look permanently unpaid
   * and gave no sense of what is actually outstanding.
   */
  // Outstanding = submitted or approved but not yet sent to accounting, from
  // any month. Counting only this month left September's hours out of it.
  const live = x => x.status === 'Submitted' || x.status === 'Approved';
  const hoursMonth = Math.round(time.filter(live).reduce((s, t) => s + t.hours, 0) * 100) / 100;
  const expMonth = exp.filter(live).reduce((s, x) => s + x.amount, 0);
  const pendingExp = exp.filter(x => x.status === 'Submitted').reduce((s, x) => s + x.amount, 0);
  const pendingHrs = Math.round(time.filter(t => t.status === 'Submitted').reduce((s, t) => s + t.hours, 0) * 100) / 100;
  const sentCount = time.filter(t => !live(t)).length + exp.filter(x => !live(x)).length;

  const row = (t, isExp) => `<div class="row">
    <div class="row-main">
      <div class="row-title">${isExp ? money(t.amount) : t.hours + (t.hours === 1 ? ' hour' : ' hours')} — ${esc(t.category)}</div>
      <div class="row-sub">${fmt(t.date)}${isOffice() ? ' · <strong>' + esc(t.repName || pname(t.repId) || 'Unknown') + '</strong>' : ''}${isExp && t.vendor ? ' · ' + esc(t.vendor) : ''} · ${esc(t.description)}</div>
      ${isExp && isOffice() && t.billError ? `<div class="row-sub" style="color:var(--rust)">Zoho Books: ${esc(t.billError)}</div>` : ''}
    </div>
    <div class="row-actions">
      ${isExp && t.receipt ? `<button class="btn sm" onclick="viewReceipt('${t.id}')">Receipt</button>`
        : isExp ? `<span class="tag ${t.receiptDropped ? 'overdue' : 'later'}">${t.receiptDropped ? 'receipt failed' : 'no receipt'}</span>` : ''}
      ${isExp && can('books') && t.billId ? `<span class="tag ok" title="Bill ${esc(t.billId)} in Zoho Books">Bill in Books</span>` : ''}
      <span class="tag ${t.status === 'Approved' || t.status === 'Reimbursed' ? 'ok' : t.status === 'Declined' ? 'overdue' : t.status === 'Draft' ? 'later' : 'soon'}">${t.status === 'Declined' ? 'Sent back' : t.status}</span>
      ${isOffice() && can('accounting') && t.status === 'Submitted' ? `<button class="btn sm" onclick="openDecline('${isExp ? 'exp' : 'time'}','${t.id}')">Decline</button>
        <button class="btn sm primary" onclick="approveEntry('${isExp ? 'exp' : 'time'}','${t.id}')">Approve</button>` : ''}
      ${isRep() && t.status === 'Declined' ? `<button class="btn sm primary" onclick="openResubmit('${isExp ? 'exp' : 'time'}','${t.id}')">Fix and send again</button>` : ''}
    </div></div>
    ${t.status === 'Declined' && t.declineNote ? `<div class="decline-note">Sent back: ${esc(t.declineNote)}</div>` : ''}`;

  return `<div class="section-head">
      <div><h2>Hours and expenses</h2>
      <div class="sub">${isOffice() ? 'What reps have submitted, ready to pass to accounting.' : 'Log what you worked and what you spent. The office picks it up from here.'}</div></div>
      ${isOffice() ? repPicker('tsRep', PEOPLE.filter(p => p.role === 'rep'), ui.tsRep, 'All reps') : ''}
    </div>
    <div class="stats">
      <div class="stat"><div class="n">${hoursMonth}</div><div class="l">Hours outstanding</div></div>
      <div class="stat"><div class="n">${money(expMonth)}</div><div class="l">Expenses outstanding</div></div>
      <div class="stat"><div class="n" style="color:var(--accent)">${pendingHrs ? pendingHrs + ' h' + (pendingExp ? ' · ' : '') : ''}${pendingExp || !pendingHrs ? money(pendingExp) : ''}</div><div class="l">Awaiting approval</div></div>
    </div>
    ${(() => { const t = getTimer();
      return t ? `<div class="callout ok" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
        <div><strong>Timer running — ${timerLabel(t)}</strong>${esc(t.category)}${t.note ? ' · ' + esc(t.note) : ''}</div>
        <div class="btnrow"><button class="btn sm primary" onclick="stopTimer()">Stop and save</button>
        <button class="btn sm" onclick="cancelTimer()">Discard</button></div></div>` : ''; })()}
    <div class="btnrow" style="margin-bottom:8px">
      ${getTimer() ? '' : `<button class="btn primary" onclick="openTimerStart()">Start timer</button>`}
      <button class="btn" onclick="openTime()">Log hours</button>
      <button class="btn primary" onclick="openExpense()">Add an expense</button>
      <button class="btn" onclick="repPDF(timesheetPDF)">Timesheet PDF</button>
      <button class="btn" onclick="repPDF(expenseReportPDF)">Expense claim PDF</button>
      <button class="btn" onclick="exportAccounting()">Export CSV</button>
      <button class="btn" onclick="exportAccountingPDF()">Export PDF</button>
    </div>
    ${isOffice() ? (() => {
      const approved = [...S.timeEntries.filter(t => t.status === 'Approved'), ...S.expenses.filter(x => x.status === 'Approved')];
      const pend = [...S.timeEntries.filter(t => t.status === 'Submitted'), ...S.expenses.filter(x => x.status === 'Submitted')];
      const day = S.settings.accountingDay || '1';
      return `${acctStatusCallouts()}
        <div class="callout ${approved.length ? 'ok' : 'info'}">
        <strong>${approved.length} approved item${approved.length === 1 ? '' : 's'} ready for ${esc(S.settings.accountingEmail || 'accounting')}</strong>
        ${day === 'Off' ? '' : `On the ${day === 'Last' ? 'last day' : day + (day === '1' ? 'st' : 'th')} of each month they are put in front of the admins for final approval.`}
        ${isAdmin() ? 'As an admin, Send now goes straight to accounting.' : 'Sending puts them on the Approvals screen for an admin to give the final approval.'}
        ${pend.length ? ` ${pend.length} item${pend.length === 1 ? ' is' : 's are'} still waiting on approval and won't be included.` : ''}
        <div class="btnrow" style="margin-top:9px">
          <button class="btn sm primary" onclick="sendToAccounting()">${isAdmin() ? 'Send now' : 'Send for final approval'}</button>
          <button class="btn sm" onclick="previewAccounting()">Preview what goes</button>
        </div></div>`; })() : ''}
    ${(() => {
      /**
       * Split by state. Approved and reimbursed items used to sit in the same
       * list as things still waiting, so the office had to read every row to
       * find the ones needing a decision.
       */
      const tab = ui.tsTab || 'waiting';
      const bucket = (list, which) => list.filter(x =>
        which === 'waiting'   ? x.status === 'Submitted' :
        which === 'approved'  ? x.status === 'Approved'  :
        which === 'declined'  ? x.status === 'Declined'  :
                                x.status === 'Reimbursed');

      const counts = {
        waiting:   bucket(time,'waiting').length   + bucket(exp,'waiting').length,
        approved:  bucket(time,'approved').length  + bucket(exp,'approved').length,
        reimbursed:bucket(time,'reimbursed').length+ bucket(exp,'reimbursed').length,
        declined:  bucket(time,'declined').length  + bucket(exp,'declined').length,
      };
      const t2 = bucket(time, tab), e2 = bucket(exp, tab);
      const label = { waiting:'Waiting on approval', approved:'Approved', reimbursed:'Sent to accounting', declined:'Sent back' };
      const blank = {
        waiting:'Nothing waiting. Everything submitted has been dealt with.',
        approved:'Nothing approved yet.',
        reimbursed:'Nothing has been sent to accounting yet.',
        declined:'Nothing has been sent back.',
      };

      return `<div class="chips">${['waiting','approved','reimbursed', ...(counts.declined ? ['declined'] : [])].map(k =>
        `<button class="chip ${tab===k?'on':''}" onclick="ui.tsTab='${k}';renderContent()">
          ${label[k]}${counts[k]?` · ${counts[k]}`:''}</button>`).join('')}</div>

        ${t2.length ? `<h3 class="sub-h">Hours</h3>${t2.map(x => row(x,false)).join('')}` : ''}
        ${e2.length ? `<h3 class="sub-h">Expenses</h3>${e2.map(x => row(x,true)).join('')}` : ''}
        ${!t2.length && !e2.length ? `<div class="empty">${blank[tab]}</div>` : ''}`;
    })()}`;
}

/** What accounting receives: approved items only, grouped by rep. */
function accountingPayload() {
  const time = S.timeEntries.filter(t => t.status === 'Approved');
  const exp = S.expenses.filter(x => x.status === 'Approved');
  const byRep = {};
  [...time.map(t => ({ ...t, kind: 'time' })), ...exp.map(x => ({ ...x, kind: 'exp' }))].forEach(r => {
    (byRep[r.repId] = byRep[r.repId] || []).push(r);
  });
  const hours = time.reduce((s, t) => s + t.hours, 0);
  const amount = exp.reduce((s, x) => s + x.amount, 0);
  const missing = exp.filter(x => !x.receipt).length;
  return { time, exp, byRep, hours, amount, missing };
}

async function sendToAccounting() {
  const p = accountingPayload();
  if (!p.time.length && !p.exp.length) { toast('Nothing approved to send yet'); return; }
  const to = S.settings.accountingEmail || 'accounting@symbiz.org';

  // Send from the server. Opening the viewer's mail client meant signing into
  // webmail and attaching the CSV by hand, which nobody would keep doing.
  if (API.live) {
    openModal(`<h3>Sending to ${esc(to)}…</h3><p class="lead">One moment.</p>`);
    try {
      const out = await API.accountingSend();
      if (out.awaitingApproval) {
        S.acctBatches = await API.accountingBatches().catch(() => S.acctBatches);
        openModal(`<h3>Waiting for final approval</h3>
          <p class="lead">${out.expenses} expense${out.expenses === 1 ? '' : 's'} (${money(out.amount)}) and ${out.time} time entr${out.time === 1 ? 'y' : 'ies'}
            are on the Approvals screen for an admin. When an admin approves them they go to ${esc(to)}${S.settings.booksAuto !== 'off' ? ' and into Zoho Books' : ''}.
            If they're sent back, the note will show here in Hours and expenses.</p>
          <div class="m-actions"><button class="btn primary" onclick="closeModal();render()">Done</button></div>`);
        return;
      }
      const [t, x] = await Promise.all([API.time(), API.expenses()]);
      S.timeEntries = t.map(adapt.timeEntry);
      S.expenses = x.map(adapt.expense);
      save();
      openModal(`<h3>Sent</h3>
        <p class="lead">${out.time} time entr${out.time === 1 ? 'y' : 'ies'} and ${out.expenses} expense${out.expenses === 1 ? '' : 's'}
          emailed to ${esc(out.to || to)}, and marked as sent so nothing is claimed twice.</p>
        ${out.books && can('books') ? booksResult(out.books) || (out.books.error
          ? `<div class="callout rust"><strong>Zoho Books bills not made yet</strong>${esc(out.books.error)} They will be retried; see Settings → Zoho Books.</div>`
          : `<div class="callout ${out.books.failed ? 'rust' : 'ok'}"><strong>Zoho Books</strong>
              ${out.books.made} bill${out.books.made === 1 ? '' : 's'} made with receipts attached${out.books.left ? `; ${out.books.left} more within 15 minutes` : ''}.
              ${out.books.failed ? `${out.books.failed} could not be made — see Settings → Zoho Books.` : ''}</div>`) : ''}
        <div class="m-actions"><button class="btn primary" onclick="closeModal();render()">Done</button></div>`);
    } catch (e) {
      const mailOff = /mail|smtp|not configured/i.test(e.message || '');
      openModal(`<h3>Couldn't send</h3>
        <p class="lead">${esc(e.message || 'Unknown error')}</p>
        ${mailOff ? `<div class="callout">Email isn't switched on for this site yet. Add the SMTP settings,
          or use Export CSV and send it yourself this once.</div>` : ''}
        <div class="m-actions">
          <button class="btn" onclick="closeModal();exportAccounting()">Export CSV instead</button>
          <button class="btn primary" onclick="closeModal()">Close</button></div>`);
    }
    return;
  }

  // Not connected to a server: fall back to a CSV the office sends themselves.
  exportAccounting();
  toast('Exported — attach it to an email for ' + to);
}

async function submitTime(e) {
  e.preventDefault(); const f = e.target;
  const entry = {
    date: fv(f, 'date'), hours: parseFloat(fv(f, 'hours')) || 0,
    category: fv(f, 'category'), description: fv(f, 'description'),
  };
  // From the timer: it keeps running until the hours are actually saved, so
  // Cancel or a failed send never loses the time
  const fromTimer = !!f.elements.namedItem('fromTimer');
  if (API.live) {
    try {
      await API.addTime(entry);
      if (fromTimer) setTimer(null);
      closeModal(); toast('Hours submitted');
      S.timeEntries = (await API.time()).map(adapt.timeEntry); save(); render();
      return;
    } catch (ex) {
      if (ex.offline) {
        Later.add('/time', entry, `your ${entry.hours} hours on ${fmt(entry.date)}`);
        if (fromTimer) setTimer(null);
        closeModal(); toast('No signal: your hours are saved on this phone and will be sent when you have signal'); render();
        return;
      }
      toast(ex.message || 'Could not submit hours'); return;
    }
  }
  if (fromTimer) setTimer(null);
  S.timeEntries.push({ id: 't_' + (S.ids.time++), repId: ui.me, ...entry, status: 'Submitted' });
  save(); queueWrite('time'); logAudit('Submitted hours'); closeModal(); toast('Hours submitted'); render();
}

async function submitExpense(e) {
  e.preventDefault(); const f = e.target;
  const base = {
    date: fv(f, 'date'), amount: parseFloat(fv(f, 'amount')) || 0,
    category: fv(f, 'category'), description: fv(f, 'description'),
    vendor: (fv(f, 'vendor') || '').trim(),
  };

  if (API.live) {
    try {
      await API.addExpense({
        ...base,
        receiptName: pendingReceipt ? pendingReceipt.name : undefined,
        receiptType: pendingReceipt ? pendingReceipt.type : undefined,
        receiptData: pendingReceipt ? pendingReceipt.data : undefined,
      });
      pendingReceipt = null; closeModal();
      toast('Expense submitted');
      S.expenses = (await API.expenses()).map(adapt.expense); save(); render();
      return;
    } catch (ex) {
      toast(ex.message || 'Could not submit the expense');
      return;
    }
  }

  const entry = {
    id: 'x_' + (S.ids.exp++), repId: ui.me, ...base, status: 'Submitted',
    hasReceipt: !!pendingReceipt, receipt: pendingReceipt || null,
  };
  S.expenses.push(entry);
  try { save(); }
  catch (err) {
    entry.receipt = null; entry.hasReceipt = false; entry.receiptDropped = true;
    save();
    toast('Expense saved, but the receipt was too large to store');
    pendingReceipt = null; closeModal(); render(); return;
  }
  queueWrite('expense'); logAudit('Submitted an expense');
  pendingReceipt = null; closeModal();
  toast(entry.receipt ? 'Expense and receipt submitted' : 'Expense submitted');
  render();
}

function submitAssignByRegion(e){
  e.preventDefault();
  const selects = [...e.target.querySelectorAll('select[data-region]')];
  const mapping = {};
  selects.forEach(sel=>{ if(sel.value) mapping[sel.getAttribute('data-region')] = sel.value; });
  let moved = 0;
  S.members.forEach(m=>{
    const k = (m.region||'').trim() || '(none)';
    if(mapping[k] && m.repId !== mapping[k]){ m.repId = mapping[k]; moved++; }
  });
  // rings follow whoever holds most of their members
  S.rings.forEach(r=>{
    const mem = ringMembers(r.id);
    if(!mem.length) return;
    const tally = {};
    mem.forEach(m=>{ tally[m.repId]=(tally[m.repId]||0)+1; });
    const top = Object.entries(tally).sort((a,b)=>b[1]-a[1])[0];
    if(top) r.repId = top[0];
  });
  S.activities.forEach(a=>{
    if(a.memberId){ const m = member(a.memberId); if(m) a.repId = m.repId; }
    else if(a.ringId){ const g = ring(a.ringId); if(g) a.repId = g.repId; }
  });
  save(); logAudit(`Reassigned ${moved} members by region`);
  closeModal();
  toast(`${moved} member${moved===1?'':'s'} reassigned`);
  render();
}

/* ══════════════════ RECEIPT ATTACHMENTS ══════════════════
 * A photo or PDF of the receipt, stored with the expense.
 *
 * Browser storage is small (a few MB total), so images are resized and
 * recompressed before saving — a phone photo is 3-5MB raw and would fill
 * the quota in a handful of expenses. PDFs are kept as-is but capped.
 * In the live build these upload to the server instead; this keeps the
 * same user flow so nothing changes for the rep when that happens.
 */
const RECEIPT_MAX_BYTES = 1_500_000;     // after compression
const RECEIPT_MAX_EDGE = 1400;           // px, plenty for a legible receipt

function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(new Error('Could not read that file'));
    r.readAsDataURL(file);
  });
}

/** Shrink a photo so a dozen receipts still fit in storage. */
function compressImage(dataUrl) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      let { width: w, height: h } = img;
      const scale = Math.min(1, RECEIPT_MAX_EDGE / Math.max(w, h));
      w = Math.round(w * scale); h = Math.round(h * scale);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      try { resolve(c.toDataURL('image/jpeg', 0.72)); }
      catch { resolve(dataUrl); }
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

let pendingReceipt = null;   // {name, type, size, data}

async function handleReceiptPick(input) {
  const file = input.files && input.files[0];
  const slot = document.getElementById('receiptSlot');
  if (!file) { pendingReceipt = null; if (slot) slot.innerHTML = ''; return; }

  if (slot) slot.innerHTML = `<div class="row-sub">Reading ${esc(file.name)}…</div>`;
  try {
    let data = await readFileAsDataURL(file);
    const isImage = /^image\//.test(file.type);
    if (isImage) data = await compressImage(data);

    const approxBytes = Math.round((data.length - (data.indexOf(',') + 1)) * 0.75);
    if (approxBytes > RECEIPT_MAX_BYTES) {
      pendingReceipt = null;
      if (slot) slot.innerHTML = `<div class="row-sub" style="color:var(--rust)">
        That file is too big to store here (${(approxBytes / 1e6).toFixed(1)}MB).
        ${isImage ? 'Try taking the photo again from further back.' : 'Try a smaller PDF, or bring the paper copy to the office.'}</div>`;
      input.value = '';
      return;
    }

    pendingReceipt = { name: file.name, type: file.type, size: approxBytes, data };
    if (slot) slot.innerHTML = receiptPreview(pendingReceipt, true);
  } catch (e) {
    pendingReceipt = null;
    if (slot) slot.innerHTML = `<div class="row-sub" style="color:var(--rust)">${esc(e.message)}</div>`;
  }
}

function receiptPreview(r, removable) {
  const isImage = /^image\//.test(r.type);
  const isPdf = /pdf/i.test(r.type) || /\.pdf$/i.test(r.name || '');
  return `<div class="card flat" style="margin:8px 0 0;padding:10px;display:flex;gap:10px;align-items:center">
    ${isImage
      ? `<img src="${r.data}" alt="Receipt" style="width:52px;height:52px;object-fit:cover;border-radius:6px;border:1px solid var(--line)">`
      : `<div style="width:52px;height:52px;border-radius:6px;border:1px solid var(--line);background:var(--rust-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px">
           <div style="font-size:10.5px;font-weight:800;color:var(--rust);letter-spacing:.04em">PDF</div></div>`}
    <div style="flex:1;min-width:0">
      <div class="row-title" style="font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name)}</div>
      <div class="row-sub">${(r.size / 1024).toFixed(0)} KB · ${isPdf ? 'PDF' : isImage ? 'photo' : 'file'} attached</div>
    </div>
    <div class="btnrow">
      <a class="btn sm" href="${r.data}" target="_blank" rel="noopener" download="${esc(r.name)}">Open</a>
      ${removable ? `<button type="button" class="btn sm" onclick="clearReceipt()">Remove</button>` : ''}
    </div>
  </div>`;
}

async function viewReceipt(expenseId, { backToBatch } = {}) {
  const x = S.expenses.find(e => e.id === expenseId);
  if (!x || !x.receipt) { toast('No receipt attached'); return; }
  // Receipts are not shipped with the list — fetch the file only when opened
  if (API.live && !x.receipt.data && x.receipt.serverId) {
    toast('Fetching the receipt…');
    try {
      const r = await API.receipt(x.receipt.serverId);
      x.receipt = { ...x.receipt, name: r.name, type: r.type, data: r.data };
    } catch (ex) { toast('Could not load that receipt'); return; }
  }
  const isImage = /^image\//.test(x.receipt.type);

/* ══════════════════ LIVE TIMER ══════════════════
 * Reps asked to record time worked. Typing hours after the fact means
 * guessing; a start/stop timer that survives closing the app does not.
 */
const TIMER_KEY = 'rephub_timer';
function getTimer() {
  try { return JSON.parse(localStorage.getItem(TIMER_KEY) || 'null'); } catch { return null; }
}
function setTimer(t) {
  try { t ? localStorage.setItem(TIMER_KEY, JSON.stringify(t)) : localStorage.removeItem(TIMER_KEY); } catch {}
}
function startTimer(category, note) {
  setTimer({ startedAt: Date.now(), category: category || 'Growth Ring visit', note: note || '', repId: ui.me });
  toast('Timer started');
  render();
}
function timerElapsedHours(t) {
  return Math.max(0.25, Math.round(((Date.now() - t.startedAt) / 3_600_000) * 4) / 4);  // nearest 15 min
}
function timerLabel(t) {
  const mins = Math.floor((Date.now() - t.startedAt) / 60000);
  const h = Math.floor(mins / 60), m = mins % 60;
  return h ? `${h}h ${m}m` : `${m}m`;
}
function stopTimer() {
  const t = getTimer();
  if (!t) return;
  const hours = timerElapsedHours(t);
  // The day it was started, not today: a timer left running overnight belongs to yesterday
  const s = new Date(t.startedAt);
  const startDay = `${s.getFullYear()}-${String(s.getMonth()+1).padStart(2,'0')}-${String(s.getDate()).padStart(2,'0')}`;
  openModal(`<h3>Stop timer</h3>
    <p class="lead">You've been on this for ${hours} hour${hours === 1 ? '' : 's'}. Check it and add a note. The timer keeps running until you save.</p>
    <form onsubmit="submitTime(event)"><input type="hidden" name="fromTimer" value="1">
      <div class="two">
        <div class="field"><label>Date</label><input type="date" name="date" value="${startDay}" required></div>
        <div class="field"><label>Hours</label><input type="number" name="hours" step="0.25" min="0.25" value="${hours}" required></div>
      </div>
      <div class="field"><label>What were you doing?</label><select name="category">
        ${TIME_CATEGORIES.map(c => `<option ${c === t.category ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
      <div class="field"><label>Details</label><textarea name="description" required>${esc(t.note)}</textarea></div>
      <div class="m-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button>
      <button type="submit" class="btn primary">Save hours</button></div></form>`);
}
function cancelTimer() { setTimer(null); toast('Timer discarded'); render(); }

function openTimerStart() {
  openModal(`<h3>Start a timer</h3>
    <p class="lead">It keeps running if you close the app, so you can start it as you leave and stop it when you're back.</p>
    <form onsubmit="submitTimerStart(event)">
      <div class="field"><label>What are you doing?</label><select name="category">
        ${TIME_CATEGORIES.map(c => `<option>${c}</option>`).join('')}</select></div>
      <div class="field"><label>Note</label><input name="note" placeholder="Which group or member"></div>
      <div class="m-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button>
      <button type="submit" class="btn primary">Start</button></div></form>`);
}
function submitTimerStart(e) {
  e.preventDefault();
  const f = e.target;
  closeModal();
  startTimer(fv(f, 'category'), fv(f, 'note'));
}

/** Expense claim with the receipts appended — what accounting actually needs. */
function expenseReportPDF(repId, { onlyIds } = {}) {
  const rep = PEOPLE.find(p => p.id === repId) || me();
  let list = S.expenses.filter(x => x.repId === repId);
  if (onlyIds) list = list.filter(x => onlyIds.includes(x.id));
  if (!list.length) { toast('No expenses to include'); return; }
  list = list.slice().sort((a, b) => a.date.localeCompare(b.date));
  const total = list.reduce((s, x) => s + x.amount, 0);

  const rows = list.map(x => `<tr>
    <td>${fmt(x.date)}</td><td>${esc(x.category)}</td><td>${esc(x.description)}</td>
    <td>${x.receipt ? 'Attached' : 'None'}</td><td class="num">${money(x.amount)}</td></tr>`).join('');

  const receipts = list.filter(x => x.receipt).map((x, i) => `
    <div class="rcpt"><h2>Receipt ${i + 1} — ${esc(x.category)}, ${money(x.amount)}, ${fmt(x.date)}</h2>
    ${/^image\//.test(x.receipt.type)
      ? `<img src="${x.receipt.data}" alt="Receipt">`
      : `<p style="font-size:12px">PDF receipt attached separately: <strong>${esc(x.receipt.name)}</strong></p>`}
    </div>`).join('');

  openPrintable('Expense claim', `
    ${orgHeader('Expense Claim', `${esc(rep.name)}<br>${fmt(TODAY_S)}`)}
    <table><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Receipt</th><th class="num">Amount</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr><td colspan="4">Total claimed</td><td class="num">${money(total)}</td></tr></tfoot></table>
    <div class="sig"><div>Rep signature and date</div><div>Approved by</div></div>
    <p class="note">Send to accounting@symbiz.org. Receipts follow on the next pages where attached.</p>
    ${receipts}`);
}

/** Helper: run the real cadence function and report the gap in days. */
function nextDueCheck(type, outcome, facFreq, memFreq) {
  const g = { facFreq, memFreq };
  let nextDue = null;
  const date = '2026-09-18';
  const retry = parseInt(S.settings.retryDays || 4, 10);
  const resched = parseInt(S.settings.rescheduleDays || 7, 10);
  if (outcome === 'No answer' || outcome === 'Left voicemail') nextDue = addDays(date, retry);
  else if (outcome === 'Rescheduled') nextDue = addDays(date, resched);
  else if (type === 'Facilitator Call') nextDue = addDays(date, freqDays(g.facFreq));
  else if (type === 'Member Call') nextDue = addDays(date, freqDays(g.memFreq));
  if (!nextDue) return null;
  return Math.round((new Date(nextDue + 'T00:00:00Z') - new Date(date + 'T00:00:00Z')) / 86400000);
}

let checkResults = null;
let checkDetail = '';
function runChecks() {
  const started = performance.now();
  checkResults = CHECKS.map(c => {
    let pass = false, err = null;
    checkDetail = '';
    try { pass = !!c.run(); if (!pass && checkDetail) err = checkDetail; }
    catch (e) { pass = false; err = e.message; }
    return { ...c, pass, err };
  });
  checkResults.ms = Math.round(performance.now() - started);
  render();
}

function vChecks() {
  const groups = [...new Set(CHECKS.map(c => c.group))];
  const r = checkResults;
  const passed = r ? r.filter(x => x.pass).length : 0;
  const failed = r ? r.length - passed : 0;

  return `<div class="section-head">
      <div><h2>System check</h2>
      <div class="sub">Runs real checks against the live app, right now. Nothing here is a recorded result.</div></div>
      <button class="btn primary" onclick="runChecks()">${r ? 'Run again' : 'Run all checks'}</button></div>

    <div class="card flat" style="font-size:12.5px;margin-bottom:12px">
      <div class="kv"><span class="k">Build running</span><span>${esc(BUILD)}</span></div>
      <div class="kv"><span class="k">Connected to a server</span><span>${API.live?'Yes':'No — working on this device'}</span></div>
      <div class="kv"><span class="k">Zoho</span><span>${zohoConnected?'Connected':'Not connected'}</span></div>
      <div class="kv"><span class="k">Writing to Zoho</span><span>${API.readOnly?'Read-only':'On'}</span></div>
    </div>

    ${r ? `<div class="stats">
      <div class="stat"><div class="n" style="color:var(--primary)">${passed}</div><div class="l">Passed</div></div>
      <div class="stat"><div class="n" style="color:${failed ? 'var(--rust)' : 'var(--ink-faint)'}">${failed}</div><div class="l">Failed</div></div>
      <div class="stat"><div class="n">${r.length}</div><div class="l">Checks run</div></div>
      <div class="stat"><div class="n">${r.ms}ms</div><div class="l">Time taken</div></div>
    </div>
    <div class="callout ${failed ? 'rust' : 'ok'}">
      <strong>${failed ? `${failed} check${failed === 1 ? '' : 's'} failed` : 'Everything passed'}</strong>
      ${failed ? 'Details below — each failure names what broke.' : 'Every rule, permission, screen and report behaved as expected.'}
    </div>` : `<div class="callout info"><strong>Not run yet</strong>
      Press the button. The checks execute in this browser against the same code the reps use.</div>`}

    ${groups.map(g => {
      const items = (r || CHECKS).filter(c => c.group === g);
      const gp = r ? items.filter(i => i.pass).length : 0;
      return `<h3 class="sub-h">${g} ${r ? `<span class="tag ${gp === items.length ? 'ok' : 'overdue'}">${gp}/${items.length}</span>` : ''}</h3>
        ${items.map(c => `<div class="row">
          <div class="row-main">
            <div class="row-title">${r ? (c.pass ? '✓ ' : '✗ ') : ''}${esc(c.name)}</div>
            ${c.why ? `<div class="row-sub">${esc(c.why)}</div>` : ''}
            ${r && c.err ? `<div class="row-sub" style="color:var(--rust)">${esc(c.err)}</div>` : ''}
          </div>
          ${r ? `<span class="tag ${c.pass ? 'ok' : 'overdue'}">${c.pass ? 'pass' : 'fail'}</span>` : '<span class="tag later">not run</span>'}
        </div>`).join('')}`;
    }).join('')}

    <h3 class="sub-h">What these checks do not cover</h3>
    <div class="callout">
      <strong>Being straight about the limits</strong>
      These prove the rules, screens, permissions and reports behave correctly. They cannot prove the
      connection to Symbiz's own Zoho account, because that hasn't been connected yet. Two things stay
      unverified until it is: that the Zoho modules match what the code expects, and how it behaves with
      years of real data rather than this sample. Both get settled in the pilot.
    </div>`;
}

/**
 * Put the signed-in person into the app.
 *
 * A rep's identity here is their ZOHO CONTACT id, because that is what
 * Growth_Ring_Groups.Regional_Rep points at and what every screen filters on.
 * Office and director accounts keep their own login id — they see everything.
 */
function signInAs(user, { keepView } = {}){
  const isRep = user.role === 'rep';
  const id = isRep ? (user.zoho_owner_id || user.id) : user.id;
  const entry = { id, name: user.name, email: user.email, role: user.role, region: user.region || '',
    owner: !!user.owner, perms: user.perms || null };
  const at = PEOPLE.findIndex(p => p.id === id);
  at >= 0 ? PEOPLE[at] = entry : PEOPLE.push(entry);
  // Remembered so a refresh opens straight into the app instead of showing
  // the sign-in screen while the session is checked.
  try{ localStorage.setItem('rephub_user', JSON.stringify(user)); }catch(e){}
  const same = ui.me === id;
  ui.me = id;
  if(keepView && same) return;
  ui.view = isRep ? 'today' : 'dash';
  if(!resumingSession) applyGoto();      // a link from an email, followed after signing in
  if (isRep && !user.zoho_owner_id) {
    setTimeout(()=>toast('Your login is not linked to a Zoho contact yet — ask the office'), 400);
  }
}

/* A tapped sign-in link takes priority over any stored session */
(async () => {
  if(await trySetupLink()) return;
  if(await trySignInLink()) return;
  if(!API.token) return;
  try{
    const out = await API.me();
    signInAs(out.user, { keepView: true });   // already showing from the remembered user
    render();
    refreshMode().then(() => renderContent());   // alongside the data, not before it
    await loadFromServer();
    render();
    if(navigator.onLine && OutBox.count()) await OutBox.flush();
  }catch(e){
    // Only a real "you are signed out" ends the session. A dropped connection
    // on a train should not throw a rep back to the sign-in screen.
    if(e.message === 'SESSION_EXPIRED' || e.status === 401){ logout(); }
  }
})();

/* debug/test hook.
   loadFromServer, refreshMode and signInAs are function declarations and are
   already globals — reassigning them here would make each call recurse. */

window.TODAY_S=TODAY_S;
Object.defineProperty(window,'bulkPick',{get:()=>bulkPick,set:v=>{bulkPick=v;}});

window.signInAs=signInAs; window.checkSetup=checkSetup;

 .forEach(n=>{ try{ window[n]=eval(n); }catch(e){} });
window.REPORTS=REPORTS; window.RESOURCES=RESOURCES; window.KEY=KEY;
